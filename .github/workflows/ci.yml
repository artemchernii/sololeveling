name: CI

# Every phase lands through a PR (PLAN.md §4), so this runs there and on the
# branch it merges into. Nothing here deploys: pushing schema or functions to
# Convex is a deliberate act with a deploy key, not a consequence of merging.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # .nvmrc is the single answer to "which Node", shared with anyone
          # running nvm use locally.
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the point of running this at all: it catches a
      # dependency added locally without the lockfile that proves it installs.
      - run: pnpm install --frozen-lockfile

      # Two projects, two configs: the app compiles against the DOM, convex/
      # against the Convex runtime with its own generated types.
      - run: pnpm typecheck

      - run: pnpm lint --max-warnings 0

      - run: pnpm check

      # The invariants that fail silently: three quests a day, and a completed
      # task writing evidence it has no right to write.
      - run: pnpm test

      # `pnpm deploy` is `build && wrangler deploy`, so without this CI can be
      # green while shipping is broken. It needs no secrets: the Convex client
      # is built at render, not at module load.
      - run: pnpm build
