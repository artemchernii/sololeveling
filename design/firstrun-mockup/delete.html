<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Delete account mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* R8 · S3b — a guest's Settings, the last card: delete everything. Only
     guests have it (his pick, 27 Oct). Shapes from the built Settings page. */
  :root {
    --bg: #0d0e17; --ink-100: #e9e9ed; --ink-300: #b3b3c0; --ink-400: #8b8b9c; --ink-500: #6a6a7c;
    --accent: #9184d9; --accent-400: #b5abfc; --edge: rgba(233,233,237,.09);
    --danger: oklch(0.64 0.2 22); --good: oklch(0.72 0.15 150);
    --sys-shine: color-mix(in oklch, var(--accent-400) 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(900px 520px at 50% -10%, rgba(145,132,217,.14), transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-400) }
  .ctl { display:flex; gap:8px; flex-wrap: wrap; justify-content:center; padding: 14px 16px 0; font-family: var(--mono); font-size: 11px; letter-spacing:.08em }
  .ctl button { color: var(--ink-300); background: rgba(233,233,237,.05); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 11px }
  .ctl button.on { color: var(--ink-100); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
  .page { max-width: 760px; margin: 0 auto; padding: 22px 16px 80px; display:flex; flex-direction:column; gap: 18px }
  h1 { font-size: 30px; font-weight: 300 }
  .glass { border: 1px solid var(--edge); border-radius: 22px; padding: 24px; background: linear-gradient(155deg, rgba(233,233,237,.06), rgba(233,233,237,.02)) }
  .dim { opacity: .45 }
  .row { display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap: wrap }
  .badges { display:flex; gap: 6px; flex-wrap: wrap; margin-top: 12px }
  .badge { border: 1px solid var(--edge); border-radius: 999px; padding: 3px 9px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-300) }
  .badge b { color: var(--ink-100); font-weight: 500 }
  .del { border-color: color-mix(in oklch, var(--danger) 40%, transparent); transition: box-shadow .3s }
  .del.armed { box-shadow: 0 0 34px -12px var(--danger) }
  .btn { display:inline-flex; align-items:center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; font-family: var(--mono); font-size: 11px; letter-spacing: .2em }
  .btn.red { border: 1px solid var(--danger); color: var(--danger) }
  .btn.red:hover { background: color-mix(in oklch, var(--danger) 12%, transparent) }
  .btn.solid { background: var(--danger); color: #160d10; font-weight: 500; box-shadow: 0 0 22px -6px var(--danger) }
  .btn.ghost { border: 1px solid var(--edge); color: var(--ink-300) }
  .confirm { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--edge); animation: arrive .3s cubic-bezier(.2,.8,.2,1) both }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px) } }
  .bar { height: 4px; border-radius: 2px; background: rgba(233,233,237,.08); margin-top: 14px; overflow: hidden }
  .bar i { display:block; height: 100%; background: var(--danger); transition: width .25s linear }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(22,13,16,.35); border-top-color: #160d10; animation: spin .7s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* After: the sign-in page, one line of what went */
  .login { display:grid; place-items:center; min-height: 70vh }
  .sys { position: relative; width: 100%; max-width: 380px; border-radius: 18px; padding: 24px; border: 1px solid color-mix(in oklch, var(--accent-400) 34%, transparent);
    background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 13%, transparent), transparent 55%), rgba(233,233,237,.04);
    box-shadow: 0 0 38px -10px color-mix(in oklch, var(--accent) 55%, transparent); animation: arrive .45s both }
  .title { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--accent-400); text-shadow: 0 0 10px var(--sys-shine) }
  .gone { display:flex; align-items:center; gap: 8px; margin-top: 16px; color: var(--good); font-family: var(--mono); font-size: 11px; letter-spacing: .14em }
  .gone .tick { width: 20px; height: 20px; border-radius: 50%; display:grid; place-items:center; background: var(--good); color: #0d1a12; font-size: 11px; animation: pop .35s cubic-bezier(.3,1.6,.5,1) both }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } }
  .fake { margin-top: 18px; height: 38px; border-radius: 10px; border: 1px solid var(--edge); display:flex; align-items:center; padding: 0 12px; color: var(--ink-500) }
</style>
</head>
<body>
<div class="ctl" id="ctl">
  <button data-s="idle" class="on">GUEST · SETTINGS</button>
  <button data-s="confirm">PRESSED</button>
  <button data-s="deleting">DELETING</button>
  <button data-s="done">AFTER</button>
  <span style="width:12px"></span>
  <button data-s="artem">ARTEM · SETTINGS</button>
</div>
<div id="root"></div>

<script>
  const ROWS = 214, FILES = 3
  let state = 'idle', done = 0, timer = null
  const root = document.getElementById('root')

  function settings(guest) {
    return `<div class="page">
      <div><h1>Settings</h1></div>
      <div class="glass dim"><div class="caps">Appearance</div><div class="badges"><span class="badge">SYSTEM</span><span class="badge">LIGHT</span><span class="badge">DARK</span></div></div>
      <div class="glass dim"><div class="caps">Areas</div><div class="badges"><span class="badge">Projects</span><span class="badge">English</span><span class="badge">Body</span></div></div>
      ${guest ? del() : ''}
    </div>`
  }

  function del() {
    const counts = `<div class="badges">
        <span class="badge">IN THE APP · <b>${ROWS}</b> ROWS</span>
        <span class="badge"><b>${FILES}</b> FILES</span>
        <span class="badge">ACCOUNT · <b>marta@…</b></span></div>`
    let body = ''
    if (state === 'idle') body = `<div class="row" style="margin-top:16px"><span></span><button class="btn red" id="arm">DELETE ACCOUNT</button></div>`
    if (state === 'confirm') body = `<div class="confirm row"><span class="caps" style="color:var(--danger)">NO UNDO</span>
        <span style="display:flex;gap:8px"><button class="btn ghost" id="keep">KEEP</button><button class="btn solid" id="go">DELETE ALL</button></span></div>`
    if (state === 'deleting') body = `<div class="confirm"><div class="row"><span class="caps" style="color:var(--danger)">DELETING · ${done} OF ${ROWS}</span>
        <span class="btn solid" style="opacity:.7"><span class="spin"></span>DELETING</span></div>
        <div class="bar"><i style="width:${Math.round(done / ROWS * 100)}%"></i></div></div>`
    return `<div class="glass del ${state !== 'idle' ? 'armed' : ''}"><div class="caps" style="color:var(--danger)">Delete account</div>${counts}${body}</div>`
  }

  function render() {
    document.querySelectorAll('#ctl button').forEach(b => b.classList.toggle('on', b.dataset.s === state))
    if (state === 'done') {
      root.innerHTML = `<div class="login"><div class="sys"><span class="title">[ SIGN IN ]</span>
        <div class="gone"><span class="tick">✓</span>DELETED · ${ROWS} ROWS · ${FILES} FILES · ACCOUNT</div>
        <div class="fake">email</div></div></div>`
      return
    }
    root.innerHTML = settings(state !== 'artem')
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f }
    on('arm', () => { state = 'confirm'; render() })
    on('keep', () => { state = 'idle'; render() })
    on('go', start)
  }

  function start() {
    state = 'deleting'; done = 0; render()
    clearInterval(timer)
    timer = setInterval(() => {
      done = Math.min(ROWS, done + 23)
      render()
      if (done >= ROWS) { clearInterval(timer); setTimeout(() => { state = 'done'; render() }, 500) }
    }, 160)
  }

  document.getElementById('ctl').onclick = e => {
    const b = e.target.closest('button'); if (!b) return
    clearInterval(timer)
    state = b.dataset.s; if (state === 'deleting') { start(); return }
    render()
  }
  render()
</script>
</body>
</html>
