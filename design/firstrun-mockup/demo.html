<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo account mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Demo account (docs/specs/2026-10-27-demo-account.md) — his other Gmail
     on workers.dev, full of fake data, read-only. Shapes from guest.html. */
  :root {
    --bg: #0d0e17; --ink-100: #e9e9ed; --ink-300: #b3b3c0; --ink-400: #8b8b9c; --ink-500: #6a6a7c;
    --accent: #9184d9; --accent-400: #b5abfc; --edge: rgba(233,233,237,.09);
    --warn: oklch(0.80 0.15 75); --good: oklch(0.74 0.16 150); --bad: oklch(0.66 0.19 22);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(900px 520px at 50% -10%, rgba(145,132,217,.14), transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-400) }
  .ctl { display:flex; gap:8px; justify-content:center; flex-wrap: wrap; padding: 14px 16px 0; font-family: var(--mono); font-size: 11px; letter-spacing:.08em }
  .ctl button { color: var(--ink-300); background: rgba(233,233,237,.05); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 11px }
  .ctl button.on { color: var(--ink-100); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
  .phone { width: 390px; max-width: calc(100vw - 32px); margin: 18px auto 60px; border: 1px solid var(--edge); border-radius: 28px; padding: 14px 14px 18px;
    background: linear-gradient(155deg, rgba(233,233,237,.05), rgba(233,233,237,.015)); position: relative; overflow: hidden }
  .top { display:flex; align-items:center; justify-content: space-between; gap: 8px }
  .demo { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px;
    padding: 3px 9px; display:inline-flex; align-items:center; gap: 6px }
  .demo::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--warn); animation: pulse 2s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .3 } }
  .hello { font-size: 24px; font-weight: 300; margin-top: 14px }
  .lvl { display:flex; align-items:center; gap: 8px; margin-top: 6px }
  .lvl i { display:block; width: 70px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--ink-100) 80%, rgba(233,233,237,.15) 80%) }
  .card { border: 1px solid var(--edge); border-radius: 12px; padding: 10px 12px; margin-top: 12px }
  .tiles { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px }
  .tile { border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px }
  .tile b { display:block; font-size: 22px; font-weight: 300; margin-top: 4px }
  .d { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em }
  .up { color: var(--good) } .dn { color: var(--bad) }
  .q { display:flex; align-items:center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--edge) }
  .q:first-of-type { border-top: 0 }
  .box { width: 18px; height: 18px; border-radius: 6px; border: 1px solid var(--ink-500); display:grid; place-items:center; flex: none; font-size: 11px }
  .box.done { background: rgba(145,132,217,.25); border-color: var(--accent-400) }
  .q.done span { color: var(--ink-400); text-decoration: line-through }
  .worth { font-size: 34px; font-weight: 200; margin-top: 4px }
  svg { display:block; width: 100%; height: 90px; margin-top: 8px }
  .row { display:flex; justify-content: space-between; align-items:center; padding: 8px 0; border-top: 1px solid var(--edge) }
  .row:first-of-type { border-top: 0 }
  .row .r { text-align: right }
  .btn { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; border: 1px solid var(--edge); border-radius: 999px; padding: 6px 12px; color: var(--ink-300) }
  .btn.off { color: var(--warn); border-color: rgba(255,200,90,.35) }
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; transition: all .25s ease;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; padding: 8px 14px; border-radius: 999px;
    background: #1a1b26; border: 1px solid var(--edge); white-space: nowrap }
  .toast.show { transform: translate(-50%, 0); opacity: 1 }
  .toast.warn { color: var(--warn); border-color: var(--warn) }
</style>
</head>
<body>
<div class="ctl" id="ctl">
  <button data-v="today" class="on">TODAY</button>
  <button data-v="finances">FINANCES</button>
</div>
<div class="phone" id="phone"></div>

<script>
  let page = 'today'
  const phone = document.getElementById('phone')
  const head = () => `<div class="top"><span class="caps" style="color:var(--accent-400)">[ ${page.toUpperCase()} ]</span><span class="demo">DEMO · FAKE DATA</span></div>`
  const tile = (k, v, d) => `<div class="tile"><span class="caps">${k}</span><b>${v}</b><span class="d ${d[0] === '▲' ? 'up' : 'dn'}">${d}</span></div>`

  function today() {
    return head() + `<div class="hello">Good evening, DEMO.</div>
      <div class="lvl"><span class="caps">LEVEL 32</span><i></i><span class="caps">49 DAYS TO 33</span></div>
      <div class="card"><div class="caps">TODAY · 3 QUESTS</div>
        <div class="q done"><div class="box done">✓</div><span>Portuguese — unit 12</span></div>
        <div class="q" data-press="tick"><div class="box"></div><span>Leg day</span></div>
        <div class="q" data-press="tick"><div class="box"></div><span>Draft the launch post</span></div></div>
      <div class="card"><div class="caps">THIS MONTH · OCTOBER</div>
        <div class="tiles">
          ${tile('LANGS', 18, '▲ 4 · SEP 14')}${tile('WORKOUT', 11, '▼ 2 · SEP 13')}${tile('SHAKE', 20, '▲ 3 · SEP 17')}
          ${tile('POST', 4, '▼ 1 · SEP 5')}${tile('COMMITS', 37, '▲ 9 · SEP 28')}${tile('WORTH', '€24.1k', '▲ €0.6k · SEP €23.5k')}
        </div></div>`
  }
  function finances() {
    const pts = [30,34,31,38,42,40,47,45,52,50,58,56,63,61,68,72,70,76]
    const path = pts.map((y, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1)) * 360},${90 - y}`).join(' ')
    const pos = [['VWCE', '€8,420', '▲ 1.2%'], ['AAPL', '€3,150', '▼ 0.4%'], ['ASML', '€2,780', '▲ 2.1%'], ['GLD', '€1,960', '▲ 0.3%'], ['MSFT', '€2,410', '▼ 0.8%'], ['BTC', '€1,590', '▲ 3.4%']]
    return head() + `<div class="card"><div class="caps">WORTH · NOW</div><div class="worth">€24,118</div>
        <span class="d up">▲ €610 · WAS €23,508 ON SEP 30</span>
        <svg viewBox="0 0 360 90" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--accent-400)" stroke-width="1.5"/></svg></div>
      <div class="card"><div class="caps">ACCOUNTS</div>
        <div class="row"><span>Bank</span><span class="r">€3,420</span></div>
        <div class="row"><span>Card</span><span class="r">€388</span></div>
        <div class="row"><span>Broker</span><span class="r">€20,310</span></div></div>
      <div class="card"><div class="caps">POSITIONS · 6</div>
        ${pos.map(([t, v, d]) => `<div class="row"><span class="caps" style="color:var(--ink-100)">${t}</span><span class="r">${v} <span class="d ${d[0] === '▲' ? 'up' : 'dn'}">${d}</span></span></div>`).join('')}</div>
      <div class="card" style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn" data-press="write">+ CONNECT BANK</button>
        <button class="btn off" data-press="ai">READ · DEMO · NO AI</button></div>`
  }

  let t
  function toast(text, cls) {
    let el = phone.querySelector('.toast')
    el.className = 'toast ' + (cls || '')
    el.textContent = text
    requestAnimationFrame(() => el.classList.add('show'))
    clearTimeout(t); t = setTimeout(() => el.classList.remove('show'), 1600)
  }
  function render() {
    phone.innerHTML = (page === 'today' ? today() : finances()) + '<div class="toast"></div>'
    phone.querySelectorAll('[data-press]').forEach(el => el.onclick = () => {
      if (el.dataset.press === 'ai') return toast('DEMO · NO AI', 'warn')
      toast('SAVING…')
      setTimeout(() => toast('DEMO · NOT SAVED', 'warn'), 600)
    })
  }
  document.getElementById('ctl').onclick = (e) => {
    const v = e.target.dataset.v; if (!v) return
    page = v
    document.querySelectorAll('#ctl button').forEach(b => b.classList.toggle('on', b.dataset.v === v))
    render()
  }
  render()
</script>
</body>
</html>
