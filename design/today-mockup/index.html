<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Palette from design/review-mockup — values from src/styles/tokens.css */
  :root {
    --bg: #12131f;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --bad: oklch(0.68 0.2 22);
    --glass: linear-gradient(155deg, rgba(233,233,237,.07), rgba(233,233,237,.015));
    --edge: rgba(233,233,237,.09);
    --sys-edge: color-mix(in oklch, #b5abfc 40%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --a-lang: oklch(0.8 0.1 190);
    --a-body: oklch(0.8 0.1 155);
    --a-shake: oklch(0.8 0.1 120);
    --a-social: oklch(0.8 0.1 15);
    --a-projects: oklch(0.8 0.1 352);
    --a-money: oklch(0.8 0.1 88);
  }
  * { box-sizing: border-box; margin: 0 }
  body {
    background: radial-gradient(1000px 600px at 50% -20%, #2c2660 0%, transparent 60%),
                radial-gradient(700px 500px at 100% 100%, #1a2d3c 0%, transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-400) }

  /* Mockup controls — not part of the design */
  .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding: 10px 16px 0; font-family: var(--mono); font-size: 11px; color: oklch(0.79 0.15 75); letter-spacing: .08em }
  .ctl button { color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px }
  .ctl button.on { color: var(--ink-100); border-color: oklch(0.79 0.15 75) }

  .app { display:grid; grid-template-columns: 180px 1fr; gap: 20px; max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px }
  .side { border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); padding: 12px 10px; display:flex; flex-direction:column; gap: 2px; align-self: start }
  .side .caps { padding: 8px 8px 4px; font-size: 9px }
  .side a { padding: 7px 8px; border-radius: 9px; color: var(--ink-300) }
  .side a.on { color: var(--ink-100); background: rgba(181,171,252,.12); border: 1px solid var(--sys-edge) }
  .app.phone { grid-template-columns: 1fr; max-width: 400px }
  .app.phone .side { display:none }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr } .side { display:none } }

  /* ── the one System window ── */
  .win { position: relative; border-radius: 18px; padding: 26px 28px 22px; overflow: hidden;
    border: 1px solid var(--sys-edge);
    background: linear-gradient(170deg, rgba(181,171,252,.13), rgba(181,171,252,.02) 35%), var(--glass);
    box-shadow: inset 0 1px 0 rgba(233,233,237,.1), 0 30px 80px -40px #000, 0 0 70px -30px var(--shine);
    animation: open .7s cubic-bezier(.2,.8,.2,1) both }
  @keyframes open { from { opacity: 0; transform: scaleY(.92); filter: blur(4px) } }
  .win::before { content:''; position:absolute; inset:0; pointer-events:none; background: repeating-linear-gradient(0deg, rgba(233,233,237,.025) 0 1px, transparent 1px 3px) }
  .win::after { content:''; position:absolute; inset:-1px; border:2px solid var(--lav-400); border-radius:19px; pointer-events:none;
    --r: 26px; mask: linear-gradient(#000 0 0) top left/var(--r) var(--r), linear-gradient(#000 0 0) top right/var(--r) var(--r), linear-gradient(#000 0 0) bottom left/var(--r) var(--r), linear-gradient(#000 0 0) bottom right/var(--r) var(--r); mask-repeat:no-repeat;
    animation: corners 3.2s ease-in-out infinite }
  @keyframes corners { 0%,100% { filter: drop-shadow(0 0 3px var(--shine)); opacity: .75 } 50% { filter: drop-shadow(0 0 10px var(--shine)); opacity: 1 } }
  .sweep { position:absolute; inset:0; pointer-events:none; overflow:hidden }
  .sweep::after { content:''; position:absolute; top:0; bottom:0; width: 30%; left: -40%;
    background: linear-gradient(100deg, transparent, rgba(181,171,252,.09), transparent); animation: sweep 7s ease-in-out infinite }
  @keyframes sweep { 0%, 55% { left: -40% } 100% { left: 120% } }

  .wtop { display:flex; justify-content:space-between; align-items:flex-start; gap: 16px; position: relative }
  .title { font-family: var(--mono); font-size: 13px; letter-spacing: .5em; color: var(--lav-400); text-shadow: 0 0 14px var(--shine) }
  .who { display:flex; align-items: baseline; gap: 14px; margin-top: 14px }
  .lvl { font-size: 64px; font-weight: 200; letter-spacing: -.04em; line-height: .9; text-shadow: 0 0 30px rgba(181,171,252,.35) }
  .lvl small { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--lav-300); font-weight: 400; margin-right: 8px; vertical-align: top }
  .right { text-align: right; display:flex; flex-direction:column; gap: 6px; align-items:flex-end }
  .daybar { display:flex; gap: 4px }
  .daybar i { width: 16px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1) }
  .daybar i.on { background: var(--lav-400); box-shadow: 0 0 8px var(--shine) }

  /* rows */
  .rows { margin-top: 2px; display:flex; flex-direction:column; position: relative }
  .r { --a: var(--lav-400); display:grid; grid-template-columns: 34px 110px 1fr 92px 130px 36px; align-items:center; gap: 14px;
    padding: 13px 4px; border-top: 1px solid rgba(233,233,237,.06);
    animation: rowIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms + 300ms) }
  .r:first-child { border-top: 0 }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-12px) } }
  .r:hover { background: linear-gradient(90deg, color-mix(in oklch, var(--a) 8%, transparent), transparent 70%) }
  .ic { width: 30px; height: 30px; border-radius: 9px; display:grid; place-items:center; color: var(--a);
    background: color-mix(in oklch, var(--a) 16%, transparent); border: 1px solid color-mix(in oklch, var(--a) 40%, transparent);
    box-shadow: 0 0 16px -6px var(--a) }
  .ic svg { width: 15px; height: 15px }
  .name { font-family: var(--mono); font-size: 12px; letter-spacing: .22em; color: var(--ink-200) }

  /* level line under LV: days to the next birthday */
  .xp { margin-top: 12px; width: 260px; display:flex; flex-direction:column; gap: 6px }
  .xp .track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden }
  .xp .track i { display:block; height: 100%; width: 84%; background: linear-gradient(90deg, var(--lav-400), var(--lav-300)); box-shadow: 0 0 10px var(--shine); animation: grow 1.4s .3s cubic-bezier(.2,.8,.2,1) both }

  /* column heads — the window reads as one table */
  .cols { display:grid; grid-template-columns: 34px 110px 1fr 92px 130px 36px; gap: 14px; padding: 0 4px 8px; margin-top: 22px; border-bottom: 1px solid rgba(181,171,252,.18) }
  .cols span { font-family: var(--mono); font-size: 8.5px; letter-spacing: .18em; color: var(--ink-500) }
  .cols .days { display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align:center }
  .cols .days b { font-weight: 400 }
  .cols .days b.today { color: var(--lav-300) }

  /* seven day cells per row */
  .week { display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px }
  .week i { height: 22px; border-radius: 6px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.04);
    display:grid; place-items:center; font-style: normal; font-family: var(--mono); font-size: 9.5px; color: #10121c }
  .week i.on { background: color-mix(in oklch, var(--a) calc(var(--o, 1) * 100%), transparent); border-color: var(--a); box-shadow: 0 0 12px -3px var(--a);
    animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--d) * 50ms + 400ms) }
  .week i.today { border: 1.5px dashed color-mix(in oklch, var(--a) 70%, transparent) }
  .week i.today.on { border-style: solid }
  .week i.future { opacity: .35 }
  .spark { height: 22px; width: 100% }
  .spark { overflow: visible; animation: wipe 1.4s .5s ease-out both }
  .spark path { fill: none; stroke: var(--a); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--a)) }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }

  /* bar: this week filled, last week as a marker */
  .bar { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.06) }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius: 6px; width: var(--w);
    background: linear-gradient(90deg, color-mix(in oklch, var(--a) 55%, transparent), var(--a));
    box-shadow: 0 0 14px -2px var(--a); transition: width .7s cubic-bezier(.2,.8,.2,1);
    animation: grow 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 70ms + 500ms) }
  @keyframes grow { from { width: 0 } }
  .bar .last { position:absolute; top: -4px; bottom: -4px; width: 2px; left: var(--l); background: var(--ink-300); border-radius: 1px; opacity: .7 }

  .n { font-size: 38px; font-weight: 300; letter-spacing: -.03em; line-height: 1; text-align: right; font-variant-numeric: tabular-nums }
  .n.money { font-size: 30px }
  .vs { display:flex; flex-direction:column; gap: 3px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-500) }
  .delta { display:inline-flex; gap: 4px; align-items:center; font-size: 11px; font-weight: 500 }
  .up { color: var(--good) } .down { color: var(--bad) } .same { color: var(--ink-400) }
  .plus { width: 32px; height: 32px; border-radius: 10px; border: 1px solid color-mix(in oklch, var(--a) 45%, transparent); color: var(--a);
    font-size: 18px; line-height: 1; display:grid; place-items:center; transition: background .2s, box-shadow .2s }
  .plus:hover { background: color-mix(in oklch, var(--a) 18%, transparent); box-shadow: 0 0 18px -4px var(--a) }
  .plus.saving { border-color: var(--lav-400); border-top-color: transparent; animation: spin .7s linear infinite; color: transparent }
  .plus.saved { background: var(--a); color: #10121c; animation: pop .45s cubic-bezier(.3,1.6,.5,1) }
  .auto { font-family: var(--mono); font-size: 8.5px; letter-spacing: .14em; color: var(--ink-600); text-align:center }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes pop { from { transform: scale(.5) } }
  .r.landed { animation: flash 1.1s ease-out !important }
  @keyframes flash { 0% { background: color-mix(in oklch, var(--a) 22%, transparent) } 100% { background: transparent } }
  .bump { display:inline-block; animation: bump .55s cubic-bezier(.3,1.6,.5,1) }
  @keyframes bump { 0% { transform: translateY(14px) scale(.8); opacity: 0 } }

  /* the three, one line */
  .three { margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(181,171,252,.25); display:flex; align-items:center; gap: 10px; flex-wrap: wrap; position: relative }
  .q { display:inline-flex; align-items:center; gap: 8px; padding: 7px 12px 7px 8px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(255,255,255,.03) }
  .q .num { font-family: var(--mono); font-size: 9.5px; color: var(--ink-500) }
  .q .t { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-500); display:grid; place-items:center; font-size: 10px }
  .q.done { border-color: color-mix(in oklch, var(--good) 40%, transparent) }
  .q.done .t { background: var(--good); border-color: var(--good); color: #10121c }
  .q.done .label { color: var(--ink-500); text-decoration: line-through }
  .q.empty { color: var(--ink-600); border-style: dashed }

  @media (max-width: 760px) {
    .win { padding: 20px 16px 18px }
    .r { grid-template-columns: 30px 1fr 64px 32px; row-gap: 8px }
    .r .bar { grid-column: 2 / 4; grid-row: 2 }
    .r .vs { grid-column: 2 / 4; grid-row: 3; flex-direction: row; gap: 10px }
    .r .plus, .r .auto { grid-column: 4; grid-row: 1 / 3 }
    .n { font-size: 30px } .lvl { font-size: 48px }
  }
  .app.phone .win { padding: 20px 16px 18px }
  .app.phone .r { grid-template-columns: 30px 1fr 64px 32px; row-gap: 8px }
  .app.phone .r .bar { grid-column: 2 / 4; grid-row: 2 }
  .app.phone .r .vs { grid-column: 2 / 4; grid-row: 3; flex-direction: row; gap: 10px }
  .app.phone .r .plus, .app.phone .r .auto { grid-column: 4; grid-row: 1 / 3 }
  .app.phone .n { font-size: 30px } .app.phone .lvl { font-size: 48px }
</style>
</head>
<body>

<div class="ctl">
  MOCKUP ·
  <button data-s="now" class="on">SAT MORNING</button>
  <button data-s="good">AFTER A GOOD DAY</button>
  · <button id="phone">PHONE</button>
</div>

<div class="app" id="app">
  <nav class="side">
    <div class="caps">NOW</div>
    <a class="on">Today</a><a>Calendar</a><a>Review</a>
    <div class="caps">BUILD</div>
    <a>Projects</a><a>Goals</a><a>Backlog</a><a>Notes</a>
    <div class="caps">TRACK</div>
    <a>Finances</a><a>Body</a><a>Languages</a>
  </nav>

  <main>
    <section class="win">
      <span class="sweep"></span>
      <div class="wtop">
        <div>
          <div class="title">[ STATUS ]</div>
          <div class="who"><span class="lvl"><small>LV</small>32</span><span class="caps" style="color:var(--ink-200)">ARTEM</span></div>
          <div class="xp"><div class="track"><i></i></div><span class="caps" style="font-size:9px">58 DAYS TO LV 33</span></div>
        </div>
        <div class="right">
          <span class="caps" style="color:var(--ink-200)">SAT 17 OCT</span>
          <span class="caps">WEEK 42 · DAY 6 OF 7</span>
          <div class="daybar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
        </div>
      </div>

      <div class="cols"><span></span><span></span><span class="days"><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b class="today">S</b><b>S</b></span><span style="text-align:right">THIS WEEK</span><span>VS LAST WEEK</span><span></span></div>
      <div class="rows" id="rows"></div>

      <div class="three" id="three"></div>
    </section>
  </main>
</div>

<script>
const IC = {
  lang:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.6 2.6 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.3 4.4-4.5 5.2M8.5 14l3-7 3 7M9.5 11.8h4"/></svg>',
  body:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 6v4M4 4.5v7M12 4.5v7M14.5 6v4M4 8h8"/></svg>',
  shake: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 4.5h7l-1 9.5h-5zM4 4.5h8M8 4.5V1.5l2-.5"/></svg>',
  post:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z"/></svg>',
  proj:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.5"/><path d="M1 8h4.5M10.5 8H15"/></svg>',
  money: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l4-4 3 3 5-6M10 5h4v4"/></svg>',
};

// this week vs last week; max = the bar's full width. Mock numbers — langs, workout, shake, commits, worth from his Review.
const BASE = () => [
  { k:'lang',  name:'LANGS',   a:'var(--a-lang)',     ic:'lang',  days:[0,0,0,0,0,0,0], last:1, tap:true },
  { k:'work',  name:'WORKOUT', a:'var(--a-body)',     ic:'body',  days:[0,0,0,0,0,0,0], last:2, tap:true },
  { k:'shake', name:'SHAKE',   a:'var(--a-shake)',    ic:'shake', days:[0,0,0,0,0,0,0], last:1, tap:true },
  { k:'post',  name:'POST',    a:'var(--a-social)',   ic:'post',  days:[0,0,0,0,0,0,0], last:1, tap:true },
  { k:'proj',  name:'COMMITS', a:'var(--a-projects)', ic:'proj',  days:[36,68,32,36,0,0,0], last:132, auto:'GITHUB', heat:68 },
  { k:'money', name:'WORTH',   a:'var(--a-money)',    ic:'money', worth:[45.4,45.4,45.1,45.2,44.9,44.9], now:44.9, last:45.3, auto:'BANK', money:true },
];
let R = BASE(), busy = {}, first = true;
const TODAY = 5;

function total(r) { return r.money ? r.now : r.days.reduce((x, y) => x + y, 0) }
function fmt(r, v) { return r.money ? '€' + v.toFixed(1) + 'k' : v }
function deltaHtml(r) {
  const d = Math.round((total(r) - r.last) * 10) / 10;
  if (d === 0) return `<span class="delta same">= SAME</span>`;
  const up = d > 0;
  return `<span class="delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${r.money ? '€407' : Math.abs(d)}</span>`;
}
function weekHtml(r) {
  if (r.money) {
    const lo = 44.7, hi = 45.6, pts = r.worth.map((v, i) => [ (i + .5) / 7 * 100, 20 - (v - lo) / (hi - lo) * 18 ]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const [x, y] = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
  }
  return `<div class="week">${r.days.map((n, i) => {
    const o = r.heat ? Math.max(.35, n / r.heat) : 1;
    const label = r.heat ? (n || '') : (n > 1 ? n : '');
    return `<i class="${n ? 'on' : ''} ${i === TODAY ? 'today' : ''} ${i > TODAY ? 'future' : ''}" style="--d:${i};--o:${o}">${label}</i>`;
  }).join('')}</div>`;
}
function render() {
  document.getElementById('rows').innerHTML = R.map((r, i) => {
    const s = busy[r.k], still = first ? '' : 'animation:none';
    return `<div class="r ${s === 'saved' ? 'landed' : ''}" style="--a:${r.a};--i:${i};${still}">
      <span class="ic">${IC[r.ic]}</span>
      <span class="name">${r.name}</span>
      ${weekHtml(r)}
      <span class="n ${r.money ? 'money' : ''}"><span class="${s === 'saved' ? 'bump' : ''}" data-count>${fmt(r, total(r))}</span></span>
      <span class="vs">${deltaHtml(r)}<span>LAST WEEK ${r.money ? '€45,317' : r.last}</span></span>
      ${r.tap
        ? `<button class="plus ${s || ''}" onclick="log('${r.k}')">${s === 'saved' ? '✓' : '+'}</button>`
        : `<span class="auto">AUTO<br>${r.auto}</span>`}
    </div>`;
  }).join('');
  if (first) countUp();
  first = false;
}
function countUp() {
  document.querySelectorAll('[data-count]').forEach((el, i) => {
    const r = R[i], to = total(r), t0 = performance.now() + 400 + i * 70, dur = 900;
    const step = now => {
      const p = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
      el.textContent = r.money ? '€' + (to * e).toFixed(1) + 'k' : Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function log(k) {
  if (busy[k]) return;
  busy[k] = 'saving'; render();
  setTimeout(() => { R.find(r => r.k === k).days[TODAY]++; busy[k] = 'saved'; render(); }, 600);
  setTimeout(() => { delete busy[k]; render(); }, 2400);
}

let three = [];
function renderThree() {
  document.getElementById('three').innerHTML = `<span class="caps" style="margin-right:4px">TODAY'S THREE</span>` +
    [0,1,2].map(i => {
      const q = three[i];
      if (!q) return `<span class="q empty"><span class="num">0${i+1}</span><span class="t"></span><span class="label">＋</span></span>`;
      return `<button class="q ${q.done ? 'done' : ''}" onclick="toggle(${i})"><span class="num">0${i+1}</span><span class="t">${q.done ? '✓' : ''}</span><span class="label">${q.t}</span></button>`;
    }).join('');
}
function toggle(i) { three[i].done = !three[i].done; renderThree() }

function scenario(s) {
  R = BASE(); busy = {}; first = true;
  three = [{ t: 'PT · 14:00' }];
  if (s === 'good') {
    const set = { lang: [0,0,1,0,0,1,0], work: [1,0,1,0,0,1,0], shake: [1,0,0,0,0,1,0], post: [0,1,0,0,0,1,0] };
    R.forEach(r => { if (set[r.k]) r.days = set[r.k] });
    three = [{ t: 'PT · 14:00', done: true }, { t: 'Portuguese 20 min', done: true }, { t: 'Post on LinkedIn', done: true }];
  }
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  render(); renderThree();
}
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => scenario(b.dataset.s));
document.getElementById('phone').onclick = e => { document.getElementById('app').classList.toggle('phone'); e.target.classList.toggle('on'); };
scenario('now');
</script>
