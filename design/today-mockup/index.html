<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Same palette as design/review-mockup — values from src/styles/tokens.css */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --warn: oklch(0.79 0.15 75);
    --glass: linear-gradient(155deg, rgba(233,233,237,.075), rgba(233,233,237,.02));
    --edge: rgba(233,233,237,.09);
    --shadow: inset 0 1px 0 rgba(233,233,237,.08), 0 24px 48px -28px rgba(0,0,0,.9);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --a-projects: oklch(0.8 0.1 352);
    --a-lang: oklch(0.8 0.1 190);
    --a-body: oklch(0.8 0.1 155);
    --a-cal: oklch(0.8 0.1 225);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #1f3140 0%, transparent 55%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-400) }
  .num { font-weight: 300; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums }

  /* Mockup controls — not part of the design */
  .ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; padding: 10px 16px 0; font-family: var(--mono); font-size: 11px; color: var(--warn); text-transform: uppercase; letter-spacing: .08em }
  .ctl button { color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px; text-transform: uppercase }
  .ctl button.on { color: var(--ink-100); border-color: var(--warn) }

  /* app shell, on the real app's proportions */
  .app { display:grid; grid-template-columns: 180px 1fr; gap: 16px; max-width: 1180px; margin: 0 auto; padding: 14px 16px 60px }
  .app.phone { grid-template-columns: 1fr; max-width: 390px }
  .app.phone .side { display:none }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; padding: 12px 16px 40px }
    .app .side { display:none }
    .app .logs { grid-template-columns: repeat(2, 1fr) }
    .app .day { min-height: 54px; padding: 6px 4px }
    .app .ev { display:none }
  }
  .side { border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); padding: 12px 10px; display:flex; flex-direction:column; gap: 2px; align-self: start }
  .side .caps { padding: 8px 8px 4px }
  .side a { padding: 7px 8px; border-radius: 9px; color: var(--ink-300); font-size: 13px }
  .side a.on { color: var(--ink-100); background: rgba(181,171,252,.12); border: 1px solid var(--sys-edge) }

  .main { display:flex; flex-direction:column; gap: 14px; min-width: 0 }
  .top { display:flex; align-items:end; justify-content:space-between; gap: 10px; padding: 6px 2px 2px }
  .date { font-size: 34px; font-weight: 300; letter-spacing: -.02em }
  .lvl { display:flex; gap: 8px; align-items:center }

  .panel { position: relative; border-radius: 16px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow); padding: 16px;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms) }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px) scale(.985) } }
  .sys { border-color: var(--sys-edge); background: linear-gradient(160deg, rgba(181,171,252,.10), rgba(181,171,252,.02) 40%), var(--glass);
    box-shadow: var(--shadow), 0 0 40px -18px var(--shine) }
  .sys::after { content:''; position:absolute; inset:-1px; border:2px solid var(--lav-400); border-radius:17px; pointer-events:none;
    --r: 20px; mask: linear-gradient(#000 0 0) top left/var(--r) var(--r), linear-gradient(#000 0 0) top right/var(--r) var(--r), linear-gradient(#000 0 0) bottom left/var(--r) var(--r), linear-gradient(#000 0 0) bottom right/var(--r) var(--r); mask-repeat:no-repeat;
    animation: corners 3.2s ease-in-out infinite }
  @keyframes corners { 0%,100% { filter: drop-shadow(0 0 3px var(--shine)); opacity: .75 } 50% { filter: drop-shadow(0 0 9px var(--shine)); opacity: 1 } }
  .sys-title { font-family: var(--mono); font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 12px var(--shine) }
  .phead { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px }

  .badge { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; display:inline-flex; gap:5px; align-items:center; white-space: nowrap }
  .b-good { color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent) }
  .b-lav { color: var(--lav-400); background: color-mix(in oklch, var(--lav-400) 10%, transparent) }
  .b-dim { color: var(--ink-400) }

  /* ── the three ── */
  .slot { display:flex; align-items:center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--edge); min-height: 62px }
  .slot:first-of-type { border-top: 0 }
  .slot .n { font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 18px }
  .tick { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-500); display:grid; place-items:center; flex: none; transition: all .25s }
  .tick:hover { border-color: var(--lav-400); box-shadow: 0 0 12px -2px var(--shine) }
  .tick svg { width: 14px; height: 14px; opacity: 0 }
  .slot.done .tick { background: var(--good); border-color: var(--good); animation: pop .45s cubic-bezier(.3,1.6,.5,1) }
  .slot.done .tick svg { opacity: 1; color: #10121c }
  .slot.done .title { color: var(--ink-500); text-decoration: line-through; text-decoration-color: var(--ink-600) }
  .slot.saving .tick { border-color: var(--lav-400); border-top-color: transparent; animation: spin .7s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes pop { from { transform: scale(.4); opacity: 0 } }
  .title { font-size: 18px; font-weight: 400; flex: 1; min-width: 0 }
  .slot.filled { animation: arrive .4s cubic-bezier(.2,.8,.2,1) both }
  .slot.empty .title { color: var(--ink-600); font-size: 15px }
  .x { color: var(--ink-600); font-size: 16px; padding: 4px 6px; opacity: 0; transition: opacity .2s }
  .slot:hover .x { opacity: 1 }

  .pick { margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--edge); display:flex; flex-wrap:wrap; gap: 8px; align-items:center }
  .chip { display:inline-flex; align-items:center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--a) 40%, transparent);
    background: color-mix(in oklch, var(--a) 9%, transparent); font-size: 13px; transition: transform .2s, box-shadow .2s; animation: arrive .4s both; animation-delay: calc(var(--i,0) * 60ms) }
  .chip:hover { transform: translateY(-2px); box-shadow: 0 0 18px -6px var(--a) }
  .chip span { white-space: nowrap }
  .chip .from { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--a) }
  .chip.typed { --a: var(--ink-400) }

  /* ── the seven ── */
  :root { --a-social: oklch(0.8 0.1 15); --a-girls: oklch(0.8 0.12 330); --a-money: oklch(0.8 0.1 88); --bad: oklch(0.68 0.2 22) }
  .bento { display:grid; gap: 10px; grid-template-columns: repeat(4, 1fr) }
  .w2 { grid-column: span 2 }
  @media (max-width: 760px) { .bento { grid-template-columns: repeat(2, 1fr) } }
  .app.phone .bento { grid-template-columns: repeat(2, 1fr) }

  .tile { --a: var(--lav-400); position: relative; border-radius: 16px; overflow: hidden; padding: 14px; min-width: 0;
    border: 1px solid color-mix(in oklch, var(--a) 26%, transparent);
    background: linear-gradient(160deg, color-mix(in oklch, var(--a) 12%, transparent), transparent 55%), var(--glass);
    box-shadow: var(--shadow); display:flex; flex-direction:column; gap: 10px; text-align:left;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms + 120ms) }
  .tile:hover { transform: translateY(-3px); border-color: var(--a); box-shadow: var(--shadow), 0 0 34px -12px var(--a) }
  .tile > * { position: relative; z-index: 2 }
  .glow { position:absolute !important; z-index: 0 !important; top: -70px; right: -60px; width: 200px; height: 200px; border-radius: 50%;
    background: var(--a); filter: blur(46px); opacity: .14; animation: breathe 5s ease-in-out infinite; animation-delay: calc(var(--i,0) * -.7s) }
  @keyframes breathe { 0%,100% { opacity: .1; transform: scale(1) } 50% { opacity: .24; transform: scale(1.15) } }
  .settled .tile:not(.landed) { animation: none }
  .tile.landed { animation: flash 1.1s ease-out }
  @keyframes flash { 0% { box-shadow: 0 0 0 2px var(--a), 0 0 50px -4px var(--a) } 100% { box-shadow: var(--shadow) } }

  .th { display:flex; align-items:center; justify-content:space-between; gap: 6px }
  .tn { display:flex; align-items:center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: var(--ink-200) }
  .ic { width: 24px; height: 24px; border-radius: 8px; display:grid; place-items:center; color: var(--a);
    background: color-mix(in oklch, var(--a) 18%, transparent); border: 1px solid color-mix(in oklch, var(--a) 40%, transparent) }
  .ic svg { width: 14px; height: 14px }
  .big { font-size: 40px; font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums }
  .of { font-family: var(--mono); font-size: 10px; color: var(--ink-500); letter-spacing: .08em; text-transform: uppercase }
  .row { display:flex; align-items:end; justify-content:space-between; gap: 8px }
  .bump { display:inline-block; animation: bump .55s cubic-bezier(.3,1.6,.5,1) }
  @keyframes bump { 0% { transform: translateY(12px) scale(.8); opacity: 0 } }

  /* 7 days, one cell each; today outlined */
  .cells { display:grid; grid-template-columns: repeat(7, 1fr); gap: 3px }
  .cells i { height: 14px; border-radius: 4px; background: rgba(255,255,255,.06); position: relative }
  .cells i.on { background: var(--a); box-shadow: 0 0 10px -3px var(--a); animation: pop .4s cubic-bezier(.3,1.6,.5,1) both }
  .cells i.two { background: linear-gradient(var(--a), color-mix(in oklch, var(--a) 70%, white)) }
  .cells i.today { outline: 1.5px solid color-mix(in oklch, var(--a) 70%, transparent); outline-offset: 1px }
  .cells i.future { opacity: .35 }
  .dl { display:grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-family: var(--mono); font-size: 8px; color: var(--ink-600); text-align:center }

  /* ring against a goal's real target */
  .ring { --p: 0; width: 50px; height: 50px; border-radius: 50%; display:grid; place-items:center; flex: none;
    background: conic-gradient(var(--a) calc(var(--p) * 1%), rgba(255,255,255,.08) 0); transition: --p .6s }
  .ring::before { content: attr(data-t); width: 40px; height: 40px; border-radius: 50%; background: #1b1d2c; display:grid; place-items:center;
    font-family: var(--mono); font-size: 9.5px; color: var(--ink-300) }

  /* the press */
  .press { display:flex; gap: 6px }
  .btn { flex: 1; padding: 9px 8px; border-radius: 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--a);
    border: 1px solid color-mix(in oklch, var(--a) 50%, transparent); background: color-mix(in oklch, var(--a) 10%, transparent);
    transition: background .2s, transform .15s, box-shadow .2s; white-space: nowrap }
  .btn:hover { background: color-mix(in oklch, var(--a) 22%, transparent); box-shadow: 0 0 18px -6px var(--a) }
  .btn:active { transform: scale(.96) }
  .btn.saving { color: var(--lav-300); border-color: var(--lav-400) }
  .btn.saved { color: #10121c; background: var(--a); border-color: var(--a) }
  .auto { color: var(--a) }

  /* finances */
  .spark { width: 100%; height: 44px }
  .spark path.l { fill: none; stroke: var(--a); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s .4s ease-out forwards }
  .spark path.f { fill: url(#fade); opacity: 0; animation: fadeIn 1s 1s forwards }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes fadeIn { to { opacity: 1 } }
  .down { color: var(--bad) } .up { color: var(--good) }
  .pair { display:flex; gap: 18px; flex-wrap: wrap }
  .pair > div { display:flex; flex-direction:column; gap: 4px }
</style>
</head>
<body>

<div class="ctl">
  MOCKUP ·
  <button data-s="morning" class="on">MORNING · EMPTY</button>
  <button data-s="picked">THREE PICKED</button>
  <button data-s="evening">EVENING · DONE</button>
  · <button id="phone">PHONE</button>
</div>

<div class="app" id="app">
  <nav class="side">
    <div class="caps">NOW</div>
    <a class="on">Today</a><a>Calendar</a><a>Review</a>
    <div class="caps">BUILD</div>
    <a>Projects</a><a>Goals</a><a>Backlog</a><a>Notes</a>
    <div class="caps">TRACK</div>
    <a>Finances</a><a>Body</a><a>Languages</a>
  </nav>

  <main class="main">
    <div class="top">
      <div>
        <div class="caps">SAT</div>
        <div class="date">17 Oct</div>
      </div>
      <div class="lvl"><span class="caps">LEVEL</span><span class="num" style="font-size:22px">32</span></div>
    </div>

    <section class="panel sys" style="--i:1">
      <div class="phead">
        <span class="sys-title">[ TODAY'S THREE ]</span>
        <span class="badge b-lav" id="threeCount">0 OF 3</span>
      </div>
      <div id="slots"></div>
      <div class="pick" id="pick"></div>
    </section>


    <section class="bento" id="bento"></section>
  </main>
</div>

<script>
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const IC = {
  lang:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.6 2.6 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.3 4.4-4.5 5.2M8.5 14l3-7 3 7M9.5 11.8h4"/></svg>',
  body:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 6v4M4 4.5v7M12 4.5v7M14.5 6v4M4 8h8"/></svg>',
  shake: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 4.5h7l-1 9.5h-5zM4 4.5h8M8 4.5V1.5l2-.5"/></svg>',
  post:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z"/></svg>',
  girls: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 13.5S2 10 2 6a3 3 0 0 1 6-1 3 3 0 0 1 6 1c0 4-6 7.5-6 7.5z"/></svg>',
  proj:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.5"/><path d="M1 8h4.5M10.5 8H15"/></svg>',
  money: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l4-4 3 3 5-6M10 5h4v4"/></svg>',
};
const DAYS = ['M','T','W','T','F','S','S'];
const TODAY = 5; // SAT

// Suggestions — each says where it came from
const SUGGEST = [
  { t: 'PT · 14:00',        from: 'CALENDAR',       a: 'var(--a-cal)' },
  { t: 'Portuguese 20 min', from: '0 OF 4 · OCT',   a: 'var(--a-lang)' },
  { t: 'Post on LinkedIn',  from: '0 THIS WEEK',    a: 'var(--a-social)' },
  { t: 'Today page build',  from: 'SOLOLEVELING',   a: 'var(--a-projects)' },
];

// The seven he cares about (17 Oct). week = count per day Mon..Sun this week.
const BASE = () => ({
  lang:   { name: 'LANGS',    a: 'var(--a-lang)',   ic: 'lang',  week: [0,0,0,0,0,0,0], last4: '4 IN 4 WEEKS', goal: [0, 4, 'OCT'], press: [['PT','20 MIN PT'],['EN','20 MIN EN']] },
  workout:{ name: 'WORKOUT',  a: 'var(--a-body)',   ic: 'body',  week: [0,0,0,0,0,0,0], last4: '7 IN 4 WEEKS', goal: [0, 12, 'OCT'], press: [['GYM','GYM 60'],['BOXING','BOXING 60']] },
  shake:  { name: 'SHAKE',    a: 'oklch(0.8 0.1 120)', ic: 'shake', week: [0,0,0,0,0,0,0], last4: '1 IN 4 WEEKS', press: [['SHAKE','1 SHAKE']] },
  post:   { name: 'POST',     a: 'var(--a-social)', ic: 'post',  week: [0,0,0,0,0,0,0], last4: '2 IN 4 WEEKS', press: [['POSTED','POSTED']] },
  girls:  { name: 'GIRLS',    a: 'var(--a-girls)',  ic: 'girls', week: [0,0,1,0,0,0,0], last4: '3 IN 4 WEEKS', press: [['TALKED','+1']] },
});
let T = BASE(), three = [], busy = {};

function count(t) { return t.week.reduce((s, n) => s + n, 0) }
function cells(t) {
  return `<div class="cells">${t.week.map((n, i) =>
    `<i class="${n ? 'on' : ''} ${n > 1 ? 'two' : ''} ${i === TODAY ? 'today' : ''} ${i > TODAY ? 'future' : ''}" style="animation-delay:${i*40}ms"></i>`).join('')}</div>
    <div class="dl">${DAYS.map((d, i) => `<span style="${i===TODAY?'color:var(--ink-300)':''}">${d}</span>`).join('')}</div>`;
}
function tapTile(k, i) {
  const t = T[k], n = count(t);
  const ring = t.goal ? (() => { const done = t.goal[0] + (n - count(BASE()[k])); return `<div class="ring" data-t="${done}/${t.goal[1]}" style="--p:${Math.min(100, done / t.goal[1] * 100)}"></div>` })() : '';
  return `<div class="tile ${busy[k] === 'landed' ? 'landed' : ''}" style="--a:${t.a};--i:${i}">
    <span class="glow"></span>
    <div class="th"><span class="tn"><span class="ic">${IC[t.ic]}</span>${t.name}</span>${t.goal ? `<span class="of">${t.goal[2]}</span>` : ''}</div>
    <div class="row">
      <div><div class="big"><span class="${busy[k] === 'landed' ? 'bump' : ''}">${n}</span></div><div class="of" style="margin-top:5px">THIS WEEK · ${t.last4}</div></div>
      ${ring}
    </div>
    ${cells(t)}
    <div class="press">${t.press.map(([label, saved], j) => {
      const s = busy[k + j];
      return `<button class="btn ${s || ''}" onclick="logIt('${k}',${j})">${s === 'saving' ? 'SAVING…' : s === 'saved' ? '✓ ' + saved : label}</button>`;
    }).join('')}</div>
  </div>`;
}
function renderBento() {
  const keys = ['lang', 'workout', 'shake', 'post', 'girls'];
  document.getElementById('bento').innerHTML =
    keys.map((k, i) => tapTile(k, i)).join('') +
    `<div class="tile" style="--a:var(--a-projects);--i:5">
      <span class="glow"></span>
      <div class="th"><span class="tn"><span class="ic">${IC.proj}</span>PROJECTS</span><span class="badge auto">AUTO · GITHUB</span></div>
      <div class="row">
        <div><div class="big">172</div><div class="of" style="margin-top:5px">COMMITS · SOLOLEVELING</div></div>
        <div class="ring" data-t="100" style="--p:100"></div>
      </div>
      <div class="cells">${[36,68,32,36,0,0,0].map((n,i)=>`<i class="${n?'on':''} ${n>50?'two':''} ${i===TODAY?'today':''} ${i>TODAY?'future':''}"></i>`).join('')}</div>
      <div class="dl">${DAYS.map((d,i)=>`<span style="${i===TODAY?'color:var(--ink-300)':''}">${d}</span>`).join('')}</div>
      <div class="of">TARGET 100 · LAST WEEK 132</div>
    </div>
    <div class="tile w2" style="--a:var(--a-money);--i:6">
      <span class="glow"></span>
      <div class="th"><span class="tn"><span class="ic">${IC.money}</span>FINANCES</span><span class="badge auto">AUTO · BANK</span></div>
      <div class="pair">
        <div><span class="of">WORTH NOW</span><span class="big">€44.9k</span><span class="of"><span class="down">↓ €407</span> · LAST WEEK €45,317</span></div>
        <div><span class="of">SPENT · THIS WEEK</span><span class="big" style="font-size:28px">€5.98</span><span class="of"><span class="up">↓</span> LAST WEEK €74.05</span></div>
      </div>
      <svg class="spark" viewBox="0 0 300 44" preserveAspectRatio="none">
        <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.8 0.1 88)" stop-opacity=".35"/><stop offset="1" stop-color="oklch(0.8 0.1 88)" stop-opacity="0"/></linearGradient></defs>
        <path class="f" d="M0 14 L50 8 L100 8 L150 26 L200 20 L250 36 L300 36 L300 44 L0 44Z"/>
        <path class="l" d="M0 14 L50 8 L100 8 L150 26 L200 20 L250 36 L300 36"/>
      </svg>
    </div>`;
}

function logIt(k, j) {
  const id = k + j; if (busy[id]) return;
  busy[id] = 'saving'; renderBento();
  setTimeout(() => { T[k].week[TODAY]++; busy[id] = 'saved'; busy[k] = 'landed'; renderBento(); }, 600);
  setTimeout(() => { delete busy[id]; delete busy[k]; renderBento(); }, 2800);
}

function renderThree() {
  document.getElementById('slots').innerHTML = [0,1,2].map(i => {
    const q = three[i];
    if (!q) return `<div class="slot empty"><span class="n">0${i+1}</span><span class="tick"></span><span class="title">—</span></div>`;
    return `<div class="slot filled ${q.done ? 'done' : ''} ${q.saving ? 'saving' : ''}">
      <span class="n">0${i+1}</span>
      <button class="tick" onclick="tick(${i})">${CHECK}</button>
      <span class="title">${q.t}</span>
      ${q.done ? '<span class="badge b-good">DONE</span>' : `<span class="badge" style="color:${q.a}">${q.from}</span>`}
      ${q.done ? '' : `<button class="x" onclick="drop(${i})">×</button>`}
    </div>`;
  }).join('');
  const done = three.filter(q => q.done).length;
  document.getElementById('threeCount').textContent = three.length < 3 ? `${three.length} OF 3` : `${done} OF 3 DONE`;
  const pick = document.getElementById('pick');
  if (three.length >= 3) { pick.style.display = 'none'; return; }
  pick.style.display = 'flex';
  const left = SUGGEST.filter(s => !three.some(q => q.t === s.t));
  pick.innerHTML = `<span class="caps" style="margin-right:4px">PICK</span>` +
    left.map((s, i) => `<button class="chip" style="--a:${s.a};--i:${i}" onclick="add('${s.t}')"><span>${s.t}</span><span class="from">${s.from}</span></button>`).join('') +
    `<button class="chip typed" onclick="add('Call the bank')"><span>＋</span><span class="from">TYPE</span></button>`;
}
function add(t) {
  const s = SUGGEST.find(s => s.t === t) || { t, from: 'TYPED', a: 'var(--ink-400)' };
  if (three.length < 3) three.push({ ...s });
  renderThree();
}
function drop(i) { three.splice(i, 1); renderThree(); }
function tick(i) {
  const q = three[i]; if (q.done) return;
  q.saving = true; renderThree();
  setTimeout(() => { q.saving = false; q.done = true; renderThree(); }, 650);
}

function scenario(s) {
  T = BASE(); busy = {}; three = [];
  if (s === 'picked') three = [0, 1, 2].map(i => ({ ...SUGGEST[i] }));
  if (s === 'evening') {
    three = [0, 1, 2].map(i => ({ ...SUGGEST[i], done: i !== 2 }));
    T.workout.week[TODAY] = 1; T.lang.week[TODAY] = 1; T.shake.week[TODAY] = 1; T.girls.week[TODAY] = 1;
  }
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  renderThree(); renderBento();
}
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => scenario(b.dataset.s));
document.getElementById('phone').onclick = e => { document.getElementById('app').classList.toggle('phone'); e.target.classList.toggle('on'); };
scenario('morning');
setTimeout(() => document.body.classList.add('settled'), 1200);
</script>
</body>
</html>
