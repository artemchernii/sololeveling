<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today mockup · month</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Values from src/styles/tokens.css, as in design/review-mockup */
  :root {
    --bg: #12121c;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --bad: oklch(0.68 0.2 22);
    --glass: linear-gradient(155deg, rgba(233,233,237,.06), rgba(233,233,237,.015));
    --edge: rgba(233,233,237,.09);
    --shadow: inset 0 1px 0 rgba(233,233,237,.07), 0 24px 48px -28px rgba(0,0,0,.9);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --a-lang: oklch(0.8 0.1 190); --a-body: oklch(0.8 0.1 155); --a-shake: oklch(0.8 0.1 120);
    --a-social: oklch(0.8 0.1 15); --a-projects: oklch(0.8 0.1 352); --a-money: oklch(0.8 0.1 88);
    --principle: oklch(0.78 0.12 340);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(900px 500px at 0% -10%, #2a2346 0%, transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-400) }

  .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding: 10px 16px 0; font-family: var(--mono); font-size: 11px; color: oklch(0.79 0.15 75); letter-spacing: .08em }
  .ctl button { color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px }
  .ctl button.on { color: var(--ink-100); border-color: oklch(0.79 0.15 75) }

  .page { max-width: 1060px; margin: 0 auto; padding: 22px 16px 60px; display:flex; flex-direction:column; gap: 16px }

  /* ── top: as the app has it now ── */
  .top { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; padding-bottom: 8px }
  .hello { font-size: 34px; font-weight: 500; letter-spacing: -.02em }
  .meta { display:flex; align-items:center; gap: 12px; margin-top: 12px; flex-wrap: wrap }
  .lvbar { width: 110px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow:hidden }
  .lvbar i { display:block; height:100%; width: 84%; background: var(--ink-200); animation: grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both }
  .principle { position: relative }
  .principle .big { font-size: 30px; font-weight: 300; letter-spacing: .01em; color: var(--principle); margin-top: 26px }
  .six { position:absolute; right: 0; top: -6px; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-200) }

  .card { position: relative; border-radius: 18px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow); padding: 18px 20px;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms) }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px) } }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px }
  .ch { display:flex; justify-content:space-between; align-items:center; margin-bottom: 18px }
  .ev { display:flex; align-items:center; gap: 14px; padding: 4px 0 }
  .ev .bar { width: 2px; height: 26px; background: var(--ink-300); border-radius: 1px }
  .ev .t { font-family: var(--mono); font-size: 13px; color: var(--ink-200) }
  .ev .n { font-size: 16px; flex: 1 }
  .ev .d { font-family: var(--mono); font-size: 12px; color: var(--ink-400) }
  .slot { display:flex; align-items:center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--edge); min-height: 46px }
  .slot:first-of-type { border-top: 0; padding-top: 2px }
  .slot .k { font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 18px }
  .slot .add { color: var(--ink-400); font-size: 16px }

  .badge { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
  .b-lav { color: var(--lav-400) }

  /* ── THIS MONTH: his six ── */
  .bento { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px }
  .tile { position: relative; border-radius: 16px; border: 1px solid var(--edge); background: rgba(255,255,255,.025); padding: 16px 16px 14px; display:flex; flex-direction:column; gap: 12px; overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms + 200ms) }
  .tile:hover { transform: translateY(-2px); border-color: rgba(181,171,252,.35); box-shadow: 0 0 30px -14px var(--shine) }
  .settled .tile:not(.landed) { animation: none }
  .tile.landed { animation: edge 1.1s ease-out }
  @keyframes edge { 0% { border-color: var(--lav-400); box-shadow: 0 0 0 1px var(--lav-400), 0 0 36px -6px var(--shine) } 100% { border-color: var(--edge) } }
  .th { display:flex; justify-content:space-between; align-items:center; gap: 8px }
  .name { display:flex; align-items:center; gap: 9px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: var(--ink-200) }
  .ic { width: 26px; height: 26px; border-radius: 8px; display:grid; place-items:center; color: var(--a); border: 1px solid var(--edge); background: rgba(255,255,255,.03) }
  .ic svg { width: 14px; height: 14px }
  .goal { font-family: var(--mono); font-size: 10px; color: var(--ink-400); display:flex; align-items:center; gap: 6px }
  .ring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--lav-400) calc(var(--p) * 1%), rgba(255,255,255,.1) 0) ;
    -webkit-mask: radial-gradient(circle, transparent 5.5px, #000 6px); mask: radial-gradient(circle, transparent 5.5px, #000 6px) }
  .mid { display:flex; align-items:flex-end; gap: 14px }
  .num { font-size: 44px; font-weight: 300; letter-spacing: -.03em; line-height: .9; font-variant-numeric: tabular-nums }
  .num.money { font-size: 34px }
  .vs { display:flex; flex-direction:column; gap: 3px; padding-bottom: 3px }
  .delta { font-family: var(--mono); font-size: 12px; font-weight: 500 }
  .up { color: var(--good) } .down { color: var(--bad) } .same { color: var(--ink-400) }
  .was { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--ink-500) }

  /* 31 day cells — lavender, the app's colour */
  .days { display:grid; grid-template-columns: repeat(31, 1fr); gap: 2px }
  .days i { height: 12px; border-radius: 3px; background: rgba(255,255,255,.06) }
  .days i.on { background: var(--lav-400); box-shadow: 0 0 8px -2px var(--shine); animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--d) * 18ms + 400ms) }
  .days i.on.lo { background: color-mix(in oklch, var(--lav-400) 55%, transparent) }
  .days i.today { box-shadow: inset 0 0 0 1px var(--lav-300) }
  .days i.future { opacity: .35 }
  .settled .days i.on { animation: none }
  .days i.new { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both !important }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } }
  @keyframes grow { from { width: 0 } }
  .spark { height: 22px; width: 100%; animation: wipe 1.4s .5s ease-out both }
  .spark path { fill: none; stroke: var(--lav-400); stroke-width: 2; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--shine)) }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }

  .foot { display:flex; justify-content:flex-end; align-items:center; min-height: 30px }
  .plus { height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(181,171,252,.4); color: var(--lav-300); font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    transition: background .2s, box-shadow .2s }
  .plus:hover { background: rgba(181,171,252,.12); box-shadow: 0 0 16px -4px var(--shine) }
  .plus.saving { color: var(--ink-400); border-style: dashed }
  .plus.saved { background: var(--lav-400); color: #12121c; border-color: var(--lav-400) }
  .auto { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; color: var(--ink-500) }
  .bump { display:inline-block; animation: bump .55s cubic-bezier(.3,1.6,.5,1) }
  @keyframes bump { 0% { transform: translateY(14px) scale(.85); opacity: 0 } }

  @media (max-width: 860px) { .bento { grid-template-columns: repeat(2, 1fr) } }
  @media (max-width: 640px) { .top, .row2, .bento { grid-template-columns: 1fr } .six { position: static; display:inline-block; margin-top: 10px } }

  /* ── today: one live card ── */
  .next { display:grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center }
  .nextt { font-size: 40px; font-weight: 300; letter-spacing: -.02em; margin: 6px 0 10px }
  .nextt .at { font-family: var(--mono); font-size: 18px; color: var(--lav-300); vertical-align: middle; margin-left: 6px }
  .live { display:inline-flex; align-items:center; gap: 6px }
  .live::before { content:''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ping 1.6s ease-out infinite }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 currentColor } 80%,100% { box-shadow: 0 0 0 7px transparent } }
  .line { position: relative; height: 64px }
  .line .track { position:absolute; left:0; right:0; top: 26px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.06) }
  .line .past { position:absolute; left:0; top: 26px; height: 6px; border-radius: 3px; width: var(--w); background: linear-gradient(90deg, transparent, rgba(181,171,252,.35)); animation: grow 1.2s .3s cubic-bezier(.2,.8,.2,1) both }
  .line .ev { position:absolute; top: 18px; height: 22px; border-radius: 6px; background: var(--lav-400); box-shadow: 0 0 18px -2px var(--shine);
    font-family: var(--mono); font-size: 9.5px; color: #12121c; display:grid; place-items:center; animation: pop .5s .6s cubic-bezier(.3,1.6,.5,1) both }
  .line .now { position:absolute; top: 10px; bottom: 16px; width: 2px; background: var(--ink-100); border-radius: 1px; box-shadow: 0 0 10px var(--ink-100) }
  .line .now::before { content:''; position:absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-100); animation: ping 1.6s ease-out infinite; color: var(--ink-100) }
  .line .hr { position:absolute; bottom: 0; font-family: var(--mono); font-size: 9px; color: var(--ink-500); transform: translateX(-50%) }
  .threeh { display:flex; justify-content:space-between; align-items:center; margin: 18px 0 10px; padding-top: 16px; border-top: 1px solid var(--edge) }
  .threes { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
  .q { border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,.025); padding: 12px; min-height: 92px; display:flex; flex-direction:column; gap: 8px; text-align:left }
  .q .k { font-family: var(--mono); font-size: 10px; color: var(--ink-500) }
  .q.filled { animation: pop .4s cubic-bezier(.3,1.6,.5,1) }
  .q .qt { font-size: 15px; display:flex; align-items:center; gap: 10px; flex: 1 }
  .q .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-500); flex: none; display:grid; place-items:center; font-size: 11px; transition: all .2s }
  .q .tick:hover { border-color: var(--lav-400); box-shadow: 0 0 10px -2px var(--shine) }
  .q.done { border-color: color-mix(in oklch, var(--good) 35%, transparent) }
  .q.done .tick { background: var(--good); border-color: var(--good); color: #12121c; animation: pop .45s cubic-bezier(.3,1.6,.5,1) }
  .q.done .qt span:last-child { color: var(--ink-500); text-decoration: line-through }
  .q.empty { border-style: dashed }
  .sugg { display:flex; flex-wrap: wrap; gap: 6px }
  .sg { display:inline-flex; align-items:center; gap: 6px; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--edge); font-size: 12px; color: var(--ink-200); transition: border-color .2s, box-shadow .2s }
  .sg:hover { border-color: rgba(181,171,252,.5); box-shadow: 0 0 14px -6px var(--shine) }
  .sg svg { width: 12px; height: 12px; color: var(--a) }
  .own { flex: 1 1 120px; min-width: 0; padding: 5px 10px; border-radius: 999px; border: 1px dashed rgba(181,171,252,.4); background: transparent; color: var(--ink-100); font: inherit; font-size: 12px; outline: none }
  .own::placeholder { color: var(--lav-300) }
  .own:focus { border-style: solid; border-color: var(--lav-400); box-shadow: 0 0 14px -6px var(--shine) }
  @media (max-width: 640px) { .next, .threes { grid-template-columns: 1fr } }
</style>
</head>
<body>

<div class="ctl">
  MOCKUP ·
  <button data-s="now" class="on">17 OCT · AS IT IS</button>
  <button data-s="good">17 OCT · A GOOD MONTH</button>
</div>

<div class="page" id="page">
  <section class="top">
    <div>
      <div class="hello">Good afternoon, ARTEM.</div>
      <div class="meta">
        <span class="caps">LEVEL 32</span><span class="lvbar"><i></i></span><span class="caps">58 DAYS TO 33</span>
        <span class="caps">·</span><span class="caps" style="color:var(--lav-400)">CURRENT FOCUS</span><span class="caps" style="color:var(--ink-100)">SOLOLEVELING</span>
      </div>
    </div>
    <div class="principle">
      <span class="caps" style="color:var(--principle)">PRINCIPLE 06 <span style="color:var(--ink-500)">/ 06</span></span>
      <span class="six">✦ READ ALL SIX</span>
      <div class="big">BUILD &gt; CONSUME.</div>
    </div>
  </section>

  <section class="card day" style="--i:1">
    <div class="ch">
      <span class="caps">TODAY · <span style="color:var(--ink-200)">SAT 17 OCT</span></span>
      <span class="caps">NOW <span style="color:var(--lav-300)" id="clock">11:50</span></span>
    </div>
    <div class="next">
      <div>
        <span class="caps">NEXT</span>
        <div class="nextt">PT <span class="at">14:00</span></div>
        <span class="badge b-lav live">IN 2H 10M · 60 MIN</span>
      </div>
      <div class="line" id="line"></div>
    </div>
    <div class="threeh"><span class="caps">TODAY'S THREE</span><span class="badge b-lav" id="three">0 OF 3</span></div>
    <div class="threes" id="threes"></div>
  </section>

  <section class="card" style="--i:3">
    <div class="ch"><span class="caps">THIS MONTH · OCTOBER</span><span class="caps">DAY 17 OF 31</span></div>
    <div class="bento" id="bento"></div>
  </section>
</div>

<script>
const IC = {
  lang:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.6 2.6 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.3 4.4-4.5 5.2M8.5 14l3-7 3 7M9.5 11.8h4"/></svg>',
  body:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 6v4M4 4.5v7M12 4.5v7M14.5 6v4M4 8h8"/></svg>',
  shake: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4.5 4.5h7l-1 9.5h-5zM4 4.5h8M8 4.5V1.5l2-.5"/></svg>',
  post:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z"/></svg>',
  proj:  '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.5"/><path d="M1 8h4.5M10.5 8H15"/></svg>',
  money: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l4-4 3 3 5-6M10 5h4v4"/></svg>',
};
const TODAY = 16; // index of 17 Oct
const empty = () => Array(31).fill(0);
const on = (...d) => { const a = empty(); d.forEach(x => a[x - 1]++); return a };
const commits = () => { const a = empty(); [[1,22],[2,40],[5,31],[6,18],[7,44],[8,52],[9,12],[12,36],[13,68],[14,32],[15,36]].forEach(([d,n]) => a[d-1] = n); return a };

// Mock: October so far vs all of September. Goals: langs 4, workout 12 (his real targets).
const BASE = () => [
  { k:'lang',  name:'LANGS',   ic:'lang',  a:'var(--a-lang)',     days: empty(),  sep: 4,  goal: 4,  tap:'+ SESSION' },
  { k:'work',  name:'WORKOUT', ic:'body',  a:'var(--a-body)',     days: empty(),  sep: 7,  goal: 12, tap:'+ WORKOUT' },
  { k:'shake', name:'SHAKE',   ic:'shake', a:'var(--a-shake)',    days: empty(),  sep: 1,  tap:'+ SHAKE' },
  { k:'post',  name:'POST',    ic:'post',  a:'var(--a-social)',   days: on(3, 10), sep: 2, tap:'+ POST' },
  { k:'proj',  name:'COMMITS', ic:'proj',  a:'var(--a-projects)', days: commits(), sep: 310, auto:'GITHUB', heat: 40 },
  { k:'money', name:'WORTH',   ic:'money', a:'var(--a-money)',    worth: [45.8,45.9,45.6,45.7,45.5,45.6,45.4,45.4,45.3,45.4,45.5,45.4,45.4,45.1,45.2,44.9,44.9], money: true, auto:'BANK' },
];
let T = BASE(), busy = {}, first = true;

const sum = t => t.days.reduce((a, b) => a + b, 0);
function deltaHtml(t) {
  if (t.money) return `<span class="delta down">▼ €900</span><span class="was">SEP 30 · €45.8k</span>`;
  const d = sum(t) - t.sep;
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
  const mark = d > 0 ? '▲ ' + d : d < 0 ? '▼ ' + -d : '= SAME';
  return `<span class="delta ${cls}">${mark}</span><span class="was">SEPTEMBER ${t.sep}</span>`;
}
function daysHtml(t) {
  if (t.money) {
    const lo = 44.8, hi = 46, n = 31;
    const d = t.worth.map((v, i) => (i ? 'L' : 'M') + ((i + .5) / n * 100).toFixed(1) + ' ' + (20 - (v - lo) / (hi - lo) * 18).toFixed(1)).join(' ');
    return `<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
  }
  return `<div class="days">${t.days.map((n, i) => {
    const lo = t.heat && n && n < t.heat ? 'lo' : '';
    const isNew = busy[t.k] === 'saved' && i === TODAY ? 'new' : '';
    return `<i class="${n ? 'on' : ''} ${lo} ${isNew} ${i === TODAY ? 'today' : ''} ${i > TODAY ? 'future' : ''}" style="--d:${i}"></i>`;
  }).join('')}</div>`;
}
function render() {
  document.getElementById('bento').innerHTML = T.map((t, i) => {
    const s = busy[t.k];
    const value = t.money ? '€44.9k' : sum(t);
    const goal = t.goal ? `<span class="goal"><span class="ring" style="--p:${Math.min(100, sum(t) / t.goal * 100)}"></span>${sum(t)} / ${t.goal}</span>` : '';
    return `<div class="tile ${s === 'saved' ? 'landed' : ''}" style="--a:${t.a};--i:${i}">
      <div class="th"><span class="name"><span class="ic">${IC[t.ic]}</span>${t.name}</span>${goal}</div>
      <div class="mid"><span class="num ${t.money ? 'money' : ''}"><span class="${s === 'saved' ? 'bump' : ''}" data-v="${t.money ? '' : value}">${value}</span></span><span class="vs">${deltaHtml(t)}</span></div>
      ${daysHtml(t)}
      <div class="foot">
        ${t.tap ? `<button class="plus ${s || ''}" onclick="log('${t.k}')">${s === 'saving' ? 'SAVING…' : s === 'saved' ? '✓ SAVED' : t.tap}</button>` : `<span class="auto">AUTO · ${t.auto}</span>`}
      </div>
    </div>`;
  }).join('');
  if (first) countUp();
  first = false;
}
function countUp() {
  document.querySelectorAll('[data-v]').forEach((el, i) => {
    const to = +el.dataset.v; if (!el.dataset.v) return;
    const t0 = performance.now() + 300 + i * 60, dur = 900;
    const step = now => { const p = Math.min(1, Math.max(0, (now - t0) / dur)); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step) };
    requestAnimationFrame(step);
  });
}
function log(k) {
  if (busy[k]) return;
  busy[k] = 'saving'; render();
  setTimeout(() => { T.find(t => t.k === k).days[TODAY]++; busy[k] = 'saved'; render(); }, 600);
  setTimeout(() => { delete busy[k]; render(); }, 2400);
}

// ── today ──
const DAY0 = 8, DAY1 = 24, NOW = 11 + 50/60;
const x = h => ((h - DAY0) / (DAY1 - DAY0) * 100).toFixed(2) + '%';
document.getElementById('line').innerHTML =
  `<span class="track"></span><span class="past" style="--w:${x(NOW)}"></span>
   <span class="ev" style="left:${x(14)};width:calc(${x(15)} - ${x(14)})">PT</span>
   <span class="now" style="left:${x(NOW)}"></span>` +
  [8, 12, 16, 20, 24].map(h => `<span class="hr" style="left:${x(h)}">${String(h % 24).padStart(2, '0')}</span>`).join('');

const SUG = [
  { t: 'PT', ic: 'body', a: 'var(--a-body)' },
  { t: 'Portuguese', ic: 'lang', a: 'var(--a-lang)' },
  { t: 'Post', ic: 'post', a: 'var(--a-social)' },
  { t: 'Today build', ic: 'proj', a: 'var(--a-projects)' },
];
let Q = [];
function renderThree() {
  const left = SUG.filter(s => !Q.some(q => q.t === s.t));
  document.getElementById('threes').innerHTML = [0, 1, 2].map(i => {
    const q = Q[i];
    if (q) return `<div class="q filled ${q.done ? 'done' : ''}"><span class="k">0${i + 1}</span>
      <span class="qt"><button class="tick" onclick="tickQ(${i})">${q.done ? '✓' : ''}</button><span style="display:flex;align-items:center;gap:8px"><span class="ic" style="--a:${q.a};width:22px;height:22px">${IC[q.ic]}</span></span><span>${q.t}</span></span></div>`;
    if (i !== Q.length) return `<div class="q empty"><span class="k">0${i + 1}</span></div>`;
    return `<div class="q empty"><span class="k">0${i + 1}</span><div class="sugg">${left.map(s =>
      `<button class="sg" style="--a:${s.a}" onclick="pickQ('${s.t}')">${IC[s.ic]}${s.t}</button>`).join('')}
      <input class="own" placeholder="＋ own task" onkeydown="if(event.key==='Enter'&&this.value.trim()){ownQ(this.value.trim())}"></div></div>`;
  }).join('');
  const done = Q.filter(q => q.done).length;
  document.getElementById('three').textContent = Q.length < 3 ? `${Q.length} OF 3` : `${done} OF 3 DONE`;
}
function pickQ(t) { if (Q.length < 3) Q.push({ ...SUG.find(s => s.t === t) }); renderThree() }
function ownQ(t) { if (Q.length < 3) Q.push({ t, ic: 'proj', a: 'var(--ink-300)' }); renderThree() }
function tickQ(i) { Q[i].done = !Q[i].done; renderThree() }

function scenario(s) {
  T = BASE(); busy = {}; first = true; Q = []; document.body.classList.remove('settled');
  if (s === 'good') {
    T[0].days = on(2, 6, 9, 13, 16);
    T[1].days = on(1, 3, 5, 7, 8, 10, 12, 14, 15, 17);
    T[2].days = on(3, 8, 15);
    T[3].days = on(3, 7, 10, 14);
    Q = [{ ...SUG[0], done: true }, { ...SUG[1], done: true }, { ...SUG[2] }];
  }
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  render(); renderThree();
  setTimeout(() => document.body.classList.add('settled'), 1500);
}
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => scenario(b.dataset.s));
scenario('now');
</script>
</body>
</html>
