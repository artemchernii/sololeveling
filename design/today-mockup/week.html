<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today mockup · week</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Values from src/styles/tokens.css, as in design/review-mockup */
  :root {
    --bg: #12121c;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --bad: oklch(0.68 0.2 22);
    --glass: linear-gradient(155deg, rgba(233,233,237,.06), rgba(233,233,237,.015));
    --edge: rgba(233,233,237,.09);
    --shadow: inset 0 1px 0 rgba(233,233,237,.07), 0 24px 48px -28px rgba(0,0,0,.9);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --a-lang: oklch(0.8 0.1 190); --a-body: oklch(0.8 0.1 155); --a-shake: oklch(0.8 0.1 120);
    --a-social: oklch(0.8 0.1 15); --a-projects: oklch(0.8 0.1 352); --a-money: oklch(0.8 0.1 88);
    --principle: oklch(0.78 0.12 340);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(900px 500px at 0% -10%, #2a2346 0%, transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-400) }

  .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding: 10px 16px 0; font-family: var(--mono); font-size: 11px; color: oklch(0.79 0.15 75); letter-spacing: .08em }
  .ctl button { color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px }
  .ctl button.on { color: var(--ink-100); border-color: oklch(0.79 0.15 75) }

  .page { max-width: 1060px; margin: 0 auto; padding: 22px 16px 60px; display:flex; flex-direction:column; gap: 16px }

  /* ── top: as the app has it now ── */
  .top { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; padding-bottom: 8px }
  .hello { font-size: 34px; font-weight: 500; letter-spacing: -.02em }
  .meta { display:flex; align-items:center; gap: 12px; margin-top: 12px; flex-wrap: wrap }
  .lvbar { width: 110px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow:hidden }
  .lvbar i { display:block; height:100%; width: 84%; background: var(--ink-200); animation: grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both }
  .principle { position: relative }
  .principle .big { font-size: 30px; font-weight: 300; letter-spacing: .01em; color: var(--principle); margin-top: 26px }
  .six { position:absolute; right: 0; top: -6px; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-200) }

  .card { position: relative; border-radius: 18px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow); padding: 18px 20px;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms) }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px) } }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px }
  .ch { display:flex; justify-content:space-between; align-items:center; margin-bottom: 18px }
  .ev { display:flex; align-items:center; gap: 14px; padding: 4px 0 }
  .ev .bar { width: 2px; height: 26px; background: var(--ink-300); border-radius: 1px }
  .ev .t { font-family: var(--mono); font-size: 13px; color: var(--ink-200) }
  .ev .n { font-size: 16px; flex: 1 }
  .ev .d { font-family: var(--mono); font-size: 12px; color: var(--ink-400) }
  .slot { display:flex; align-items:center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--edge); min-height: 46px }
  .slot:first-of-type { border-top: 0; padding-top: 2px }
  .slot .k { font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 18px }
  .slot .add { color: var(--ink-400); font-size: 16px }

  .badge { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
  .b-lav { color: var(--lav-400) }

  /* ── THIS WEEK: days across, hours down ── */
  .wk { position: relative; display:grid; grid-template-columns: 34px 1fr; margin-top: 4px }
  .ax { position:relative; height: var(--H) ; margin-top: 22px }
  .ax span { position:absolute; right: 8px; transform: translateY(-50%); font-family: var(--mono); font-size: 9.5px; color: var(--ink-500) }
  .ax span.nowl { color: var(--ink-100); background: #1b1b2a; border-radius: 4px; padding: 0 3px; z-index: 3 }
  .grid { position: relative }
  .hd { display:grid; grid-template-columns: repeat(7,1fr); height: 22px }
  .hd div { text-align:center; font-family: var(--mono); font-size: 9.5px; letter-spacing:.12em; color: var(--ink-500) }
  .hd div.today { color: var(--lav-300) }
  .cols { position: relative; display:grid; grid-template-columns: repeat(7,1fr); height: var(--H); border-top: 1px solid var(--edge) }
  .col { position: relative; border-left: 1px solid var(--edge); cursor: crosshair }
  .col:first-child { border-left: 0 }
  .col.today { background: linear-gradient(180deg, rgba(181,171,252,.04), rgba(181,171,252,.09)) }
  .hl { position:absolute; left:0; right:0; border-top: 1px dashed rgba(233,233,237,.06); pointer-events:none }
  .nowline { position:absolute; left:0; right:0; top: var(--ny); height: 0; border-top: 1px solid rgba(241,241,245,.22); pointer-events:none; z-index: 2 }
  .nowline i { position:absolute; left: calc(6 / 7 * 100%); right: 0; top: -1px; height: 2px; background: var(--ink-100); box-shadow: 0 0 10px var(--ink-100); border-radius: 1px }
  .nowline i::before { content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background: var(--ink-100); animation: ping 1.6s ease-out infinite }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(241,241,245,.5) } 100% { box-shadow: 0 0 0 10px rgba(241,241,245,0) } }
  .blk { position:absolute; height: 22px; border-radius: 6px; background: var(--a); color:#12121c; font-family: var(--mono); font-size: 9px; line-height: 22px; padding: 0 5px;
    overflow: hidden; white-space: nowrap; box-shadow: 0 0 14px -4px var(--a); cursor: default; z-index: 4;
    animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * 30ms + 300ms); transition: transform .2s, box-shadow .2s }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } }
  .blk:hover { transform: scale(1.06); box-shadow: 0 0 24px 0 var(--a); z-index: 6 }
  .blk.up { background: transparent; color: var(--a); border: 1px dashed var(--a); box-shadow: none; line-height: 20px }
  .blk.still { animation: none }
  .blk.new { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both, landed 1.2s ease-out }
  @keyframes landed { 0% { box-shadow: 0 0 0 2px var(--lav-400), 0 0 30px 2px var(--a) } }
  .ghost { position:absolute; left: 3px; right: 3px; height: 22px; border-radius: 6px; border: 1px dashed rgba(181,171,252,.55); color: var(--lav-300); display:none; align-items:center; justify-content:center;
    font-family: var(--mono); font-size: 10px; pointer-events:none; z-index: 3; background: rgba(181,171,252,.07) }
  .col:hover .ghost { display:flex }
  .pick { position:fixed; z-index: 60; width: 190px; padding: 10px; border-radius: 14px; border: 1px solid var(--edge); background: #1b1b2a; box-shadow: 0 24px 50px -12px #000; display:none; animation: arrive .25s both }
  .pick.on { display:block }
  .pick .t { font-family: var(--mono); font-size: 10px; letter-spacing:.14em; color: var(--ink-300); margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center }
  .pick button { display:flex; align-items:center; gap: 8px; width:100%; padding: 6px 8px; border-radius: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing:.12em; color: var(--ink-200); text-align:left }
  .pick button i { width: 8px; height: 8px; border-radius: 50%; background: var(--a) }
  .pick button:hover { background: rgba(255,255,255,.07) }
  .tip { position:fixed; z-index: 50; pointer-events:none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--edge); background: #1b1b2a; box-shadow: 0 18px 40px -12px #000;
    font-family: var(--mono); font-size: 10.5px; letter-spacing:.08em; color: var(--ink-200); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: nowrap }
  .tip.on { opacity: 1; transform: none }
  .tip b { display:block; font-weight: 500; font-size: 12px; letter-spacing:.14em; color: var(--a); margin-bottom: 4px }
  .tip span { color: var(--ink-400) }
  .legend { display:flex; gap: 8px; flex-wrap: wrap }
  .chip { display:inline-flex; align-items:center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing:.12em; color: var(--ink-300); border: 1px solid var(--edge); border-radius: 999px; padding: 3px 10px }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--a) }
  .chip b { font-weight: 500; color: var(--ink-100) }
  .empty { position:absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 5 }
</style>
</head>
<body>
<div class="ctl">STATE <button data-s="busy" class="on">BUSY</button><button data-s="quiet">QUIET</button><button data-s="empty">EMPTY</button></div>
<div class="page">
  <div class="card" style="--i:0">
    <div class="ch"><span class="caps">THIS WEEK · 12 – 18 OCT</span><div class="legend" id="legend"></div></div>
    <div class="wk" id="wk" style="--H:432px">
      <div class="ax" id="ax"></div>
      <div class="grid"><div class="hd" id="hd"></div><div class="cols" id="cols"></div></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="pick" id="pick"></div>
<script>
const A={workout:['WORKOUT','var(--a-body)'],langs:['SESSION','var(--a-lang)'],shake:['SHAKE','var(--a-shake)'],post:['POST','var(--a-social)'],commit:['COMMITS','var(--a-projects)'],spend:['SPEND','var(--a-money)']};
const D=['MON 12','TUE 13','WED 14','THU 15','FRI 16','SAT 17','SUN 18'];
const FROM=6,TO=24,H=432,PX=H/(TO-FROM),NOW=20.05; // Sun 20:03
const BUSY=[[0,7.5,'workout','60 MIN · LEGS'],[0,19,'langs','25 MIN · PORTUGUESE'],[1,8,'shake','1 SHAKE'],[1,12.5,'commit','4 COMMITS · SOLOLEVELING'],[1,18,'workout','45 MIN'],
[2,9,'langs','20 MIN'],[2,13,'spend','€48 · GROCERIES'],[2,13.4,'shake','1 SHAKE'],[3,7,'workout','60 MIN'],[3,15,'post','1 POST · LINKEDIN'],[3,21,'langs','30 MIN'],
[4,8.5,'shake','1 SHAKE'],[4,11,'commit','9 COMMITS'],[4,17.5,'workout','50 MIN'],[5,10,'langs','40 MIN'],[5,11.2,'spend','€12 · COFFEE'],[5,16,'commit','3 COMMITS'],[6,9,'shake','1 SHAKE'],[6,14,'workout','35 MIN']].map(r=>[...r,0]);
const UP=[[6,21.5,'langs','25 MIN',1]];
const S={busy:[...BUSY,...UP],quiet:[BUSY[0],BUSY[5],BUSY[12]],empty:[]};
let state='busy',items=[],fresh=-1,drawn=false;
const $=id=>document.getElementById(id),tip=$('tip'),pick=$('pick');
const hh=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0');
const y=h=>(Math.min(TO-.4,Math.max(FROM,h))-FROM)*PX;
function draw(){
  $('ax').innerHTML=[6,9,12,15,18,21].map(h=>`<span style="top:${y(h)}px">${String(h).padStart(2,'0')}</span>`).join('')+`<span class="nowl" style="top:${y(NOW)}px">${hh(NOW)}</span>`;
  $('hd').innerHTML=D.map((d,i)=>`<div class="${i==6?'today':''}">${d}</div>`).join('');
  const cols=$('cols');cols.innerHTML='';
  const hl=[9,12,15,18,21].map(h=>`<i class="hl" style="top:${y(h)}px"></i>`).join('');
  D.forEach((d,i)=>{const c=document.createElement('div');c.className='col'+(i==6?' today':'');c.dataset.d=i;c.innerHTML=hl+'<div class="ghost"></div>';
    c.onmousemove=e=>{const r=c.getBoundingClientRect(),h=snap(FROM+(e.clientY-r.top)/PX),g=c.querySelector('.ghost');g.style.top=(y(h)-11)+'px';g.textContent='+ '+hh(h)};
    c.onclick=e=>{if(e.target.closest('.blk'))return;const r=c.getBoundingClientRect(),h=snap(FROM+(e.clientY-r.top)/PX);open(e,i,h)};
    cols.appendChild(c)});
  const ny=document.createElement('div');ny.className='nowline';ny.style.setProperty('--ny',y(NOW)+'px');ny.innerHTML='<i></i>';cols.appendChild(ny);
  const count={},W=cols.clientWidth/7;
  items.forEach((it,n)=>{const [d,h,k,det,up]=it;if(!up)count[k]=(count[k]||0)+1;
    const group=items.filter(o=>o[0]==d&&Math.abs(o[1]-h)*PX<24&&items.indexOf(o)<=n),slot=group.length-1,all=items.filter(o=>o[0]==d&&Math.abs(o[1]-h)*PX<24).length,w=(W-8)/Math.max(all,1);
    const b=document.createElement('div');b.className='blk'+(up?' up':'')+(n==fresh?' new':'')+(drawn&&n!=fresh?' still':'');b.style.cssText=`left:${4+slot*w}px;width:${w-3}px;top:${y(h)-11}px;--a:${A[k][1]};--i:${n}`;
    b.textContent=W>80?A[k][0]:'';
    b.onmouseenter=()=>{tip.style.setProperty('--a',A[k][1]);tip.innerHTML=`<b>${A[k][0]}${up?' · PLANNED':''}</b>${det}<br><span>${D[d]} · ${hh(h)}</span>`;
      const r=b.getBoundingClientRect();tip.classList.add('on');tip.style.left=Math.min(innerWidth-tip.offsetWidth-12,Math.max(12,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-10)+'px'};
    b.onmouseleave=()=>tip.classList.remove('on');cols.children[d].appendChild(b)});
  if(!items.length){const e=document.createElement('div');e.className='empty badge b-lav';e.textContent='NOTHING LOGGED';cols.appendChild(e)}
  $('legend').innerHTML=Object.keys(A).map(k=>`<span class="chip" style="--a:${A[k][1]}"><i></i>${A[k][0]} <b>${count[k]||0}</b></span>`).join('');
  fresh=-1;drawn=true;
}
const snap=h=>Math.min(TO-.5,Math.max(FROM,Math.round(h*2)/2));
function open(e,d,h){const up=d*24+h>6*24+NOW;
  pick.innerHTML=`<div class="t"><span>${D[d]} · ${hh(h)}</span><span class="badge ${up?'b-lav':''}">${up?'PLAN':'LOG'}</span></div>`+Object.keys(A).map(k=>`<button data-k="${k}" style="--a:${A[k][1]}"><i></i>${A[k][0]}</button>`).join('');
  pick.classList.add('on');pick.style.left=Math.min(innerWidth-202,Math.max(8,e.clientX+8))+'px';pick.style.top=Math.min(innerHeight-250,Math.max(8,e.clientY-20))+'px';
  pick.querySelectorAll('button').forEach(b=>b.onclick=()=>{items.push([d,h,b.dataset.k,'ADDED NOW',up?1:0]);fresh=items.length-1;pick.classList.remove('on');draw()});
  e.stopPropagation()}
document.addEventListener('click',e=>{if(!pick.contains(e.target))pick.classList.remove('on')});
addEventListener('keydown',e=>{if(e.key=='Escape')pick.classList.remove('on')});
document.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ctl button').forEach(x=>x.classList.toggle('on',x==b));state=b.dataset.s;drawn=false;items=S[state].map(r=>[...r]);draw()});
items=S.busy.map(r=>[...r]);draw();addEventListener('resize',draw);
</script>
</body></html>
