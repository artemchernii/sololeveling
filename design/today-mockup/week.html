<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Today mockup · week</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Values from src/styles/tokens.css, as in design/review-mockup */
  :root {
    --bg: #12121c;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --bad: oklch(0.68 0.2 22);
    --glass: linear-gradient(155deg, rgba(233,233,237,.06), rgba(233,233,237,.015));
    --edge: rgba(233,233,237,.09);
    --shadow: inset 0 1px 0 rgba(233,233,237,.07), 0 24px 48px -28px rgba(0,0,0,.9);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --a-lang: oklch(0.8 0.1 190); --a-body: oklch(0.8 0.1 155); --a-shake: oklch(0.8 0.1 120);
    --a-social: oklch(0.8 0.1 15); --a-projects: oklch(0.8 0.1 352); --a-money: oklch(0.8 0.1 88);
    --principle: oklch(0.78 0.12 340);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(900px 500px at 0% -10%, #2a2346 0%, transparent 60%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 13px; min-height: 100vh }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-400) }

  .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding: 10px 16px 0; font-family: var(--mono); font-size: 11px; color: oklch(0.79 0.15 75); letter-spacing: .08em }
  .ctl button { color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px }
  .ctl button.on { color: var(--ink-100); border-color: oklch(0.79 0.15 75) }

  .page { max-width: 1060px; margin: 0 auto; padding: 22px 16px 60px; display:flex; flex-direction:column; gap: 16px }

  /* ── top: as the app has it now ── */
  .top { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; padding-bottom: 8px }
  .hello { font-size: 34px; font-weight: 500; letter-spacing: -.02em }
  .meta { display:flex; align-items:center; gap: 12px; margin-top: 12px; flex-wrap: wrap }
  .lvbar { width: 110px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow:hidden }
  .lvbar i { display:block; height:100%; width: 84%; background: var(--ink-200); animation: grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both }
  .principle { position: relative }
  .principle .big { font-size: 30px; font-weight: 300; letter-spacing: .01em; color: var(--principle); margin-top: 26px }
  .six { position:absolute; right: 0; top: -6px; border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-200) }

  .card { position: relative; border-radius: 18px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow); padding: 18px 20px;
    animation: arrive .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms) }
  @keyframes arrive { from { opacity: 0; transform: translateY(10px) } }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px }
  .ch { display:flex; justify-content:space-between; align-items:center; margin-bottom: 18px }
  .ev { display:flex; align-items:center; gap: 14px; padding: 4px 0 }
  .ev .bar { width: 2px; height: 26px; background: var(--ink-300); border-radius: 1px }
  .ev .t { font-family: var(--mono); font-size: 13px; color: var(--ink-200) }
  .ev .n { font-size: 16px; flex: 1 }
  .ev .d { font-family: var(--mono); font-size: 12px; color: var(--ink-400) }
  .slot { display:flex; align-items:center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--edge); min-height: 46px }
  .slot:first-of-type { border-top: 0; padding-top: 2px }
  .slot .k { font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 18px }
  .slot .add { color: var(--ink-400); font-size: 16px }

  .badge { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
  .b-lav { color: var(--lav-400) }

  /* ── THIS WEEK: days across, three bands down ── */
  .wk { display:grid; grid-template-columns: 56px repeat(7,1fr); gap: 4px }
  .hd { text-align:center; font-family: var(--mono); font-size: 9.5px; letter-spacing:.12em; color: var(--ink-500); padding-bottom: 4px }
  .hd.today { color: var(--lav-300) }
  .bn { font-family: var(--mono); font-size: 9px; letter-spacing:.14em; color: var(--ink-500); display:flex; align-items:center }
  .bn.cur { color: var(--lav-300) }
  .cell { position:relative; min-height: 38px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(255,255,255,.02); padding: 5px; display:flex; flex-wrap: wrap; gap: 4px; align-content: center; justify-content:center;
    cursor: pointer; transition: border-color .2s, background .2s }
  .cell:hover { border-color: rgba(181,171,252,.4); background: rgba(181,171,252,.05) }
  .cell.lock { cursor: default; opacity: .35 }
  .cell.lock:hover { border-color: var(--edge); background: rgba(255,255,255,.02) }
  .cell.today { background: rgba(181,171,252,.05) }
  .cell.nowc { border-color: var(--lav-400); box-shadow: 0 0 22px -8px var(--shine), inset 0 0 0 1px rgba(181,171,252,.25) }
  .nowt { position:absolute; right: 4px; top: -7px; font-family: var(--mono); font-size: 8.5px; color: #12121c; background: var(--ink-100); border-radius: 4px; padding: 0 4px; line-height: 13px; z-index: 3 }
  .nowt::before { content:''; position:absolute; left:-9px; top: 3px; width:6px; height:6px; border-radius:50%; background: var(--ink-100); animation: ping 1.6s ease-out infinite }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(241,241,245,.5) } 100% { box-shadow: 0 0 0 9px rgba(241,241,245,0) } }
  .blk { height: 18px; min-width: 24px; flex: 0 1 auto; border-radius: 6px; background: var(--a); color:#12121c; font-family: var(--mono); font-size: 8.5px; line-height: 18px; padding: 0 5px;
    overflow: hidden; white-space: nowrap; box-shadow: 0 0 12px -4px var(--a);
    animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * 30ms + 300ms); transition: transform .2s, box-shadow .2s }
  @keyframes pop { from { transform: scale(.3); opacity: 0 } }
  .blk:hover { transform: scale(1.1); box-shadow: 0 0 20px 0 var(--a); z-index: 6 }
  .blk { cursor: grab }
  .blk.drag { opacity: .35 }
  .cell.over { border-color: var(--lav-400); background: rgba(181,171,252,.12); box-shadow: 0 0 20px -6px var(--shine) }
  .cell.no { border-color: var(--bad) }
  .blk { display:inline-flex; align-items:center; gap: 4px; justify-content:center }
  .blk svg, u svg { width: 11px; height: 11px; flex: none }
  u { display:inline-flex; color: var(--a); text-decoration: none }
  .blk.still { animation: none }
  .blk.new { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both, landed 1.2s ease-out }
  @keyframes landed { 0% { box-shadow: 0 0 0 2px var(--lav-400), 0 0 30px 2px var(--a) } }
  .plus { display:none; height: 18px; min-width: 18px; border-radius: 6px; border: 1px dashed rgba(181,171,252,.6); color: var(--lav-300); font-family: var(--mono); font-size: 11px; line-height: 16px; text-align:center }
  .cell:not(.lock):hover .plus { display:block }
  .pick { position:fixed; z-index: 60; width: 190px; padding: 10px; border-radius: 14px; border: 1px solid var(--edge); background: #1b1b2a; box-shadow: 0 24px 50px -12px #000; display:none; animation: arrive .25s both }
  .pick.on { display:block }
  .pick .t { font-family: var(--mono); font-size: 10px; letter-spacing:.14em; color: var(--ink-300); margin-bottom: 8px }
  .pick button { display:flex; align-items:center; gap: 8px; width:100%; padding: 6px 8px; border-radius: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing:.12em; color: var(--ink-200); text-align:left }
  .pick button i { width: 8px; height: 8px; border-radius: 50%; background: var(--a) }
  .pick button:hover { background: rgba(255,255,255,.07) }
  .tip { position:fixed; z-index: 50; pointer-events:none; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--edge); background: #1b1b2a; box-shadow: 0 18px 40px -12px #000;
    font-family: var(--mono); font-size: 10.5px; letter-spacing:.08em; color: var(--ink-200); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: nowrap }
  .tip.on { opacity: 1; transform: none }
  .tip b { display:block; font-weight: 500; font-size: 12px; letter-spacing:.14em; color: var(--a); margin-bottom: 4px }
  .tip span { color: var(--ink-400) }
  .legend { display:flex; gap: 8px; flex-wrap: wrap }
  .chip { display:inline-flex; align-items:center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing:.12em; color: var(--ink-300); border: 1px solid var(--edge); border-radius: 999px; padding: 3px 10px }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--a) }
  .chip b { font-weight: 500; color: var(--ink-100) }
</style>
</head>
<body>
<div class="ctl">STATE <button data-s="busy" class="on">BUSY</button><button data-s="quiet">QUIET</button><button data-s="empty">EMPTY</button></div>
<div class="page">
  <div class="card" style="--i:0">
    <div class="ch"><span class="caps">THIS WEEK · 12 – 18 OCT</span><div class="legend" id="legend"></div></div>
    <div class="wk" id="wk"></div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="pick" id="pick"></div>
<script>
const A={workout:['WORKOUT','var(--a-body)'],langs:['SESSION','var(--a-lang)'],shake:['SHAKE','var(--a-shake)'],post:['POST','var(--a-social)'],commit:['COMMITS','var(--a-projects)'],spend:['SPEND','var(--a-money)']};
const IC={"workout": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M1.5 6v4M4 4.5v7M12 4.5v7M14.5 6v4M4 8h8\"/></svg>", "langs": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M2 3.5h7M5.5 2v1.5M3.5 3.5c.6 2.6 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.3 4.4-4.5 5.2M8.5 14l3-7 3 7M9.5 11.8h4\"/></svg>", "shake": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4.5 4.5h7l-1 9.5h-5zM4 4.5h8M8 4.5V1.5l2-.5\"/></svg>", "post": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z\"/></svg>", "commit": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"8\" cy=\"8\" r=\"2.5\"/><path d=\"M1 8h4.5M10.5 8H15\"/></svg>", "spend": "<svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M2 12l4-4 3 3 5-6M10 5h4v4\"/></svg>"};
const D=['MON 12','TUE 13','WED 14','THU 15','FRI 16','SAT 17','SUN 18'];
const B=[['MORNING',6,12],['AFTERNOON',12,18],['EVENING',18,24]],NOW=20.05; // Sun 20:03
const BUSY=[[0,7.5,'workout','60 MIN · LEGS'],[0,19,'langs','25 MIN · PORTUGUESE'],[1,8,'shake','1 SHAKE'],[1,12.5,'commit','4 COMMITS · SOLOLEVELING'],[1,18,'workout','45 MIN'],
[2,9,'langs','20 MIN'],[2,13,'spend','€48 · GROCERIES'],[2,13.4,'shake','1 SHAKE'],[3,7,'workout','60 MIN'],[3,15,'post','1 POST · LINKEDIN'],[3,21,'langs','30 MIN'],
[4,8.5,'shake','1 SHAKE'],[4,11,'commit','9 COMMITS'],[4,17.5,'workout','50 MIN'],[5,10,'langs','40 MIN'],[5,11.2,'spend','€12 · COFFEE'],[5,16,'commit','3 COMMITS'],[6,9,'shake','1 SHAKE'],[6,14,'workout','35 MIN']];
const S={busy:BUSY,quiet:[BUSY[0],BUSY[5],BUSY[12]],empty:[]};
let dropAt=0,dragN=-1,items=S.busy.map(r=>[...r]),fresh=-1,drawn=false;
const $=id=>document.getElementById(id),tip=$('tip'),pick=$('pick');
const hh=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round(h%1*60)).padStart(2,'0');
const wide=()=>$('wk').clientWidth>620;
function draw(){
  const wk=$('wk'),count={};wk.innerHTML='<div></div>'+D.map((d,i)=>`<div class="hd${i==6?' today':''}">${wide()?d:d.slice(0,3)}</div>`).join('');
  B.forEach(([name,f,t],bi)=>{
    wk.insertAdjacentHTML('beforeend',`<div class="bn${bi==2?' cur':''}">${wide()?name:name.slice(0,3)}</div>`);
    D.forEach((d,di)=>{
      const isNow=di==6&&NOW>=f&&NOW<t,lock=di==6&&NOW<f;
      const c=document.createElement('div');c.className='cell'+(di==6?' today':'')+(isNow?' nowc':'')+(lock?' lock':'');
      if(isNow)c.insertAdjacentHTML('beforeend',`<span class="nowt">${hh(NOW)}</span>`);
      items.map((it,n)=>[it,n]).filter(([it])=>it[0]==di&&it[1]>=f&&it[1]<t).sort((a,b)=>a[0][1]-b[0][1]).forEach(([it,n])=>{
        const [,h,k,det]=it;count[k]=(count[k]||0)+1;
        const b=document.createElement('div');b.className='blk'+(n==fresh?' new':drawn?' still':'');b.style.cssText=`--a:${A[k][1]};--i:${n}`;b.innerHTML=IC[k]+(wide()?A[k][0]:'');
        b.onmouseenter=()=>{tip.style.setProperty('--a',A[k][1]);tip.innerHTML=`<b>${A[k][0]}</b>${det}<br><span>${D[di]} · ${hh(h)}</span>`;
          const r=b.getBoundingClientRect();tip.classList.add('on');tip.style.left=Math.min(innerWidth-tip.offsetWidth-12,Math.max(12,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-10)+'px'};
        b.onmouseleave=()=>tip.classList.remove('on');
        b.draggable=true;b.ondragstart=e=>{tip.classList.remove('on');dragN=n;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(n));setTimeout(()=>b.classList.add('drag'))};
        b.ondragend=()=>{dragN=-1;draw()};
        c.appendChild(b)});
      if(!lock){c.insertAdjacentHTML('beforeend','<i class="plus">+</i>');c.onclick=e=>{if(Date.now()-dropAt<400)return;if(!e.target.closest('.blk'))open(e,di,isNow?NOW:f)}}
      c.ondragover=e=>{if(dragN<0)return;e.preventDefault();c.classList.add(lock?'no':'over')};
      c.ondragleave=()=>c.classList.remove('over','no');
      c.ondrop=e=>{e.preventDefault();c.classList.remove('over','no');if(dragN<0||lock)return;const it=items[dragN];it[0]=di;it[1]=isNow?Math.min(NOW,Math.max(f,it[1])):f;fresh=dragN;dragN=-1;dropAt=Date.now();draw()};
      wk.appendChild(c)})});
  $('legend').innerHTML=(items.length?'':'<span class="badge b-lav">NOTHING LOGGED</span>')+Object.keys(A).map(k=>`<span class="chip" style="--a:${A[k][1]}"><u>${IC[k]}</u>${A[k][0]} <b>${count[k]||0}</b></span>`).join('');
  fresh=-1;drawn=true;
}
function open(e,d,h){
  pick.innerHTML=`<div class="t">${D[d]} · ${hh(h)}</div>`+Object.keys(A).map(k=>`<button data-k="${k}" style="--a:${A[k][1]}"><u>${IC[k]}</u>${A[k][0]}</button>`).join('');
  pick.classList.add('on');pick.style.left=Math.min(innerWidth-202,Math.max(8,e.clientX+8))+'px';pick.style.top=Math.min(innerHeight-250,Math.max(8,e.clientY-20))+'px';
  pick.querySelectorAll('button').forEach(b=>b.onclick=()=>{items.push([d,h,b.dataset.k,'ADDED NOW']);fresh=items.length-1;pick.classList.remove('on');draw()});
  e.stopPropagation()}
document.addEventListener('click',e=>{if(!pick.contains(e.target))pick.classList.remove('on')});
addEventListener('keydown',e=>{if(e.key=='Escape')pick.classList.remove('on')});
document.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ctl button').forEach(x=>x.classList.toggle('on',x==b));drawn=false;items=S[b.dataset.s].map(r=>[...r]);draw()});
draw();addEventListener('resize',draw);
</script>
</body></html>
