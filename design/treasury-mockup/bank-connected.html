<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · a connected bank</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* A connected bank (11 Oct). Artem, after a day of broken screenshot
     reads: "can we use API?" — and registered Enable Banking himself.
     Overview's account cards as built (AccountCard.tsx), with what changes
     when the bank itself reports the balance and the rows. The check and
     the landed strip are check-sum.html's and landed-balance.html's, kept.
     Sample numbers. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --bank: oklch(0.83 0.1 85);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer }
  svg.i { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 720px; margin: 0 auto; text-align: center }
  .note b { color: var(--ink-200); font-weight: 400 }
  .sect { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine); padding-top: 6px }

  @keyframes arrive { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.15) } }
  @keyframes turn { to { transform: rotate(360deg) } }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 62%, transparent), 0 0 26px -10px var(--warn) } }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 55%, transparent), 0 0 24px -10px var(--lav-400) } }
  @keyframes live { 50% { opacity: .35 } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .spin { width: 12px; height: 12px; border-radius: 999px; border: 2px solid color-mix(in oklch, currentColor 25%, transparent); border-top-color: currentColor; animation: turn .8s linear infinite; flex: none }

  /* The card, as AccountCard.tsx draws it. */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
  .card { display: flex; flex-direction: column; border-radius: 18px; padding: 16px; background: rgba(var(--lift),.055); box-shadow: inset 0 0 0 1px rgba(var(--lift),.12); animation: arrive .3s var(--ease) both; transition: box-shadow .3s }
  .card > * + * { margin-top: 14px }
  .card.ask { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 38%, transparent); animation: arrive .3s var(--ease) both, breathe 2.6s ease-in-out .5s infinite }
  .card.busy { animation: arrive .3s var(--ease) both, glow 2.4s ease-in-out infinite }
  .top { display: flex; align-items: flex-start; gap: 12px }
  .logo { width: 40px; height: 40px; border-radius: 12.5px; background: #fdfdfd; object-fit: contain; padding: 6px; flex: none }
  .logo.s { width: 30px; height: 30px; border-radius: 10px; padding: 6px }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }
  .who b { font-weight: 400; font-size: 17px; line-height: 1 }
  .kinds { display: flex; gap: 4px; flex-wrap: wrap }
  .kind { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; color: var(--bank); background: color-mix(in oklch, var(--bank) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--bank) 35%, transparent) }
  .kind.broker { color: var(--lav-300); background: rgba(181,171,252,.1); box-shadow: inset 0 0 0 1px rgba(181,171,252,.4) }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); background: none; border: 0; box-shadow: inset 0 0 0 1px rgba(var(--lift),.15); border-radius: 999px; padding: 6px 12px; white-space: nowrap; transition: box-shadow .2s, color .2s, transform .1s; flex: none }
  .pill:hover { color: var(--ink-100); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 40%, transparent) }
  .pill:active { transform: scale(.97) }
  .pill svg.i { width: 12px; height: 12px }
  .pill.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 50%, transparent) }
  .pill.loud { color: var(--ink-100); background: rgba(181,171,252,.15); box-shadow: inset 0 0 0 1px rgba(181,171,252,.45) }
  .pill[disabled] { cursor: default; opacity: .8 }
  .total { display: flex; align-items: center; gap: 12px }
  .total b { font-size: 30px; line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums }
  .total svg { margin-left: auto; height: 32px; width: 100%; max-width: 140px }
  .bar { display: flex; height: 6px; gap: 2px }
  .bar span { border-radius: 999px; min-width: 4px }
  .rows { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 12.5px }
  .rows > span { display: flex; justify-content: space-between; align-items: center; gap: 8px }
  .rows .k { color: var(--ink-400) }
  .rows .k i { font-style: normal; font-size: 10.5px; color: var(--ink-200); background: rgba(var(--lift),.08); border-radius: 5px; padding: 2px 6px; margin-left: 4px }
  .rows .k { display: inline-flex; align-items: center }
  .rows .mark { color: var(--good); display: inline-flex; margin-left: 7px }
  .rows .mark svg { width: 12px; height: 12px }
  .rows .sub { justify-content: flex-end; font-size: 11px; gap: 10px; flex-wrap: wrap }
  .red { color: var(--danger) } .green { color: var(--good) } .lav { color: var(--lav-300) } .amber { color: var(--warn) } .dim { color: var(--ink-500) }
  /* What arrived: grows in, the card glides taller. */
  .grow { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); margin-top: 0 !important }
  .grow.on { grid-template-rows: 1fr }
  .grow > div { overflow: hidden; min-height: 0 }
  .grow .in { padding-top: 14px; display: flex; flex-direction: column; gap: 10px }
  .chips { display: flex; gap: 6px; flex-wrap: wrap }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 4px 10px; border-radius: 999px }
  .chip i { width: 6px; height: 6px; border-radius: 999px; background: currentColor }
  .chip.new { color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent); border: 1px solid color-mix(in oklch, var(--good) 35%, transparent) }
  .chip.had { color: #a9a3d6; background: rgba(181,171,252,.08); border: 1px solid rgba(181,171,252,.22) }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(var(--lift),.06); overflow: hidden }
  .cell { display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; border-left: 1px solid rgba(var(--lift),.06); min-width: 0 }
  .cell:first-child { border-left: 0 }
  .cell span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); white-space: nowrap }
  .cell b { font-size: 16px; font-weight: 300; color: var(--ink-200); white-space: nowrap }
  .cell em { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--ink-500); min-height: 12px; display: flex; gap: 4px; align-items: center; white-space: nowrap }
  .cell em svg { width: 11px; height: 11px; stroke-width: 3 }
  .cell.out b { color: oklch(0.72 0.17 25) }
  .cell.in b { color: var(--good) }
  .cell.in.zero b { color: var(--ink-500) }
  .cell.says { background: rgba(181,171,252,.07) }
  .cell.says b { color: var(--ink-100); font-weight: 400 }
  .cell.says.good em { color: var(--good) }
  .cell.says.good em svg { animation: pop .45s var(--ease) .35s both }
  .cell.says.warn em { color: var(--warn) }
  /* In a card: four numbers on one line, the tick beside the count. */
  .got { display: flex; align-items: center; gap: 10px }
  .got .okline { margin-right: auto }
  .shut { width: 26px; height: 26px; border-radius: 999px; border: 0; background: none; box-shadow: inset 0 0 0 1px rgba(var(--lift),.14); color: var(--ink-400); font-size: 11px; display: grid; place-items: center; flex: none; transition: color .2s, box-shadow .2s, transform .1s }
  .shut:hover { color: var(--ink-100); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 40%, transparent) }
  .shut:active { transform: scale(.94) }
  .okline { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--good) }
  .okline svg { width: 12px; height: 12px; stroke-width: 3; animation: pop .45s var(--ease) .5s both }
  .card .strip { grid-template-columns: repeat(4, auto) }
  .card .cell { padding: 8px 10px }
  .card .cell span { letter-spacing: .08em }
  .card .cell b { font-size: 15px }
  .card .cell em { display: none }
  .foot { margin-top: auto !important; padding-top: 12px; border-top: 1px solid rgba(var(--lift),.08); display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap }
  .card > .foot { margin-top: auto !important }
  .card > .gap { flex: 1; margin: 0; min-height: 14px }
  .from { display: flex; flex-direction: column; justify-content: center; gap: 0; min-height: 28px; font-family: var(--mono); font-size: 11px; color: var(--ink-400); min-width: 0; animation: fade .3s both }
  .from span { display: flex; align-items: center; gap: 7px; line-height: 14px }
  .from .l2 { color: var(--ink-500); padding-left: 21px }
  .from .link { color: var(--good) }
  .from .link svg { animation: live 2.6s ease-in-out infinite }
  .from .tick svg { animation: pop .45s var(--ease) both; stroke-width: 3 }
  .btns { display: flex; gap: 6px; margin-left: auto }

  /* The window, as the app's Sheet: [ check it ]. */
  .veil { position: fixed; inset: 0; background: rgba(8,8,16,.66); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; overflow: auto }
  .veil.on { display: flex; animation: fade .2s both }
  .sheet { width: 100%; max-width: 600px; border-radius: 22px; padding: 20px; border: 1px solid var(--sys-edge); background: linear-gradient(160deg, rgba(181,171,252,.08), rgba(181,171,252,.015) 40%), #1d1c2d; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -18px var(--shine); animation: arrive .3s var(--ease) both; margin: auto }
  .shead { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid rgba(181,171,252,.16) }
  .title { flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .close { width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-300); display: grid; place-items: center }
  .sbody { overflow: hidden; transition: height .35s var(--ease) }
  .step { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; animation: fade .3s both }
  .acc { border-radius: 18px; padding: 14px; background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(var(--lift),.07); display: flex; flex-direction: column; gap: 12px }
  .acc.held { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 38%, transparent); animation: breathe 2.6s ease-in-out .5s infinite }
  .acc .atop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
  .acc .name { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 120px }
  .acc .name b { font-weight: 500; font-size: 15px }
  .acc .name span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .bal { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--ink-300); flex-wrap: wrap; justify-content: flex-end }
  .bal .to { color: var(--ink-100); font-size: 15px }
  .bal small { color: var(--ink-500); font-size: 10px }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap }
  .tag.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, transparent) }
  .tag.good { color: var(--good); background: color-mix(in oklch, var(--good) 12%, transparent) }
  .off { border-radius: 14px; padding: 12px 13px; background: color-mix(in oklch, var(--warn) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 30%, transparent); display: flex; flex-direction: column; gap: 10px }
  .q { display: flex; gap: 9px; align-items: flex-start; line-height: 1.5; font-size: 13.5px }
  .q > svg { color: var(--warn); margin-top: 3px }
  .q b { font-weight: 500 }
  .q small { display: block; color: var(--ink-400); font-size: 12px }
  .line { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-200); margin-left: 23px; padding: 7px 10px; border-radius: 10px; background: rgba(0,0,0,.22) }
  .line .d { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .line .v { font-family: var(--mono) }
  .line small { display: block; font-size: 11.5px; color: var(--ink-400) }
  .line.mine { background: none; box-shadow: inset 0 0 0 1px rgba(181,171,252,.22); color: var(--ink-300) }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 23px }
  .opt { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: rgba(var(--lift),.03); font-size: 12.5px; color: var(--ink-200); transition: border-color .2s, background .2s, transform .1s }
  .opt.loud { border-color: color-mix(in oklch, var(--lav-400) 50%, transparent); background: rgba(181,171,252,.14) }
  .opt:hover { border-color: color-mix(in oklch, var(--lav-400) 55%, transparent); background: rgba(181,171,252,.1) }
  .opt:active { transform: scale(.97) }
  .done { display: flex; align-items: center; gap: 9px; border-radius: 14px; padding: 11px 13px; font-size: 13px; color: var(--ink-200); background: color-mix(in oklch, var(--good) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 30%, transparent); animation: arrive .4s var(--ease) both }
  .done > svg { color: var(--good); animation: pop .45s var(--ease) both }
  .done .sp { flex: 1 }
  .textlink { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lav-400); background: none; border: 0; padding: 2px 0 }
  .sfoot { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; border-top: 1px solid rgba(181,171,252,.12); padding-top: 14px }
  .sfoot p { flex: 1; min-width: 180px; font-size: 12.5px; color: var(--ink-400); line-height: 1.5 }
  .sfoot p b { color: var(--warn); font-weight: 400 }
  .apply { display: inline-flex; gap: 8px; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #17152a; border: 0; border-radius: 999px; padding: 10px 20px; background: linear-gradient(135deg, var(--lav-300), var(--lav-400)); box-shadow: 0 0 26px -6px var(--lav-400); white-space: nowrap; transition: transform .1s, opacity .2s }
  .apply:active { transform: scale(.97) }
  .apply[disabled] { opacity: .4; box-shadow: none; cursor: default }
  .apply.busy { opacity: .85; cursor: default }
  .facts { display: flex; flex-direction: column; gap: 12px }
  .fact { display: flex; gap: 12px; align-items: center; font-size: 13.5px; color: var(--ink-200); line-height: 1.45 }
  .fact .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--lav-300); background: rgba(181,171,252,.1); box-shadow: inset 0 0 0 1px rgba(181,171,252,.25); flex: none }
  .fact .ic svg { width: 16px; height: 16px }
  .fact small { display: block; color: var(--ink-400); font-size: 12px }
  .head2 { display: flex; align-items: center; gap: 12px }
  .head2 b { font-weight: 400; font-size: 19px }
  .head2 small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); margin-top: 3px }
  .away { border-radius: 16px; border: 1px dashed rgba(var(--lift),.22); padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; color: var(--ink-300); font-size: 13px; line-height: 1.5 }
  .away .logo { width: 52px; height: 52px; border-radius: 16px; padding: 8px }
  .away small { color: var(--ink-500); font-size: 12px }
  .away .btns { margin: 0; flex-wrap: wrap; justify-content: center }
  .wait { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(181,171,252,.25); color: var(--lav-300); font-size: 13.5px; animation: glow 2.4s ease-in-out infinite }
  .wait span { color: var(--ink-200) }
  .ring { width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; align-self: center; color: var(--good); background: color-mix(in oklch, var(--good) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 45%, transparent), 0 0 36px -6px var(--good); animation: pop .45s var(--ease) both }
  .ring svg { width: 26px; height: 26px; stroke-width: 2.5 }
  .landed { text-align: center; font-size: 22px; font-weight: 300 }
  .pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; border: 0; background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(var(--lift),.1); transition: box-shadow .2s, background .2s, transform .1s }
  .pick:hover { background: rgba(181,171,252,.08); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 50%, transparent) }
  .pick:active { transform: scale(.99) }
  .pick .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--bank); background: color-mix(in oklch, var(--bank) 10%, transparent); flex: none }
  .pick .nm { flex: 1; min-width: 0; font-size: 14px }
  .pick .nm small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); margin-top: 2px }
  .pick .am { font-family: var(--mono); font-size: 13px }
  .pick.same { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 40%, transparent) }
  .until { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-400) }
  .until svg { width: 12px; height: 12px }
  .nope { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--warn) }
  .center { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr }
    .sheet { padding: 16px }
    .veil { padding: 10px; align-items: flex-end }
    .strip, .card .strip { grid-template-columns: 1fr 1fr }
    .cell:nth-child(3) { border-left: 0 }
    .cell:nth-child(n+3) { border-top: 1px solid rgba(var(--lift),.06) }
    .line, .opts { margin-left: 0; padding-left: 0 } .line { padding-left: 10px }
    .sfoot .apply { flex: 1 }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div class="sect">[ accounts ]</div>
  <div class="grid" id="grid"></div>
</div>
<div class="veil" id="veil"><div class="sheet"><div class="shead"><span class="title" id="stitle"></span><button class="close" data-do="close" aria-label="close">✕</button></div><div class="sbody" id="sbody"></div></div></div>
<script>
const P = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  pencil: '<path d="M17 3l4 4L8 20l-5 1 1-5z"/>',
  out: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  sigma: '<path d="M18 5H6l6 7-6 7h12"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cloud: '<path d="M3 3l18 18"/><path d="M7 18a4 4 0 0 1-.8-7.9"/><path d="M10 6.3A6 6 0 0 1 17.7 10 4 4 0 0 1 20 17"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M16 7l3 3"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  rows: '<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  bank: '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8M3 21h18"/>',
}
const svg = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`
const logo = (d, c = '') => `<img class="logo ${c}" src="https://www.google.com/s2/favicons?domain=${d}&sz=128" alt="">`
const BANKS = {
  activo: { name: 'ActivoBank', d: 'activobank.pt', kinds: ['bank'] },
  tr: { name: 'Trade Republic', d: 'traderepublic.com', kinds: ['broker'] },
  revolut: { name: 'Revolut', d: 'revolut.com', kinds: ['bank', 'broker'] },
  bpi: { name: 'BPI', d: 'bancobpi.pt', kinds: ['bank'] },
}
const spark = (pts, tone) => `<svg viewBox="0 0 120 32" preserveAspectRatio="none" class="${tone}"><path d="${pts}" fill="none" stroke="currentColor" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`
const DOWN = 'M0,6 L18,7 L30,12 L44,11 L58,19 L74,18 L90,25 L104,24 L120,28'
const UP = 'M0,26 L20,24 L36,25 L52,18 L70,19 L86,10 L104,11 L120,5'
const row = (k, v, c = '') => `<span><span class="k">${k}</span><span class="${c}">${v}</span></span>`
const cash = (cur, v, linked = true) => row(`free cash <i>${cur}</i>${linked ? `<span class="mark">${svg('link')}</span>` : ''}`, v)
const strip = ({ was, wasDay, out, inn = '€0', says, tone = 'good', under }) => `
  <div class="strip">
    <div class="cell"><span>was · ${wasDay}</span><b>${was}</b><em></em></div>
    <div class="cell out"><span>out</span><b>${out}</b><em></em></div>
    <div class="cell in ${inn === '€0' ? 'zero' : ''}"><span>in</span><b>${inn}</b><em></em></div>
    <div class="cell says ${tone}"><span>now</span><b>${says}</b><em>${tone === 'good' ? svg('check') : ''}${under}</em></div>
  </div>`
const chips = (list) => `<div class="chips">${list.map(([n, l, c]) => `<span class="chip ${c}"><i></i>${n} ${l}</span>`).join('')}</div>`
const pill = (label, doit, c = '', icon = '') => `<button class="pill ${c}" data-do="${doit}">${icon ? svg(icon) : ''}${label}</button>`

/* The footer says where the balance came from. One line when all is well,
   two when something needs a look: what, then the time the balance is of. */
const F = {
  file: (label, connect = true, stale = false) => `<div class="from"><span class="${stale ? 'amber' : ''}">${label}</span></div><div class="btns">${connect ? pill('connect', 'connect', '', 'link') : ''}${pill('update', 'none', stale ? 'warn' : '')}</div>`,
  bank: (when, what = 'from the bank') => `<div class="from"><span><span class="link">${svg('link')}</span>${what} · ${when}</span></div>`,
  fresh: (when) => `<div class="from"><span class="tick"><span class="green">${svg('check')}</span>from the bank · ${when}</span></div>`,
  busy: (last) => `<div class="from"><span class="lav"><i class="spin"></i>checking the bank… <span class="dim">· last ${last}</span></span></div>`,
  ask: () => `<div class="from"><span class="amber">${svg('sigma')}not saved — 1 question open</span><span class="l2">balance of Oct 3</span></div><div class="btns">${pill('check it', 'ask', 'warn')}</div>`,
  soon: () => `<div class="from"><span><span class="link">${svg('link')}</span>from the bank · today 14:05</span><span class="l2 amber">approval ends Oct 18</span></div><div class="btns">${pill('approve', 'approve', '', 'out')}</div>`,
  ended: () => `<div class="from"><span class="amber">${svg('key')}approval ended Oct 9</span><span class="l2">balance of Oct 9, 08:02</span></div><div class="btns">${pill('approve', 'approve', 'warn', 'out')}</div>`,
  down: () => `<div class="from"><span class="amber">${svg('cloud')}ActivoBank did not answer</span><span class="l2">balance of today, 08:02</span></div><div class="btns">${pill('try again', 'retry', 'warn')}</div>`,
}
function card(id, { total, line, bar = '', rows, extra = '', foot, cls = '' }) {
  const b = BANKS[id]
  return `<div class="card ${cls}" id="c-${id}">
    <div class="top">${logo(b.d)}<span class="who"><b>${b.name}</b><span class="kinds">${b.kinds.map((k) => `<span class="kind ${k}">${k}</span>`).join('')}</span></span>${pill('edit', 'none', '', 'pencil')}</div>
    <div class="total"><b>${total}</b>${line || ''}</div>
    ${bar}
    <div class="rows">${rows}</div>
    <div class="grow ${extra ? 'on' : ''}"><div><div class="in">${extra}</div></div></div>
    <div class="gap"></div>
    <div class="foot">${foot}</div>
  </div>`
}
const monthA = row('since 1 Oct', '−€630.72', 'red') + `<span class="sub"><span class="red">spent −€125.52</span><span class="lav">transfers −€505.20</span></span>`
const activo = (o = {}) => card('activo', { total: '€727.49', line: spark(DOWN, 'red'), rows: cash('EUR', o.total || '€727.49') + monthA, foot: F.bank('today 14:05'), ...o })
const trade = (o = {}) => card('tr', { total: '€9,417.60', rows: cash('EUR', '€1,005.20') + row('investments', '€8,412.40') + row('since 1 Oct', 'bought €500.00', 'lav'), foot: `${F.bank('today 14:05')}<div class="btns">${pill('update', 'none')}</div>`, ...o })
const revolut = (o = {}) => card('revolut', { total: '€21,244.75',
  bar: `<div class="bar"><span style="flex:1204;background:var(--bank)"></span><span style="flex:6040;background:color-mix(in oklch,var(--bank) 45%,transparent)"></span><span style="flex:14000;background:var(--lav-400)"></span></div>`,
  rows: cash('EUR', '€1,204.75') + row('broker cash', '€6,040.00') + row('investments', '€14,000.00'), foot: `${F.bank('today 14:05')}<div class="btns">${pill('update', 'none')}</div>`, ...o })
const bpi = (o = {}) => card('bpi', { total: '€2,410.00', line: spark(UP, 'green'), rows: cash('EUR', '€2,410.00', false) + row('since 1 Oct', '+€2,300.00', 'green'), foot: F.file('statement read 7d ago'), ...o })
const busyU = `${F.busy('08:02')}<div class="btns">${pill('update', 'none')}</div>`
const arrived = `<div class="got"><span class="chip new"><i></i>2 new</span><span class="okline">${svg('check')}as the bank shows</span><button class="shut" data-do="shut" aria-label="close">✕</button></div>` + strip({ was: '€769.89', wasDay: 'Oct 10', out: '€42.40', says: '€727.49', under: '' })

const S = {
  fresh: {
    l: 'connected',
    note: 'You open Finances and drop nothing. <b>ActivoBank</b>, <b>Trade Republic</b> and <b>Revolut</b> show what the bank reports, and when. The link marks what the bank reports: free cash. Investments still come from a screenshot, so those two keep UPDATE. BPI is as today, with one new button: connect.',
    r: () => activo() + trade() + revolut() + bpi(),
  },
  busy: {
    l: 'checking now',
    note: 'The last check was hours ago, so the app asks the bank when you open Finances. The balance on screen stays the stored one until the answer is in.',
    r: () => activo({ cls: 'busy', foot: F.busy('08:02') }) + trade({ cls: 'busy', foot: busyU }) + revolut({ cls: 'busy', foot: busyU }) + bpi(),
  },
  rows: {
    l: 'new rows arrived',
    note: 'Two payments were booked since yesterday. They add up to the bank’s balance, so they are saved with no press. The block stays on the card until you close it with ✕. <b>Play it again</b> by pressing the scenario.',
    r: () => activo({ cls: 'busy', total: '€769.89', foot: F.busy('08:02') }) + trade() + revolut() + bpi(),
    after: () => setTimeout(() => {
      swapCard('activo', activo({ extra: arrived, foot: F.fresh('now') }), true)
    }, 1500),
  },
  ask: {
    l: 'a question',
    note: 'The bank’s rows do not reach the bank’s balance, so nothing of ActivoBank is saved. Press <b>check it</b> and answer — every button works.',
    r: () => activo({ cls: 'ask', total: '€790.35', foot: F.ask() }) + trade() + revolut() + bpi(),
  },
  soon: {
    l: 'approval ends soon',
    note: 'A week before the bank’s approval runs out the card says the day. Nothing is wrong yet.',
    r: () => activo({ foot: F.soon() }) + trade() + revolut() + bpi(),
  },
  ended: {
    l: 'approval needed',
    note: 'Every few months the bank wants your approval again. The card keeps the last balance it got and shows one button. Press it.',
    r: () => activo({ total: '€769.89', foot: F.ended() }) + trade() + revolut() + bpi(),
  },
  down: {
    l: 'bank not reached',
    note: 'The bank did not answer. The card keeps the last balance and says of when. A file still works, through + ADD.',
    r: () => activo({ foot: F.down() }) + trade() + revolut() + bpi(),
  },
  file: {
    l: 'file only, beside it',
    note: 'BPI is not connected and its balance is nine days old: amber, as today. The three beside it needed nothing.',
    r: () => activo() + trade() + revolut() + bpi({ foot: F.file('statement read 9d ago', true, true) }),
  },
  first: {
    l: 'first connect',
    note: 'Press <b>connect</b> on BPI. The app takes only the rows after the balance it already has.',
    r: () => activo() + trade() + revolut() + bpi(),
  },
  two: {
    l: 'bank has two accounts',
    note: 'Press <b>connect</b> on BPI. BPI shows two accounts and neither number is known to the app, so it asks which one this card is.',
    r: () => activo() + trade() + revolut() + bpi(),
  },
}

let on = 'fresh', timer = null
const $ = (id) => document.getElementById(id)
function draw() {
  clearTimeout(timer)
  closeSheet()
  $('scen').innerHTML = Object.entries(S).map(([k, s]) => `<button class="${k === on ? 'on' : ''}" data-k="${k}">${s.l}</button>`).join('')
  $('note').innerHTML = S[on].note
  $('grid').innerHTML = S[on].r()
  if (S[on].after) timer = S[on].after()
}
/* A card changes in place: no re-arrival, and what is new grows in. */
function swapCard(id, html, growIn = false) {
  const old = $('c-' + id)
  if (!old) return
  const t = document.createElement('div')
  t.innerHTML = html
  const next = t.firstElementChild
  next.style.animation = 'none'
  const g = next.querySelector('.grow')
  if (growIn) g.classList.remove('on')
  old.replaceWith(next)
  if (growIn) { void g.offsetHeight; g.classList.add('on') }
}
/* The window glides between steps. */
function step(html, title) {
  const body = $('sbody')
  const from = body.getBoundingClientRect().height
  if (title) $('stitle').textContent = title
  body.style.height = 'auto'
  body.innerHTML = `<div class="step">${html}</div>`
  const to = body.getBoundingClientRect().height
  if (from && Math.abs(from - to) > 1) {
    body.style.height = from + 'px'
    void body.offsetHeight
    body.style.height = to + 'px'
    setTimeout(() => { body.style.height = 'auto' }, 380)
  }
}
function openSheet(html, title) { $('sbody').innerHTML = ''; $('sbody').style.height = 'auto'; $('veil').classList.add('on'); step(html, title) }
function closeSheet() { $('veil').classList.remove('on'); clearTimeout(timer) }

/* The question: check-sum.html's account block, the bank in the place of
   the screenshot. */
const accTop = (bal) => `<div class="atop">${logo('activobank.pt', 's')}<div class="name"><b>ActivoBank</b><span>bank · from the bank, today 14:05</span></div><div class="bal">${bal}</div></div>`
const sfoot = (text, ready) => `<div class="sfoot"><p>${text}</p><button class="pill" data-do="close">later</button><button class="apply" ${ready ? 'data-do="apply"' : 'disabled'}>${svg('check')}apply</button></div>`
const askStep = (a) => a === 'same'
  ? `<div class="acc">${accTop(`<small>now</small>€790.35<span class="dim">→</span><span class="to">€727.49</span>`)}
      ${chips([[2, 'new', 'new'], [1, 'already added', 'had']])}
      ${strip({ was: '€790.35', wasDay: 'Oct 3', out: '€62.86', says: '€727.49', under: 'as the bank shows' })}
      <div class="done">${svg('check')}<span>Same payment — added once.</span><span class="sp"></span><button class="textlink" data-do="ask">undo</button></div></div>
    ${sfoot('Ready to save.', true)}`
  : a === 'two'
    ? `<div class="acc">${accTop(`<small>now</small>€790.35<span class="dim">→</span><span class="to">€727.49</span>`)}
        ${chips([[3, 'new', 'new']])}
        ${strip({ was: '€790.35', wasDay: 'Oct 3', out: '€762.86', says: '€727.49', tone: 'warn', under: '€700.00 came in, no row' })}
        <div class="done">${svg('check')}<span>Two payments. €700.00 came in with no row.</span><span class="sp"></span><button class="textlink" data-do="ask">undo</button></div></div>
      ${sfoot('Ready to save.', true)}`
    : `<div class="acc held">${accTop(`<small>now</small><span class="to">€790.35</span><span class="tag warn">not saved</span>`)}
        ${chips([[3, 'new', 'new']])}
        ${strip({ was: '€790.35', wasDay: 'Oct 3', out: '€762.86', says: '€27.49', tone: 'warn', under: 'bank shows €727.49' })}
        <div class="off"><div class="q">${svg('sigma')}<div><b>Is this the same payment?</b><small>Same amount, three days apart. As two payments the balance would be €27.49.</small></div></div>
          <div class="line"><span class="d">Oct 6</span><span>COMPRA 2789 REVOLUT<small>new</small></span><span class="v">−€700.00</span></div>
          <div class="line mine"><span class="d">Oct 3</span><span>Top-up by *2789<small>already added</small></span><span class="v">−€700.00</span></div>
          <div class="opts"><button class="opt loud" data-do="same">same payment</button><button class="opt" data-do="two">two payments</button></div></div></div>
      ${sfoot('<b>ActivoBank not saved</b> — 1 question open.', false)}`
let answer = null

/* Connecting, and approving again: the same three steps. */
const intro = (again, nope = false) => `
  <div class="head2">${logo(again ? 'activobank.pt' : 'bancobpi.pt')}<div><b>${again ? 'ActivoBank' : 'BPI'}</b><small>${again ? 'approval ended Oct 9' : 'balance here: €2,410.00 · Oct 4'}</small></div></div>
  <div class="facts">
    <div class="fact"><span class="ic">${svg('eye')}</span><div>Read only: the balance and the movements.<small>Nothing can be paid or moved from here.</small></div></div>
    <div class="fact"><span class="ic">${svg('lock')}</span><div>The password is typed on ${again ? 'ActivoBank' : 'BPI'}’s own page.<small>It never reaches this app.</small></div></div>
    ${again ? '' : `<div class="fact"><span class="ic">${svg('rows')}</span><div>Movements from Oct 4 on.<small>Earlier ones are already inside the €2,410.00.</small></div></div>`}
    <div class="fact"><span class="ic">${svg('cal')}</span><div>${again ? 'ActivoBank' : 'BPI'} asks again every few months.<small>The card says so a week before.</small></div></div>
  </div>
  ${nope ? `<div class="nope">${svg('key')}Not approved. Nothing changed.</div>` : ''}
  <div class="sfoot"><p>Through Enable Banking.</p><button class="pill" data-do="close">later</button><button class="apply" data-do="go">continue at ${again ? 'ActivoBank' : 'BPI'}${svg('out')}</button></div>`
const away = (again) => `
  <div class="away">${logo(again ? 'activobank.pt' : 'bancobpi.pt')}
    <div>${again ? 'ActivoBank' : 'BPI'}’s own page<br><small>This part is the bank’s, not the app’s. In the mockup, pick how it ended.</small></div>
    <div class="btns"><button class="pill loud" data-do="back">approved there</button><button class="pill" data-do="refused">cancelled there</button></div>
  </div>`
const reading = (name) => `<div class="wait"><i class="spin"></i><span>Reading ${name}…</span></div>`
const which = () => `
  <div class="head2">${logo('bancobpi.pt')}<div><b>Which one is this card?</b><small>BPI shows 2 accounts</small></div></div>
  <button class="pick" data-do="picked"><span class="ic">${svg('bank')}</span><span class="nm">Conta à Ordem<small>PT50 ···· 4471</small></span><span class="am">€3,902.14</span></button>
  <button class="pick" data-do="picked"><span class="ic">${svg('bank')}</span><span class="nm">Conta Poupança<small>PT50 ···· 9920</small></span><span class="am">€12,000.00</span></button>
  <div class="fact"><span class="ic">${svg('rows')}</span><div>The other one can be added as its own account.<small>From the + button, any time.</small></div></div>`
const landedBpi = () => `
  <span class="ring">${svg('check')}</span>
  <div class="landed">BPI is connected</div>
  <div class="acc"><div class="atop">${logo('bancobpi.pt', 's')}<div class="name"><b>BPI</b><span>from the bank, now</span></div><div class="bal"><span class="to">€3,902.14</span><small>now</small></div></div>
    ${chips([[6, 'new', 'new'], [3, 'already added', 'had']])}
    ${strip({ was: '€2,410.00', wasDay: 'Oct 4', out: '€807.86', inn: '€2,300.00', says: '€3,902.14', under: 'as the bank shows' })}
    <div class="until">${svg('cal')}approved until Apr 9, 2027</div>
  </div>
  <div class="center"><button class="pill loud" data-do="done" style="padding-inline:30px">Done</button></div>`
const landedAgain = () => `
  <span class="ring">${svg('check')}</span>
  <div class="landed">ActivoBank is approved</div>
  <div class="acc"><div class="atop">${logo('activobank.pt', 's')}<div class="name"><b>ActivoBank</b><span>from the bank, now</span></div><div class="bal"><span class="to">€727.49</span><small>now</small></div></div>
    ${chips([[2, 'new', 'new']])}
    ${strip({ was: '€769.89', wasDay: 'Oct 9', out: '€42.40', says: '€727.49', under: 'as the bank shows' })}
    <div class="until">${svg('cal')}approved until Apr 9, 2027</div>
  </div>
  <div class="center"><button class="pill loud" data-do="done" style="padding-inline:30px">Done</button></div>`
let flow = null

const DO = {
  close: () => closeSheet(),
  none: () => {},
  ask: () => { answer = null; openOrStep(askStep(null), '[ check it ]') },
  same: () => { answer = 'same'; step(askStep('same')) },
  two: () => { answer = 'two'; step(askStep('two')) },
  apply: (b) => {
    b.classList.add('busy'); b.removeAttribute('data-do'); b.innerHTML = '<i class="spin"></i>saving…'
    timer = setTimeout(() => {
      step(`<span class="ring">${svg('check')}</span><div class="landed">ActivoBank is up to date</div>
        <div class="acc"><div class="atop">${logo('activobank.pt', 's')}<div class="name"><b>ActivoBank</b><span>from the bank, today 14:05</span></div><div class="bal"><span class="to">€727.49</span></div></div>
        ${answer === 'two' ? chips([[3, 'new', 'new']]) + strip({ was: '€790.35', wasDay: 'Oct 3', out: '€762.86', says: '€727.49', tone: 'warn', under: '€700.00 came in, no row' }) : chips([[2, 'new', 'new'], [1, 'already added', 'had']]) + strip({ was: '€790.35', wasDay: 'Oct 3', out: '€62.86', says: '€727.49', under: 'as the bank shows' })}</div>`)
      swapCard('activo', activo({ foot: F.fresh('today 14:05') }))
      timer = setTimeout(closeSheet, 1800)
    }, 1100)
  },
  connect: () => { flow = 'bpi'; openSheet(intro(false), '[ connect BPI ]') },
  approve: () => { flow = 'again'; openSheet(intro(true), '[ approve again ]') },
  go: (b) => {
    b.classList.add('busy'); b.removeAttribute('data-do'); b.innerHTML = `<i class="spin"></i>opening ${flow === 'again' ? 'ActivoBank' : 'BPI'}…`
    timer = setTimeout(() => step(away(flow === 'again')), 900)
  },
  refused: () => step(intro(flow === 'again', true)),
  back: () => {
    if (flow === 'bpi' && on === 'two') return step(which())
    DO.picked()
  },
  picked: (b) => {
    if (b) b.classList.add('same')
    const again = flow === 'again'
    timer = setTimeout(() => {
      step(reading(again ? 'ActivoBank' : 'BPI'))
      timer = setTimeout(() => {
        step(again ? landedAgain() : landedBpi())
        if (again) swapCard('activo', activo({ foot: F.fresh('now') }))
        else swapCard('bpi', bpi({ total: '€3,902.14', rows: cash('EUR', '€3,902.14') + row('since 1 Oct', '+€1,492.14', 'green'), foot: F.fresh('now') }))
      }, 1500)
    }, b ? 350 : 0)
  },
  done: () => closeSheet(),
  shut: (b) => b.closest('.grow').classList.remove('on'),
  retry: (b) => {
    swapCard('activo', activo({ cls: 'busy', foot: F.busy('08:02') }))
    timer = setTimeout(() => swapCard('activo', activo({ foot: F.fresh('now') })), 1500)
  },
}
function openOrStep(html, title) { $('veil').classList.contains('on') ? step(html, title) : openSheet(html, title) }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) { if (e.target === $('veil')) closeSheet(); return }
  if (b.dataset.k) { on = b.dataset.k; draw() }
  else if (b.dataset.do && DO[b.dataset.do]) DO[b.dataset.do](b)
})
const want = new URLSearchParams(location.search).get('s')
if (want && S[want]) on = want
draw()
</script>
