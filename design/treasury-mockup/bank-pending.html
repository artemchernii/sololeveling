<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · Revolut from the bank, pending rows</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* An opened account after a bank fetch (17 Oct). Artem, on the Revolut
     window: "why it doesnt say what is pending if get that info already,
     why no icons and why I see from the bank and pdf?". His numbers:
     €1,052.10 from the bank 13:39; 16 Oct booked Guacamole −10.95,
     Petiscaria Do −3.00, −2.50; pending McDonald's −8.65, Petiscaria Do −6. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .sheet { border-radius: 26px; border: 1px solid var(--sys-edge); background: #1f2030; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -18px var(--shine); overflow: hidden }
  .shead { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid rgba(var(--lift),.07) }
  .title { flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .4em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .close { width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-300); display: grid; place-items: center }
  .body { padding: 20px; display: flex; flex-direction: column; gap: 16px }
  .acct { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap }
  .alogo { width: 46px; height: 46px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none; color: #000; font-weight: 600; font-size: 26px }
  .aname { flex: 1; display: flex; flex-direction: column; gap: 6px }
  .aname b { font-size: 18px; font-weight: 400 }
  .tags { display: flex; gap: 5px }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 3px 8px; border-radius: 7px; white-space: nowrap }
  .tag.bank { color: #e7c58a; box-shadow: inset 0 0 0 1px rgba(231,197,138,.45) }
  .tag.broker { color: var(--lav-300); box-shadow: inset 0 0 0 1px rgba(181,171,252,.45) }
  .aname small { font-family: var(--mono); font-size: 11px; color: var(--ink-400) }
  .amount { text-align: right; display: flex; flex-direction: column; gap: 4px; margin-left: auto }
  .amount b { font-size: 28px; font-weight: 300 }
  .ok { font-family: var(--mono); font-size: 11px; color: var(--good); display: inline-flex; gap: 4px; align-items: center; justify-content: flex-end }
  .ok svg { width: 12px; height: 12px; stroke-width: 3 }
  .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-500) }
  @keyframes land { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
  @keyframes pulse { 50% { opacity: .35 } }
  .bal { border-radius: 16px; padding: 12px; background: rgba(181,171,252,.05); box-shadow: inset 0 0 0 1px rgba(181,171,252,.2); display: flex; flex-direction: column; gap: 10px; animation: land .4s both }
  .bal .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 4px }
  .bal .h span { white-space: nowrap }
  .bal .h span { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--lav-300) }
  .bal .h b { font-family: var(--mono); font-size: 16px; font-weight: 500 }
  .src { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.22) }
  .src .slogo { width: 32px; height: 32px; border-radius: 9px; background: #fff; color: #000; display: grid; place-items: center; font-weight: 600; font-size: 17px; flex: none }
  .src .pdf { width: 32px; height: 36px; border-radius: 6px; background: rgba(var(--lift),.07); font-family: var(--mono); font-size: 9.5px; color: var(--ink-400); display: grid; place-items: center; flex: none }
  .src .what { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }
  .src .what b { font-weight: 400; font-size: 14px; white-space: nowrap }
  .src .what b.sync { display: inline-flex; align-items: center; gap: 7px }
  .src .what b.sync svg { width: 15px; height: 15px; color: var(--good) }
  .src .what small { font-family: var(--mono); font-size: 11px; color: var(--ink-400) }
  .src .badges { display: flex; gap: 6px; flex-wrap: wrap }
  .b { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: var(--ink-400); background: rgba(var(--lift),.05); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px }
  .b.new { color: var(--good); background: color-mix(in oklch, var(--good) 12%, transparent) }
  .b.new i { width: 6px; height: 6px; border-radius: 999px; background: currentColor }
  .b.pend { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, transparent) }
  .b.pend i { width: 6px; height: 6px; border-radius: 999px; background: currentColor; animation: pulse 1.6s ease-in-out infinite }
  .b.booked { color: var(--good); background: color-mix(in oklch, var(--good) 12%, transparent); animation: gone .5s ease 3s forwards }
  @keyframes gone { to { opacity: 0; max-width: 0; padding: 0; margin: 0 } }
  .row.now { animation: land .4s both, flash 1.4s ease .3s }
  @keyframes flash { 30% { background: color-mix(in oklch, var(--good) 14%, transparent); border-radius: 12px } }
  .open { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-300); white-space: nowrap }
  .day { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--ink-500); padding: 6px 4px 0 }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 4px; animation: land .4s both }
  .mark { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; flex: none; background: rgba(var(--lift),.07); color: var(--ink-300); overflow: hidden }
  .mark img { width: 100%; height: 100%; object-fit: cover; background: #fff }
  .mark.arrow { border-radius: 9px }
  .row .n { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 15px }
  .row .n .sub { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-500) }
  .row .n > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .row .t { font-family: var(--mono); font-size: 11px; color: var(--ink-500) }
  .row .v { font-family: var(--mono); font-size: 15px; color: var(--ink-200); white-space: nowrap }
  .row.p .v { color: var(--ink-400) }
  .row.p .mark { opacity: .7 }
  .gap { border-radius: 12px; padding: 12px 14px; border: 1px dashed color-mix(in oklch, var(--warn) 55%, transparent); background: color-mix(in oklch, var(--warn) 6%, transparent); display: flex; justify-content: space-between; font-size: 14px }
  .gap b { font-family: var(--mono); color: var(--warn); font-weight: 500 }
  .warnbox { border-radius: 14px; padding: 14px; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 45%, transparent); background: rgba(231,197,138,.04); display: flex; flex-direction: column; gap: 10px }
  .warnbox b { font-weight: 400; font-size: 15px }
  .warnbox small { color: var(--ink-400) }
  .x { color: var(--warn); font-family: var(--mono); font-size: 11px; text-align: right }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen">
    <button data-s="today" class="on">17 Oct · 2 pending</button>
    <button data-s="booked">18 Oct · booked</button>
    <button data-s="before">in the app now</button>
  </div>
  <div class="sheet">
    <div class="shead"><span class="title">[ Revolut ]</span><button class="close">✕</button></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
  const ICON = {
    fork: '<svg class="i" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
    up: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>',
    sync: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  }
  const logo = (d) => `<img src="https://www.google.com/s2/favicons?domain=${d}&sz=128" alt="">`
  const mark = (r, plain) =>
    plain ? `<span class="mark arrow">${ICON.up}</span>`
    : r.site ? `<span class="mark">${logo(r.site)}</span>`
    : `<span class="mark">${ICON.fork}</span>`
  const eur = (n) => (n < 0 ? '−' : '') + '€' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')

  const MC = { name: "McDonald's", site: 'mcdonalds.com', v: -8.65, time: '22:49' }
  const PD6 = { name: 'Petiscaria Do', v: -6, time: '20:04' }
  const BOOKED16 = [
    { name: 'Petiscaria Do', v: -2.5, time: '19:54' },
    { name: 'Petiscaria Do', v: -3, time: '18:28' },
    { name: 'Guacamole-gourmet', v: -10.95, time: '13:35' },
  ]
  const row = (r, opts = {}) => `
    <div class="row ${opts.p ? 'p' : ''} ${opts.now ? 'now' : ''}">
      ${mark(r, opts.plain)}
      <span class="n"><span>${r.name}</span>${opts.p || opts.now ? `<span class="sub">${opts.p ? '<span class="b pend"><i></i>pending</span>' : '<span class="b booked">booked</span>'}</span>` : ''}</span>
      <span class="v">${eur(r.v)}</span>
    </div>`
  const head = (tick) => `
    <div class="acct">
      <span class="alogo">R</span>
      <div class="aname"><b>Revolut</b>
        <div class="tags"><span class="tag bank">bank</span><span class="tag broker">broker</span></div>
        <small>EUR · ••4055</small></div>
      <div class="amount"><b>€14,001.53</b>${tick}</div>
    </div>`
  const bankBox = (when, badges) => `
    <div class="bal">
      <div class="h"><span>BALANCE · ${when}</span><b>€1,052.10</b></div>
      <div class="src"><span class="slogo">R</span>
        <div class="what"><b class="sync">${ICON.sync}Synced with bank</b><div class="badges">${badges}</div></div>
        <span class="open">OPEN ›</span></div>
    </div>`
  const OK = `<span class="ok">${ICON.check}rows match</span>`

  const S = {
    today: () => `
      ${head(OK)}
      <span class="meta">3769 rows · 14 files · newest first</span>
      ${bankBox('17 OCT', '<span class="b">13:39</span><span class="b new"><i></i>3 new</span><span class="b pend"><i></i>2 pending</span>')}
      <div class="day">FRI 16 OCT</div>
      ${row(MC, { p: true })}
      ${row(PD6, { p: true })}
      ${BOOKED16.map((r) => row(r)).join('')}`,
    booked: () => `
      ${head(OK)}
      <span class="meta">3771 rows · 14 files · newest first</span>
      ${bankBox('18 OCT', '<span class="b">09:12</span><span class="b new"><i></i>2 new</span><span class="b">0 pending</span>')}
      <div class="day">FRI 16 OCT</div>
      ${row(MC, { now: true })}
      ${row(PD6, { now: true })}
      ${BOOKED16.map((r) => row(r)).join('')}`,
    before: () => `
      ${head('<span class="x">€14.65 has no row</span>')}
      <div class="warnbox"><b>€14.65 left with no row</b><small>15 Oct – 17 Oct</small></div>
      <span class="meta">3769 rows · 14 files · newest first</span>
      <div class="bal">
        <div class="h"><span>BALANCE · 17 OCT</span><b>€1,052.10</b></div>
        <div class="src"><span class="pdf">PDF</span>
          <div class="what"><b>from the bank</b><small>statement · 16 Oct → 16 Oct · added 3 rows · read 17 Oct</small></div>
          <span class="open">OPEN ›</span></div>
      </div>
      <div class="gap"><span>no row</span><b>−€14.65</b></div>
      <div class="day">FRI 16 OCT</div>
      ${BOOKED16.map((r) => row(r, { plain: true })).join('')}`,
  }
  const body = document.getElementById('body')
  const show = (s) => {
    body.innerHTML = S[s]()
    document.querySelectorAll('.scen button').forEach((b) => b.classList.toggle('on', b.dataset.s === s))
  }
  document.querySelectorAll('.scen button').forEach((b) => (b.onclick = () => show(b.dataset.s)))
  show('today')
</script>
</body>
</html>
