<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · where the buys went</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ADD BUYS' saved screen, said from what was written (14 Oct). His
     iShares Physical Gold screenshots were read right and saved under
     iShares Digital Security, and the screen still said "9 buys saved ·
     iShares Physical Gold" with €0 and 0 buys. Now it counts where this
     save's buys sit: on the thing → the green screen of today; anywhere
     else → that thing's icon and name, in warn, and REMOVE. Sample
     numbers, not his. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer }
  svg.i { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; text-align: center }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500) }
  .sheet { border-radius: 18px; padding: 16px; background: #20203a; box-shadow: inset 0 0 0 1px var(--sys-edge), 0 24px 60px -24px #000; display: flex; flex-direction: column; gap: 14px }
  .shead { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid rgba(181,171,252,.16) }
  .shead .title { flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--lav-400) }
  .landed { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0 }
  .badge { width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; animation: pop .5s both }
  .badge svg { width: 28px; height: 28px; stroke-width: 2.5 }
  .badge.good { background: color-mix(in oklch, var(--good) 16%, transparent); color: var(--good); box-shadow: 0 0 36px -6px var(--good), inset 0 0 0 1px color-mix(in oklch, var(--good) 45%, transparent) }
  .badge.warn { background: color-mix(in oklch, var(--warn) 16%, transparent); color: var(--warn); box-shadow: 0 0 36px -6px var(--warn), inset 0 0 0 1px color-mix(in oklch, var(--warn) 45%, transparent) }
  .badge.warn svg { animation: pulse 1.8s ease-in-out infinite }
  .h { font-size: 24px; font-weight: 300; text-align: center; animation: land .4s both }
  .col { width: 100%; max-width: 576px; display: flex; flex-direction: column; gap: 12px }
  .card { display: flex; align-items: center; gap: 14px; border-radius: 16px; padding: 14px 16px; animation: land .45s both }
  .card.good { background: color-mix(in oklch, var(--good) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 30%, transparent) }
  .card.warn { background: color-mix(in oklch, var(--warn) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 35%, transparent) }
  .card.still { background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(var(--lift),.08) }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #0b0b0d; color: #fff; display: grid; place-items: center; font-weight: 500; font-size: 14px; flex: none; box-shadow: inset 0 0 0 1px rgba(var(--lift),.12) }
  .who { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 }
  .who b { font-weight: 400; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .who .s { font-family: var(--mono); font-size: 11px }
  .tot { display: flex; flex-direction: column; align-items: flex-end; gap: 2px }
  .tot b { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums }
  .tags { display: flex; gap: 6px; flex-wrap: wrap }
  .tag { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap }
  .tag.buy { color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent) }
  .tag.sell { color: var(--danger); background: color-mix(in oklch, var(--danger) 14%, transparent) }
  .tag.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent) }
  .tag.dim { color: var(--ink-400); background: rgba(var(--lift),.05) }
  .rm { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: none; color: var(--warn); border: 0; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 40%, transparent) }
  .rm:disabled { opacity: .6 }
  .sums { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px }
  .sums div { border-radius: 12px; padding: 10px 12px; background: rgba(var(--lift),.04); display: flex; flex-direction: column; gap: 3px }
  .sums b { font-weight: 300; font-size: 19px; font-variant-numeric: tabular-nums }
  .line { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; animation: land .4s both }
  .line.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 35%, transparent) }
  .line.warn svg { animation: pulse 1.8s ease-in-out infinite }
  .line span { color: var(--ink-100) }
  .row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-top: 1px solid rgba(var(--lift),.06); animation: land .4s both }
  .row:first-child { border-top: 0 }
  .row .amt { font-family: var(--mono); font-size: 13.5px }
  .row .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); margin-top: 2px }
  .row .day { font-family: var(--mono); font-size: 11px; color: var(--ink-400) }
  .mono { font-family: var(--mono); font-size: 11px; color: var(--ink-400); text-align: center }
  .foot { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding-top: 4px }
  .go, .quiet { height: 36px; padding: 0 26px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase }
  .go { border: 1px solid transparent; background: var(--lav-400); color: #17152b; font-weight: 500 }
  .quiet { border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-300); padding: 0 16px }
  .spin { width: 13px; height: 13px; border-radius: 999px; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite }
  @keyframes land { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.15) } }
  @keyframes pulse { 50% { opacity: .45 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (max-width: 560px) { .h { font-size: 20px } .card { flex-wrap: wrap } .tot { align-items: flex-start } }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div class="sheet">
    <div class="shead"><span class="title">add buys · iShares Physical Gold</span><span class="caps">✕</span></div>
    <div id="body"></div>
  </div>
</div>
<script>
const I = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  undo: '<svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
}
const SCENES = {
  here: ['all on it', 'Today\'s screen, kept: every buy of this save sits on iShares Physical Gold. The count is now read from the saved buys, not from the file.'],
  away: ['all elsewhere', 'His 14 Oct case: all 9 sit on iShares Digital Security. No green tick, no "saved": that thing, its badges, REMOVE.'],
  part: ['some elsewhere', 'Two files: 6 buys on the right thing, 3 on another. Still warn — the tick is never green while any buy sits on the wrong thing.'],
  removing: ['removing', 'REMOVE pressed: removing… at once on the button.'],
  removed: ['removed', 'The built Removed screen, as it is today: the whole save is taken back, from both things.'],
}
const BUYS = [['Sep 30, 2026', 120, 1.9], ['Aug 29, 2026', 120, 1.95], ['Jul 31, 2026', 120, 2.02], ['Jun 30, 2026', 100, 1.7], ['May 30, 2026', 100, 1.71], ['Apr 30, 2026', 100, 1.69]]
const eur = (n) => '€' + n.toLocaleString('en-US', { maximumFractionDigits: 2 })
const sh = (n) => Number(n.toFixed(4)) + ' shares'
const logo = '<span class="logo">iS</span>'
const rows = (list) => `<div>${list.map(([d, e, s], i) => `<div class="row" style="animation-delay:${i * 40}ms"><span class="tag buy">buy</span><span><div class="amt">${eur(e)}</div><div class="sub">${sh(s)}</div></span><span class="day">${d}</span></div>`).join('')}</div>`
const thing = (n, list, tone) => `<div class="card ${tone}">${logo}<div class="who"><b>iShares Physical Gold</b><span class="s" style="color:var(--${tone === 'good' ? 'good' : 'ink-400'})">${n ? `${n} buys added` : 'nothing added'}</span></div><div class="tot"><b>${eur(list.reduce((t, x) => t + x[1], 0))}</b><span class="caps">buy total</span></div></div>`
const away = (n, busy) => `<div class="card warn" data-away>${logo}<div class="who"><b>iShares Digital Security</b><span class="tags"><span class="tag warn">${n} buy</span><span class="tag dim">saved here instead</span></span><span class="s" style="color:var(--ink-400)">read as iShares Physical Gold</span></div><button class="rm" ${busy ? 'disabled' : ''} data-go="removing">${busy ? '<span class="spin"></span>removing…' : I.x + 'remove'}</button></div>`
const sums = (held, inBuys, n) => `<div class="sums"><div><span class="caps">held</span><b>${sh(held)}</b><span class="caps">at the broker</span></div><div><span class="caps">in the buys</span><b>${sh(inBuys)}</b><span class="caps">${n} buys</span></div></div>`
const missing = (m) => `<div class="line warn">${I.alert}<span><b style="font-weight:500;color:var(--warn)">${sh(m)} missing</b> — add older buys.</span></div>`
const foot = (undo) => `<div class="foot">${undo ? `<button class="quiet">${I.undo}undo</button>` : ''}<button class="go">done</button></div>`

function render(scene) {
  document.querySelectorAll('.scen button').forEach((b) => b.classList.toggle('on', b.dataset.s === scene))
  document.getElementById('note').textContent = SCENES[scene][1]
  const body = document.getElementById('body')
  const held = 14.2
  if (scene === 'here') body.innerHTML = `<div class="landed"><span class="badge good">${I.check}</span><span class="h">6 buys saved · iShares Physical Gold</span><div class="col">${thing(6, BUYS, 'good')}${sums(held, 10.97, 6)}${missing(held - 10.97)}${rows(BUYS)}</div>${foot(true)}</div>`
  if (scene === 'away' || scene === 'removing') body.innerHTML = `<div class="landed"><span class="badge warn">${I.alert}</span><span class="h">Not saved on iShares Physical Gold</span><div class="col">${away(9, scene === 'removing')}<span class="mono">Remove takes back all 9 buys of this save.</span>${thing(0, [], 'still')}${sums(held, 0, 0)}${missing(held)}</div>${foot(false)}</div>`
  if (scene === 'part') body.innerHTML = `<div class="landed"><span class="badge warn">${I.alert}</span><span class="h">6 of 9 buys on iShares Physical Gold</span><div class="col">${away(3, false)}<span class="mono">Remove takes back all 9 buys of this save.</span>${thing(6, BUYS, 'still')}${sums(held, 10.97, 6)}${missing(held - 10.97)}${rows(BUYS)}</div>${foot(false)}</div>`
  if (scene === 'removed') body.innerHTML = `<div class="landed"><span class="badge good">${I.check}</span><span class="h">Removed</span><span class="note" style="max-width:24rem">Your accounts are as they were before this save. Drop the files again any time to add them back.</span>${foot(false)}</div>`
  body.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { render('removing'); setTimeout(() => render('removed'), 900) })
}
document.getElementById('scen').innerHTML = Object.entries(SCENES).map(([k, [l]]) => `<button data-s="${k}">${l}</button>`).join('')
document.querySelectorAll('.scen button').forEach((b) => b.onclick = () => render(b.dataset.s))
render('away')
</script>
</body>
</html>
