<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury crypto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Crypto in Portfolio (4 Oct; journey docs/specs/2026-10-04-portfolio-
     insights-journey.md, his "yes 1-3"). His numbers, from his Revolut
     crypto statement of 3 Oct. "you paid" is approximate here: $ trades
     at a rough rate; the build converts each at the ECB rate of its day. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-200: #e4e1fe; --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .ctl { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--warn); text-transform: uppercase; letter-spacing: .08em }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400); cursor: pointer; white-space: nowrap }
  .pill.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 780px; margin: 0 auto; text-align: center }
  .note b { color: var(--ink-200); font-weight: 400 }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-500) }
  .up { color: var(--good) } .down { color: var(--danger) } .warn { color: var(--warn) } .dim { color: var(--ink-500) }
  .title { font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .panel { border-radius: 22px; padding: 20px; border: 1px solid var(--sys-edge); background: linear-gradient(160deg, rgba(181,171,252,.07), rgba(181,171,252,.01) 40%), #1b1a2a; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), 0 0 40px -22px var(--shine); animation: rise .4s cubic-bezier(.2,.8,.2,1) both }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } }
  .glass { border-radius: 20px; padding: 16px; background: rgba(var(--lift),.035); border: 1px solid rgba(var(--lift),.07) }
  .big { font-weight: 300; font-size: 40px; font-variant-numeric: tabular-nums; line-height: 1 }
  .pp { display: inline-flex; gap: 8px; align-items: center; border-radius: 8px; padding: 4px 9px; background: rgba(var(--lift),.06); font-family: var(--mono); font-size: 13px }
  .pp.s { font-size: 11px; padding: 2px 6px }
  .brokers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
  @media (max-width: 900px) { .brokers { grid-template-columns: 1fr } }
  .bk { display: flex; flex-direction: column; gap: 10px }
  .bk.new { border-color: color-mix(in oklch, var(--lav-400) 40%, transparent); box-shadow: 0 0 30px -16px var(--shine) }
  .hd { display: flex; align-items: center; gap: 10px } .hd b { flex: 1; font-weight: 400; font-size: 16px }
  .lg { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; color: #15151f; background: var(--c) }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-200); padding: 2px 0 } .kv span:first-child { color: var(--ink-500) }
  .tag { display: inline-flex; gap: 5px; align-items: center; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: var(--ink-400); background: rgba(var(--lift),.05) }
  .tag.l { color: var(--lav-300); background: rgba(181,171,252,.12) } .tag.g { color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent) }
  .filters { display: flex; gap: 6px; flex-wrap: wrap }
  .row { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid rgba(var(--lift),.05); cursor: pointer; border-radius: 10px }
  .row:hover { background: rgba(var(--lift),.03) }
  .coin { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 500; font-size: 17px; color: #15151f; background: var(--c); box-shadow: 0 0 20px -8px var(--c) }
  .nm b { font-weight: 400; font-size: 15px } .nm p { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); margin-top: 3px }
  .rt { text-align: right; font-family: var(--mono); font-size: 14px } .rt small { display: block; font-size: 11px; margin-top: 3px }
  .split { height: 10px; border-radius: 99px; display: flex; gap: 3px; overflow: hidden; margin-top: 10px }
  .split i { display: block; height: 100%; border-radius: 99px }
  .grid2 { display: grid; grid-template-columns: 1fr 300px; gap: 20px }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr } }
  .box { border-radius: 16px; padding: 14px; border: 1px solid rgba(var(--lift),.07); background: rgba(var(--lift),.02); display: flex; flex-direction: column; gap: 6px }
  .tr { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(var(--lift),.05); font-family: var(--mono); font-size: 12px }
  .check { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(var(--lift),.05) }
  .ok { color: var(--good); font-family: var(--mono) }
  .btn { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--lav-400) 50%, transparent); background: rgba(181,171,252,.18); cursor: pointer }
  svg { display: block; width: 100%; height: auto; overflow: visible }
  .ind { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px }
  .ind .pill.on.ma20 { border-color: oklch(0.8 0.13 85 / .6); color: oklch(0.85 0.13 85) }
  .ind .pill.on.ma40 { border-color: oklch(0.72 0.14 230 / .6); color: oklch(0.8 0.12 230) }
  .ind .pill.on.rsi { border-color: color-mix(in oklch, var(--lav-400) 60%, transparent) }
  .explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px }
  .explain .box b { font-weight: 400; color: var(--ink-100) } .explain p { font-size: 12.5px; color: var(--ink-400); line-height: 1.55 }
  .now { font-family: var(--mono); font-size: 12px; color: var(--ink-200) }
  /* The drop: each check lands in turn. */
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.96) } }
  @keyframes tick { 0% { transform: scale(0) } 70% { transform: scale(1.25) } 100% { transform: scale(1) } }
  @keyframes scan { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
  .drop .check { animation: pop .45s cubic-bezier(.2,.8,.2,1) both }
  .drop .ok { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in oklch, var(--good) 18%, transparent); animation: tick .4s both }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(181,171,252,.12); color: var(--lav-200); border: 1px solid color-mix(in oklch, var(--lav-400) 30%, transparent); animation: pop .4s both }
  .badge.g { background: color-mix(in oklch, var(--good) 14%, transparent); color: var(--good); border-color: color-mix(in oklch, var(--good) 35%, transparent) }
  .reading { position: relative; height: 3px; border-radius: 99px; background: rgba(var(--lift),.06); overflow: hidden; margin: 14px 0 6px }
  .reading i { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--lav-400), transparent); animation: scan 1.1s ease-in-out 2 }
  .file { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: rgba(var(--lift),.03); border: 1px dashed color-mix(in oklch, var(--lav-400) 40%, transparent) }
  .coins { display: flex; margin-top: 4px } .coins img { margin-left: -8px; box-shadow: 0 0 0 3px #1b1a2a; animation: pop .4s both } .coins img:first-child { margin-left: 0 }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctl">Mockup · your real positions and coins (4 Oct) · real logos · coins' "you paid" approximate</div>
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<script>
const eur = (v, c = 2) => '€' + Math.abs(v).toLocaleString('en-GB', { minimumFractionDigits: c, maximumFractionDigits: c })
const sgn = (v) => (v >= 0 ? '+' : '−')
const pp = (pl, base, s) => `<span class="pp ${s ? 's' : ''} ${pl >= 0 ? 'up' : 'down'}">${sgn(pl)}${eur(pl)} <span>${sgn(pl)}${Math.abs(pl / base * 100).toFixed(1)}%</span></span>`

/* His five coins (closing balances and values from the statement). */
/* Logos by what a thing is (4 Oct: "those logos are annoy me … real
   logo"): a coin's own icon, a company's own site, an ETF's issuer, a
   broker's site. Letters only when none is known. */
const COIN_ICON = (s) => `https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/${s.toLowerCase()}.svg`
const SITE = (d) => `https://www.google.com/s2/favicons?domain=${d}&sz=64`
const img = (src, size = 40, r = 12) => `<img src="${src}" alt="" style="width:${size}px;height:${size}px;border-radius:${r}px;background:#fff;object-fit:contain;padding:${Math.round(size / 8)}px">`
const coinImg = (s, size = 40) => `<img src="${COIN_ICON(s)}" alt="" style="width:${size}px;height:${size}px;border-radius:50%">`
/* His 23 shares and ETFs (Portfolio, 4 Oct). */
const HELD = [
  ['IGLN', 'iShares Physical Gold ETC', 527.71, -3.74, 'ETF', 'T212', 'ishares.com'],
  ['VHYL', 'Vanguard FTSE All-World High Dividend', 502.28, 2.51, 'ETF', 'T212', 'vanguard.com'],
  ['GOOG', 'Alphabet', 377.33, 10.33, 'stock', 'TR', 'google.com'],
  ['AMZN', 'Amazon', 365.93, 19.20, 'stock', 'TR', 'amazon.com'],
  ['MSFT', 'Microsoft', 341.98, 36.14, 'stock', 'TR', 'microsoft.com'],
  ['META', 'Meta Platforms', 319.37, 28.06, 'stock', 'TR', 'meta.com'],
  ['AVGO', 'Broadcom', 309.20, -6.32, 'stock', 'TR', 'broadcom.com'],
  ['NVDA', 'NVIDIA', 295.85, 26.32, 'stock', 'TR', 'nvidia.com'],
  ['SHLD', 'iShares Digital Security', 284.82, 18.86, 'ETF', 'T212', 'ishares.com'],
  ['PLTR', 'Palantir', 280.96, 12.01, 'stock', 'TR', 'palantir.com'],
  ['SHOP', 'Shopify', 274.53, 9.43, 'stock', 'TR', 'shopify.com'],
  ['GEV', 'GE Vernova', 269.26, 7.26, 'stock', 'TR', 'gevernova.com'],
  ['VUAA', 'Vanguard S&P 500 (Acc)', 262.45, 16.65, 'ETF', 'T212', 'vanguard.com'],
  ['MA', 'Mastercard', 259.62, 0.49, 'stock', 'TR', 'mastercard.com'],
  ['V', 'Visa', 258.09, 1.26, 'stock', 'TR', 'visa.com'],
  ['VFEG', 'Vanguard FTSE Emerging Markets (Acc)', 256.68, 2.82, 'ETF', 'T212', 'vanguard.com'],
  ['UBER', 'Uber', 248.14, -1.56, 'stock', 'TR', 'uber.com'],
  ['NFLX', 'Netflix', 231.92, -7.87, 'stock', 'TR', 'netflix.com'],
  ['DASH', 'DoorDash', 168.51, 4.16, 'stock', 'TR', 'doordash.com'],
  ['VDPG', 'Vanguard FTSE Dev. Asia Pacific ex Japan', 162.50, 8.50, 'ETF', 'T212', 'vanguard.com'],
  ['MELI', 'MercadoLibre', 140.66, -6.85, 'stock', 'TR', 'mercadolibre.com'],
  ['LUKOY', 'LUKOIL · no market price', 11.14, -55.37, 'stock', 'T212', 'lukoil.com'],
  ['NILSY', 'Norilsk Nickel · no market price', 9.78, -60.82, 'stock', 'T212', 'nornickel.com'],
]
const ETFS = HELD.filter((h) => h[4] === 'ETF').reduce((t, h) => t + h[2], 0)
const STOCKS = HELD.filter((h) => h[4] === 'stock').reduce((t, h) => t + h[2], 0)
const COINS = [
  { s: 'SOL', n: 'Solana', q: 1.239235, px: 106.70, v: 132.23, paid: 88.6, c: 'oklch(0.72 0.17 300)', m: '◎' },
  { s: 'ETH', n: 'Ether', q: 0.05275025, px: 2387.67, v: 125.96, paid: 87.9, c: 'oklch(0.72 0.08 270)', m: 'Ξ' },
  { s: 'BTC', n: 'Bitcoin', q: 0.00152749, px: 75540.37, v: 115.39, paid: 91.0, c: 'oklch(0.78 0.16 65)', m: '₿' },
  { s: 'XRP', n: 'XRP', q: 81.719792, px: 1.33, v: 108.50, paid: 82.2, c: 'oklch(0.7 0.02 260)', m: '✕' },
  { s: 'ADA', n: 'Cardano', q: 398.264951, px: 0.22, v: 86.99, paid: 85.3, c: 'oklch(0.66 0.13 250)', m: '₳', staked: 4.910459 },
]
const crypto = COINS.reduce((t, c) => t + c.v, 0)
const cpaid = COINS.reduce((t, c) => t + c.paid, 0)
const SH = { worth: 6158.71, paid: 5748.51 }

const S = {
  portfolio: { label: 'Portfolio with crypto', note: '<b>Revolut Crypto is its own account</b>, beside Trade Republic and Trading 212, and its coins count in WORTH NOW and in INVESTED (your pick, 3 Oct). The split bar says shares, ETFs and crypto at a glance.' },
  coin: { label: 'a coin opened · ADA', note: '<b>Real ADA closes</b> (Apr → Oct), with MA 20, MA 40 and RSI you can switch on and off, each explained in a sentence. ' + '<b>A coin opened</b> works like a share: price line, what you paid, your trades on the line. What only coins have: <b>earned by staking</b> — 4.91 ADA at €0 cost, 45 rewards since February, shown on the coin and never as money in.' },
  sold: { label: 'sold out · XLM', note: '<b>Coins you no longer hold</b> stay findable under "sold", with what they returned. XLM: bought and sold six times since 2020, none left.' },
  drop: { label: 'adding the statement', note: '<b>Adding the PDF</b> is the drop you know from UPDATE ALL. The app reads it, checks it adds up — opening 0 → trades and staking → closing €569.07 — and shows that before anything is written.' },
}
let K = 'portfolio', F = 'all', ch

function brokers() {
  const card = (name, site, pos, worth, paid, cash, extra = '', cls = '') => `<section class="glass bk ${cls}">
    <div class="hd">${img(SITE(site), 34, 10)}<b>${name}</b><span class="caps">${pos}</span></div>
    <div><span class="caps">total</span><div class="big" style="font-size:28px;margin-top:4px">${eur(worth + (cash ?? 0))}</div></div>
    <div class="kv"><span>investments</span><span>${eur(worth)} ${pp(worth - paid, paid, 1)}</span></div>
    <div class="kv"><span>you paid for them</span><span>${eur(paid)}</span></div>
    ${cash !== null ? `<div class="kv"><span>free cash</span><span>${eur(cash)}</span></div>` : ''}${extra}</section>`
  return `<p class="note" style="text-align:left;margin:0">Revolut is two accounts here, as Revolut keeps them: <b>Revolut</b> (bank and its stocks) and <b>Revolut Crypto</b> (Revolut Digital Assets, Cyprus). Its stocks come in from the trading statement, like Trade Republic's.</p>
  <div class="brokers">
    ${card('Trade Republic', 'traderepublic.com', '15 positions', 4141.35, 3796.40, 1543.09)}
    ${card('Trading 212', 'trading212.com', '8 positions', 2017.36, 1952.11, 12994.22)}
    <section class="glass bk"><div class="hd">${img(SITE('revolut.com'), 34, 10)}<b>Revolut · stocks</b><span class="caps">0 positions</span></div>
      <p style="color:var(--ink-400);font-size:13px;line-height:1.55">Your Revolut shares appear here when you drop its trading statement — same reading as the others, each trade checked.</p>
      <button class="pill" style="align-self:flex-start">drop the trading statement</button></section>
    ${card('Revolut Crypto', 'revolut.com', '5 coins', crypto, cpaid, null, `<div class="kv"><span>earned by staking</span><span class="up">4.91 ADA · €1.07</span></div><div class="kv"><span>statement</span><span class="dim">read 3 Oct · adds up ✓</span></div>`, 'new')}
  </div>`
}

function list() {
  const coinRows = COINS.map((c) => `<div class="row" onclick="${c.s === 'ADA' ? "K='coin';render()" : ''}">${coinImg(c.s)}
    <span class="nm"><b>${c.n}</b><p>${c.s} · Revolut Crypto · ${c.q} ${c.s}${c.staked ? ` · <span class="up">${c.staked.toFixed(2)} from staking</span>` : ''}</p></span>
    <span class="rt">${eur(c.v)}<small class="${c.v >= c.paid ? 'up' : 'down'}">${c.v >= c.paid ? '▲' : '▼'} ${Math.abs((c.v - c.paid) / c.paid * 100).toFixed(1)}%</small></span></div>`)
  const heldRows = HELD.map(([s, n, v, p, k, a, d]) => `<div class="row">${img(SITE(d))}
    <span class="nm"><b>${n}</b><p>${s} · ${k} · ${a === 'TR' ? 'Trade Republic' : 'Trading 212'}</p></span>
    <span class="rt">${eur(v)}<small class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</small></span></div>`)
  /* Biggest first, coins among the shares. */
  const all = [...HELD.map((h, i) => [h[2], heldRows[i]]), ...COINS.map((c, i) => [c.v, coinRows[i]])].sort((x, y) => y[0] - x[0]).map((x) => x[1])
  const body = (F === 'crypto' ? coinRows : F === 'shares' ? heldRows : all).join('')
  return `<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
    <span class="title">[ POSITIONS · ${F === 'crypto' ? 5 : F === 'shares' ? 23 : 28} ]</span><span class="filters">${['all', 'shares', 'crypto'].map((f) => `<button class="pill ${F === f ? 'on' : ''}" onclick="F='${f}';render()">${f}</button>`).join('')}</span></div>${body}
    ${F !== 'shares' ? `<div class="row" onclick="K='sold';render()" style="opacity:.6">${coinImg('XLM')}<span class="nm"><b>sold · 1 coin</b><p>XLM · none left</p></span><span class="rt dim">›</span></div>` : ''}</section>`
}

function portfolio() {
  const worth = SH.worth + crypto, paid = SH.paid + cpaid
  const parts = [['stocks', STOCKS, 'var(--lav-400)'], ['ETFs', ETFS, 'oklch(0.7 0.12 230)'], ['crypto', crypto, 'oklch(0.78 0.16 65)']]
  return `<section class="panel"><span class="title">[ PORTFOLIO · SHARES AND CRYPTO · ALL ACCOUNTS ]</span>
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;margin-top:16px">
      <div><span class="caps">worth now</span><div class="big" style="margin-top:6px">${eur(worth)}</div></div>
      <div>${pp(worth - paid, paid)} <span class="caps">&nbsp;since bought</span><div class="caps" style="margin-top:8px">you paid ${eur(paid)}</div></div></div>
    <div class="split">${parts.map(([, v, c]) => `<i style="flex:${v};background:${c}"></i>`).join('')}</div>
    <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">${parts.map(([n, v, c]) => `<span class="caps"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c};margin-right:6px"></i>${n} ${eur(v, 0)} · ${(v / worth * 100).toFixed(0)}%</span>`).join('')}</div>
    <div class="caps" style="margin-top:12px">shares: closes as of Oct 2 · Yahoo Finance &nbsp;·&nbsp; coins: price 3 Oct 00:00 UTC · Yahoo Finance</div></section>` + brokers() + list()
}

let IND = { ma20: true, ma40: true, rsi: true }
const ma = (xs, n) => xs.map((_, i) => (i + 1 < n ? null : xs.slice(i + 1 - n, i + 1).reduce((a, b) => a + b, 0) / n))
function rsi(xs, n = 14) {
  const out = xs.map(() => null); let g = 0, l = 0
  for (let i = 1; i < xs.length; i++) {
    const d = xs[i] - xs[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0)
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)) } continue }
    g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = 100 - 100 / (1 + g / (l || 1e-9))
  }
  return out
}
function adaChart() {
  const xs = ADA_CLOSES.map((r) => r[1]), n = xs.length
  const m20 = ma(xs, 20), m40 = ma(xs, 40), r = rsi(xs)
  const W = 760, H = 220, L = 4, R = 60, T = 10, B = 20
  const lo = Math.min(...xs) * 0.97, hi = Math.max(...xs) * 1.03
  const x = (i) => L + (i / (n - 1)) * (W - L - R), y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B)
  const path = (vs) => vs.map((v, i) => (v == null ? '' : `${vs[i - 1] == null ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`)).join('')
  const avg = 85.3 / (398.26 - 4.91)
  let g = `<svg viewBox="0 0 ${W} ${H}">`
  for (let k = 0; k <= 3; k++) { const v = lo + ((hi - lo) * k) / 3; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.05)"/><text x="${W - R + 8}" y="${y(v) + 4}" fill="var(--ink-500)" style="font-family:var(--mono);font-size:10px">€${v.toFixed(3)}</text>` }

  g += `<path d="${path(xs)}" fill="none" stroke="var(--good)" stroke-width="2"/>`
  if (IND.ma20) g += `<path d="${path(m20)}" fill="none" stroke="oklch(0.85 0.13 85)" stroke-width="1.4"/>`
  if (IND.ma40) g += `<path d="${path(m40)}" fill="none" stroke="oklch(0.78 0.12 230)" stroke-width="1.4"/>`
  g += `<line x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink-300)" stroke-dasharray="3 4"/><text x="${L + 4}" y="${y(avg) - 6}" fill="var(--ink-300)" style="font-family:var(--mono);font-size:9.5px">you paid €${avg.toFixed(3)} on average</text>`
  g += `<circle cx="${x(n - 1)}" cy="${y(xs[n - 1])}" r="4" fill="var(--good)"/></svg>`
  if (IND.rsi) {
    const h = 90, yy = (v) => 6 + (1 - v / 100) * (h - 12)
    g += `<svg viewBox="0 0 ${W} ${h}" style="margin-top:6px"><rect x="${L}" y="${yy(70)}" width="${W - L - R}" height="${yy(30) - yy(70)}" fill="rgba(181,171,252,.06)"/>`
    for (const v of [30, 50, 70]) g += `<line x1="${L}" x2="${W - R}" y1="${yy(v)}" y2="${yy(v)}" stroke="rgba(255,255,255,${v === 50 ? 0.04 : 0.1})" ${v === 50 ? '' : 'stroke-dasharray="2 4"'}/><text x="${W - R + 8}" y="${yy(v) + 4}" fill="var(--ink-500)" style="font-family:var(--mono);font-size:10px">${v}</text>`
    g += `<path d="${r.map((v, i) => (v == null ? '' : `${r[i - 1] == null ? 'M' : 'L'}${x(i).toFixed(1)},${yy(v).toFixed(1)}`)).join('')}" fill="none" stroke="var(--lav-400)" stroke-width="1.6"/>`
    g += `<text x="${L}" y="12" fill="var(--lav-300)" style="font-family:var(--mono);font-size:10px">RSI 14 · ${r[n - 1].toFixed(0)}</text></svg>`
  }
  return { svg: g, now: { px: xs[n - 1], m20: m20[n - 1], m40: m40[n - 1], rsi: r[n - 1] } }
}
