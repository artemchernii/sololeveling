<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Flow (3 Oct). Artem: "one view of movements of all sources", "flow
     should be useful, i actually analyze my spending and future",
     "important thing is to show future spendings, especially reoccurring".
     Journey: docs/specs/2026-10-03-flow-journey.md. Sample numbers at his
     accounts' scale, not his. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --money: oklch(0.8 0.1 85);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
    --acc-bpi: oklch(0.72 0.16 50);
    --acc-revolut: oklch(0.74 0.15 350);
    --acc-activo: oklch(0.76 0.14 160);
    --acc-tr: oklch(0.88 0.01 280);
    --acc-212: oklch(0.72 0.13 225);
    --acc-cash: var(--money);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button, input { font: inherit; color: inherit }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .ctl { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--warn); text-transform: uppercase; letter-spacing: .08em }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400); cursor: pointer; transition: color .15s, background .15s, border-color .15s; white-space: nowrap }
  .pill:hover { color: var(--ink-200) }
  .pill.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 780px; margin: 0 auto; text-align: center }
  .note b { color: var(--ink-200); font-weight: 400 }
  .mono { font-family: var(--mono) }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-500) }
  .up { color: var(--good) } .down { color: var(--danger) } .flat { color: var(--ink-500) } .warn { color: var(--warn) }

  .tabs { display: flex; gap: 6px }
  .card { position: relative; border-radius: 22px; padding: 18px 20px; border: 1px solid rgba(var(--lift),.08);
    background: linear-gradient(160deg, rgba(var(--lift),.035), rgba(var(--lift),.01) 50%), #1a1a28; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); animation: rise .45s cubic-bezier(.2,.8,.2,1) both }
  .card.sys { border-color: var(--sys-edge); box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), 0 0 40px -22px var(--shine) }
  .title { font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } }
  @keyframes land { 0% { background: rgba(181,171,252,.22) } 100% { background: transparent } }

  /* Sub-tabs (3 Oct, his ask: "too much scrolling … additional tabs in
     flow"). The month line stays on top; one room below it at a time.
     Each tab carries one line of what is inside, so a warning on a tab
     you are not looking at is still seen. */
  .sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: sticky; top: 0; z-index: 5; padding: 8px 0; background: linear-gradient(var(--bg) 70%, transparent) }
  .st { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(var(--lift),.08); background: rgba(var(--lift),.02); cursor: pointer; text-align: left; transition: border-color .2s, background .2s, box-shadow .2s }
  .st:hover { border-color: rgba(var(--lift),.16) }
  .st .stt { font-family: var(--mono); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-400) }
  .st .sts { font-size: 12.5px; color: var(--ink-500); line-height: 1.35 }
  .st.on { border-color: var(--sys-edge); background: rgba(181,171,252,.07); box-shadow: 0 0 30px -16px var(--shine) }
  .st.on .stt { color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .st.on .sts { color: var(--ink-300) }
  .st .dot { display: inline-block; width: 6px; height: 6px; border-radius: 99px; margin-right: 6px; vertical-align: 1px; background: var(--c) }
  @media (max-width: 620px) { .sub { gap: 5px } .st { padding: 10px 11px } .st .stt { font-size: 10px; letter-spacing: .14em } .st .sts { font-size: 11px } }
  .room[hidden] { display: none }
  .tog { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-400); background: none; border: 1px solid rgba(var(--lift),.12); border-radius: 999px; padding: 5px 11px; cursor: pointer }
  .tog.on { color: var(--ink-100); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent); background: rgba(181,171,252,.12) }
  .tog i { width: 14px; height: 8px; border-radius: 3px; background: color-mix(in oklch, var(--lav-400) 25%, transparent); border: 1px dashed color-mix(in oklch, var(--lav-400) 60%, transparent) }

  /* Month in one line */
  .month { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: end }
  @media (max-width: 860px) { .month { grid-template-columns: 1fr } }
  .nums { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 8px }
  .num { display: flex; flex-direction: column; gap: 4px }
  .num b { font-weight: 300; font-size: 34px; letter-spacing: -.01em; font-variant-numeric: tabular-nums }
  .num small { font-family: var(--mono); font-size: 11px; color: var(--ink-500) }
  .say { margin-top: 12px; font-size: 13.5px; color: var(--ink-300); line-height: 1.5 }
  .say b { font-weight: 400; color: var(--ink-100) }
  svg { display: block; overflow: visible }
  .axis text { fill: var(--ink-500); font-family: var(--mono); font-size: 10px }

  /* Ahead */
  .ahead { display: grid; grid-template-columns: 1fr 260px; gap: 20px }
  @media (max-width: 900px) { .ahead { grid-template-columns: 1fr } }

  .yes { background: rgba(181,171,252,.18); border: 1px solid color-mix(in oklch, var(--lav-400) 45%, transparent); color: var(--ink-100); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .1em }
  .no { background: none; border: 1px solid rgba(var(--lift),.12); color: var(--ink-400); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .1em }
  .no:hover { color: var(--ink-100) }
  .bills { display: flex; flex-direction: column }
  .mhead { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 6px; border-bottom: 1px solid rgba(var(--lift),.07) }
  .mhead:first-child { padding-top: 2px }
  .bill { display: grid; grid-template-columns: 54px 26px 1fr auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid rgba(var(--lift),.04); cursor: pointer; border-radius: 8px; transition: background .15s }
  .bill:hover { background: rgba(var(--lift),.035) }
  .bill.landed { animation: land 1.4s ease-out }
  .date { display: flex; flex-direction: column; align-items: center; line-height: 1.1 }
  .date b { font-weight: 300; font-size: 20px; font-variant-numeric: tabular-nums }
  .date small { font-family: var(--mono); font-size: 9.5px; color: var(--ink-500); letter-spacing: .1em; text-transform: uppercase }
  .bill .nm { font-size: 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
  .bill .nm small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); letter-spacing: .04em }
  .bill .amt { font-family: var(--mono); font-size: 14px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px }
  .bill .amt small { font-size: 10px; letter-spacing: .06em }
  .bill.paid { opacity: .55 }
  .bill.gone { opacity: 0; transform: translateX(14px); transition: opacity .28s, transform .28s }
  .nab { background: none; border: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--ink-500) }
  .nab:hover { color: var(--danger) }
  .bill.short { background: color-mix(in oklch, var(--warn) 7%, transparent) }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; color: var(--ink-400); background: rgba(var(--lift),.05); white-space: nowrap }
  .tag.y { color: var(--lav-300); background: rgba(181,171,252,.12) }
  .tag.w { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent) }
  .tag.g { color: var(--good); background: color-mix(in oklch, var(--good) 12%, transparent) }
  .logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 500; color: #15151f; background: var(--c); box-shadow: 0 0 12px -4px var(--c) }
  .side { display: flex; flex-direction: column; gap: 14px }
  .box { border-radius: 16px; padding: 14px; border: 1px solid rgba(var(--lift),.07); background: rgba(var(--lift),.02); display: flex; flex-direction: column; gap: 8px }
  .box .big { font-weight: 300; font-size: 26px; font-variant-numeric: tabular-nums }
  .kv { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--ink-300); padding: 3px 0 }
  .kv span:first-child { color: var(--ink-500) }
  .link { background: none; border: none; padding: 0; color: var(--lav-300); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; text-align: left }
  .link:hover { color: var(--ink-100) }

  /* Where it went */
  .groups { display: flex; flex-direction: column }
  .grp { display: grid; grid-template-columns: 150px 1fr 120px 96px 90px; gap: 14px; align-items: center; padding: 10px 6px; border-bottom: 1px solid rgba(var(--lift),.05); cursor: pointer; border-radius: 8px; transition: background .15s }
  .grp:hover { background: rgba(var(--lift),.035) }
  @media (max-width: 760px) { .grp { grid-template-columns: 110px 1fr 84px 80px } .grp .spark { display: none } }
  .grp .nm { font-size: 14px; display: flex; flex-direction: column; gap: 2px } .grp .nm small { font-family: var(--mono); font-size: 10px; color: var(--ink-500) }
  .hb { height: 8px; border-radius: 99px; background: rgba(var(--lift),.05); overflow: hidden }
  .hb i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, color-mix(in oklch, var(--money) 55%, transparent), var(--money)); transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both }
  @keyframes grow { from { transform: scaleX(0) } }
  .grp .v { font-family: var(--mono); text-align: right }
  .grp .d { font-family: var(--mono); font-size: 12px; text-align: right }

  /* Movements */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; border: 1px solid rgba(var(--lift),.1); background: none; cursor: pointer; font-size: 12.5px; color: var(--ink-300); transition: all .15s }
  .chip .logo { width: 20px; height: 20px; border-radius: 99px; font-size: 8.5px }
  .chip.on { color: var(--ink-100); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent); background: rgba(181,171,252,.1) }
  .chip.all { padding-left: 11px }
  .search { flex: 1; min-width: 160px; max-width: 260px; margin-left: auto; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(var(--lift),.1); background: rgba(var(--lift),.03); outline: none; font-size: 13px }
  .search:focus { border-color: var(--sys-edge) }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; margin: 16px 0 6px; height: 74px; align-items: end }
  .cell { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; cursor: pointer; border-radius: 6px; padding-bottom: 2px; background: none; border: none }
  .cell:hover { background: rgba(var(--lift),.04) }
  .cell .col { align-self: stretch; margin: 0 18%; border-radius: 3px 3px 1px 1px; background: color-mix(in oklch, var(--danger) 60%, transparent); min-height: 2px; transform-origin: bottom; animation: grow2 .6s cubic-bezier(.2,.8,.2,1) both }
  @keyframes grow2 { from { transform: scaleY(0) } }
  .cell .col.in { background: var(--good) }
  .cell small { font-family: var(--mono); font-size: 9px; color: var(--ink-600); text-align: center }
  .cell.today small { color: var(--lav-300) }
  .cell .bd { position: absolute; top: 2px; left: calc(50% - 3px); width: 6px; height: 6px; border-radius: 99px; border: 1.3px solid var(--ink-400) }
  .cell.future .bd { border-color: var(--lav-400) }
  .cell.on { background: rgba(181,171,252,.12) }
  .list { display: flex; flex-direction: column }
  .dayh { display: flex; justify-content: space-between; padding: 16px 4px 6px; border-bottom: 1px solid rgba(var(--lift),.07); scroll-margin-top: 20px }
  .dayh.flash { animation: land 1.4s ease-out }
  .mv { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 8px 4px; border-bottom: 1px solid rgba(var(--lift),.035); font-size: 13.5px }
  .mv small { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-500); letter-spacing: .04em; margin-top: 2px }
  .mv .a { font-family: var(--mono) }
  .mv.move { color: var(--ink-400) }
  .mv.move .a { color: var(--ink-400) }
  .pair { display: flex; align-items: center }
  .pair .logo { width: 18px; height: 18px; font-size: 7.5px; border-radius: 6px }
  .pair .logo + .logo { margin-left: -6px; box-shadow: 0 0 0 2px #1a1a28 }
  .more { margin: 14px auto 0; display: block }

  .empty { padding: 34px 10px; text-align: center; color: var(--ink-400); line-height: 1.6; font-size: 13.5px }
  .empty b { display: block; color: var(--ink-100); font-weight: 400; font-size: 16px; margin-bottom: 4px }

  /* Sheet: rows behind a number */
  .veil { position: fixed; inset: 0; background: rgba(8,8,14,.55); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 9 }
  .veil.on { display: flex }
  .sheet { width: min(600px, 100%); max-height: 86vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 20px 26px; border: 1px solid var(--sys-edge); border-bottom: none;
    background: linear-gradient(160deg, rgba(181,171,252,.09), rgba(181,171,252,.02) 40%), #1d1c2d; box-shadow: 0 -20px 70px -20px rgba(0,0,0,.85), 0 0 40px -18px var(--shine); animation: up .32s cubic-bezier(.2,.8,.2,1) both; display: flex; flex-direction: column; gap: 12px }
  @keyframes up { from { transform: translateY(30px); opacity: 0 } }
  .sheet .t { display: flex; justify-content: space-between; align-items: center }
  .mv.tap { cursor: pointer; border-radius: 8px; transition: background .15s } .mv.tap:hover { background: rgba(var(--lift),.035) }
  .addb { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px; border-radius: 999px; border: 1px dashed color-mix(in oklch, var(--lav-400) 50%, transparent); background: none; color: var(--lav-300); cursor: pointer }
  .addb:hover { background: rgba(181,171,252,.1); color: var(--ink-100) }
  .line { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--sys-edge); background: rgba(var(--lift),.03); outline: none; font-family: var(--mono); font-size: 14px }
  .read { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; font-size: 13px; color: var(--ink-300) }
  .read .tag { font-size: 10.5px; padding: 4px 9px }
  .choose { display: flex; gap: 6px; flex-wrap: wrap }
  .big2 { font-weight: 300; font-size: 30px; font-variant-numeric: tabular-nums }
  .x { width: 30px; height: 30px; border-radius: 99px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-300); cursor: pointer }
  .yr { display: grid; grid-template-columns: 44px 1fr 80px; gap: 10px; align-items: center; padding: 6px 0; font-family: var(--mono); font-size: 12px }
  .yr .hb i { background: linear-gradient(90deg, color-mix(in oklch, var(--lav-400) 50%, transparent), var(--lav-400)) }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctl">Mockup · sample numbers · pick a situation</div>
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>

  <div class="tabs"><span class="pill">Overview</span><span class="pill on">Flow</span><span class="pill">Portfolio</span></div>

  <section class="card" id="monthCard"></section>
  <nav class="sub" id="sub"></nav>
  <section class="card sys room" id="aheadCard"></section>
  <section class="card room" id="wentCard"></section>
  <section class="card room" id="moveCard"></section>
</div>
<div class="veil" id="veil" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>

<script>
const DAY = 86400000
const D = (m, d) => Date.UTC(2026, m, d)
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
const eur = (v, c = 0) => '€' + Math.abs(v).toLocaleString('en-GB', { minimumFractionDigits: c, maximumFractionDigits: c })
const eur2 = (v) => eur(v, 2)
const dt = (t) => new Date(t)
const short = (t) => dt(t).getUTCDate() + ' ' + MON[dt(t).getUTCMonth()]
const mkey = (t) => dt(t).getUTCFullYear() * 12 + dt(t).getUTCMonth()
const mname = (k) => MON[k % 12]
const lastDay = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate()

const ACC = {
  bpi: { name: 'BPI', mark: 'BPI', c: '--acc-bpi', free: true },
  revolut: { name: 'Revolut', mark: 'R', c: '--acc-revolut', free: true },
  activo: { name: 'ActivoBank', mark: 'AB', c: '--acc-activo', free: true },
  cash: { name: 'Cash', mark: '€', c: '--acc-cash', free: true },
  tr: { name: 'Trade Republic', mark: 'TR', c: '--acc-tr', free: false },
  '212': { name: 'Trading 212', mark: '212', c: '--acc-212', free: false },
}
const logo = (id, cls = '') => `<span class="logo ${cls}" style="--c:${css(ACC[id].c)}">${ACC[id].mark}</span>`

/* Recurring: found in statements and said yes to once. `amt` is what the
   last payment was; a bill whose amount moves (EDP) says "about". */
const RECUR = [
  { id: 'salary', name: 'BNP Paribas', what: 'salary', acc: 'bpi', amt: 2638.36, day: 27, in: true },
  { id: 'gym', name: 'Fitness Hut', what: 'gym', acc: 'activo', amt: 35, day: 1, group: 'health' },
  { id: 'icloud', name: 'iCloud+', what: 'subscription', acc: 'revolut', amt: 2.99, day: 2, sub: true },
  { id: 'mort', name: 'Mortgage', what: 'home', acc: 'bpi', amt: 780.12, day: 8, group: 'home' },
  { id: 'gpt', name: 'ChatGPT Plus', what: 'subscription', acc: 'revolut', amt: 23, day: 11, sub: true },
  { id: 'netflix', name: 'Netflix', what: 'subscription', acc: 'revolut', amt: 12.99, day: 14, sub: true },
  { id: 'edp', name: 'EDP electricity', what: 'home · amount changes', acc: 'bpi', amt: 61.4, about: true, day: 18, group: 'home' },
  { id: 'spotify', name: 'Spotify', what: 'subscription', acc: 'revolut', amt: 10.99, day: 20, sub: true },
  { id: 'voda', name: 'Vodafone', what: 'phone and internet', acc: 'bpi', amt: 34.99, day: 22, group: 'home' },
  { id: 'yt', name: 'YouTube Premium', what: 'subscription', acc: 'revolut', amt: 8.49, day: 24, sub: true },
  { id: 'gone', name: 'Google One', what: 'subscription', acc: 'revolut', amt: 1.99, day: 29, sub: true },
  { id: 'github', name: 'GitHub', what: 'subscription', acc: 'revolut', amt: 3.69, day: 5, sub: true },
  { id: 'car', name: 'Fidelidade', what: 'car insurance', acc: 'bpi', amt: 342.18, day: 15, month: 10, yearly: true, group: 'car' },
  { id: 'domain', name: 'Namecheap', what: 'domain', acc: 'revolut', amt: 14.98, day: 3, month: 11, yearly: true, sub: true },
  { id: 'iuc', name: 'IUC', what: 'car tax', acc: 'bpi', amt: 118, day: 20, month: 0, yearly: true, group: 'car' },

const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const PAYEES = {
  groceries: [['Continente', 'bpi'], ['Pingo Doce', 'bpi'], ['Lidl', 'revolut'], ['Mercadona', 'revolut']],
  'eating out': [['Honorato', 'revolut'], ['Time Out Market', 'revolut'], ['Uber Eats', 'revolut'], ['Zé dos Cornos', 'activo']],

  shopping: [['Zara', 'activo'], ['Amazon', 'revolut'], ['Fnac', 'activo'], ['Decathlon', 'bpi']],

const ROWS = []
function gen() {
  for (let t = D(3, 1); t <= D(9, 31); t += DAY) {
    const d = dt(t), dom = d.getUTCDate(), m = d.getUTCMonth()
    const add = (r) => ROWS.push({ t, ...r })

      if (r.yearly ? (r.month === m && r.day === dom) : r.day === dom) {
        const amt = r.about ? Math.round((52 + rnd() * 20) * 100) / 100 : r.amt
        add({ name: r.name, acc: r.acc, amt: r.in ? amt : -amt, group: r.in ? 'salary' : r.sub ? 'subscriptions' : r.group, rec: r.id })

    const jump = m === 8 ? 1.7 : 1
    if (rnd() < 0.42) { const [n, a] = PAYEES.groceries[Math.floor(rnd() * 4)]; add({ name: n, acc: a, amt: -Math.round((18 + rnd() * 55) * 100) / 100, group: 'groceries' }) }
    if (rnd() < 0.28 * jump) { const [n, a] = PAYEES['eating out'][Math.floor(rnd() * 4)]; add({ name: n, acc: a, amt: -Math.round((9 + rnd() * 28) * 100) / 100, group: 'eating out' }) }
    if (rnd() < 0.8) { const [n, a] = PAYEES['coffee & small'][Math.floor(rnd() * 4)]; add({ name: n, acc: a, amt: -Math.round((1.2 + rnd() * 4.5) * 100) / 100, group: 'coffee & small' }) }
    if (rnd() < 0.25) { const [n, a] = PAYEES.transport[Math.floor(rnd() * 4)]; add({ name: n, acc: a, amt: -Math.round((5 + rnd() * (n === 'Galp' ? 60 : 12)) * 100) / 100, group: 'transport' }) }
    if (rnd() < 0.08) { const [n, a] = PAYEES.shopping[Math.floor(rnd() * 4)]; add({ name: n, acc: a, amt: -Math.round((19 + rnd() * 80) * 100) / 100, group: 'shopping' }) }
    /* Moves between his own accounts: one row, two logos. */
    if (dom === 26) add({ move: true, from: 'bpi', to: 'revolut', amt: 400, name: 'Top-up' })
    if (dom === 2) add({ move: true, from: 'revolut', to: 'tr', amt: 100, name: 'Savings plan cash' })
    if (dom === 12 && m % 2 === 0) add({ move: true, from: 'bpi', to: 'cash', amt: 100, name: 'ATM' })
    if (t === D(7, 27)) add({ move: true, from: 'bpi', to: 'activo', amt: 300, name: 'Transfer' })
    if (t === D(8, 1)) add({ move: true, from: 'bpi', to: 'activo', amt: 1100, name: 'Transfer' })
    /* Paid once so far: a yearly insurance and a club he just joined. */
    if (t === D(8, 22)) add({ name: 'Allianz', acc: 'bpi', amt: -218.4, group: 'home' })
    if (t === D(8, 28)) add({ name: 'Padel Lisboa', acc: 'bpi', amt: -40, group: 'health' })
  }
}

const BASE = { bpi: 3140.55, revolut: 418.2, activo: 153.21, cash: 420, tr: 1042.1, '212': 12994.22 }
function balances(today, over = {}) {
  const b = { ...BASE, ...over }
  for (const r of ROWS) {
    if (r.t <= D(9, 3) || r.t > today) continue
    if (r.move) { b[r.from] -= r.amt; b[r.to] += r.amt } else b[r.acc] += r.amt

}

const foundIn = () => SCEN[S.scen].found ? FOUND.filter((f) => S.ans[f.id] !== 'no') : []
function upcoming(today, until) {
  const list = []
  for (let t = today + DAY; t <= until; t += DAY) {
    const d = dt(t)
    for (const r of [...RECUR, ...foundIn(), ...S.added]) {
      const len = lastDay(d.getUTCFullYear(), d.getUTCMonth())
      const day = Math.min(r.day, len)
      if (d.getUTCDate() === day && (!r.yearly || r.month === d.getUTCMonth())) list.push({ t, r })
    }
  }
  return list
}
function aheadCard() {

  const until = today + 89 * DAY
  const up = upcoming(today, until)
  const bal = balances(today, sc.over)
  /* Per account, walk the days: a payment the account will not cover is marked. */
  const run = { ...bal }
  const tops = ROWS.filter((r) => r.move && r.t > today && r.t <= until)
  for (const e of up) {
    for (const m of tops) if (m.t <= e.t && !m.done) { run[m.from] -= m.amt; run[m.to] += m.amt; m.done = true }
    const before = run[e.r.acc]
    run[e.r.acc] += e.r.in ? e.r.amt : -e.r.amt
    e.after = run[e.r.acc]; e.short = !e.r.in && before < e.r.amt; e.held = before
  }
  tops.forEach((m) => delete m.done)
  const free = Object.entries(bal).filter(([a]) => ACC[a].free).reduce((n, [, v]) => n + v, 0)
  const out = up.filter((e) => !e.r.in).reduce((n, e) => n + e.r.amt, 0)
  const inn = up.filter((e) => e.r.in).reduce((n, e) => n + e.r.amt, 0)
  const shorts = up.filter((e) => e.short)

  /* Paid already this month: shown as ticked, above what is coming. */
  const k = mkey(today)

    <span class="amt"><span class="${r.in ? 'up' : ''}">${r.about && !paid ? '≈ ' : ''}${r.in ? '+' : '−'}${eur2(amt)}</span>${isNew(r) ? `<button class="nab" onclick="event.stopPropagation();notBill('${r.id}')">× ${S.added.some((a) => a.id === r.id) ? 'remove' : 'not a bill'}</button>` : status}</span></div>`
}
const isBill = (r) => r.rec || S.added.some((a) => a.from === r.name)
const isNew = (r) => FOUND.some((f) => f.id === r.id) || S.added.some((a) => a.id === r.id)
function lineChart(today, until, free, up, band) {
  const W = 760, H = 190, L = 4, R = 64, T = 12, B = 22
  const pts = [{ t: today, v: free }]
  let v = free
  for (const e of up) { v += e.r.in ? e.r.amt : -e.r.amt; pts.push({ t: e.t, v, e }) }
  /* On by default ("band yes", 3 Oct): a faint band under the line — where it lands
     if everything else runs at last three months' low and high rates. */
  const days = (t) => (t - today) / DAY
  const bandLo = band ? pts.map((p) => p.v - band[1] / 30 * days(p.t)) : []
  const endHi = band ? pts.at(-1).v - band[1] / 30 * days(until) : Infinity
  const lo = Math.min(...pts.map((p) => p.v), ...bandLo, endHi) * 0.9, hi = Math.max(...pts.map((p) => p.v)) * 1.04
  const x = (t) => L + (t - today) / (until - today) * (W - L - R)
  const y = (val) => T + (1 - (val - lo) / (hi - lo)) * (H - T - B)
  let d = `M${x(today)},${y(free)}`, prev = free
  for (const p of pts.slice(1)) { d += `H${x(p.t).toFixed(1)}V${y(p.v).toFixed(1)}`; prev = p.v }
  d += `H${x(until)}`
  let g = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><g class="axis">`
  for (let i = 0; i <= 3; i++) { const val = lo + (hi - lo) * i / 3; g += `<line x1="${L}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}" stroke="rgba(255,255,255,.05)"/><text x="${W - R + 8}" y="${y(val) + 4}">${eur(Math.round(val / 100) * 100)}</text>` }
  for (let mo = 0; mo < 4; mo++) {
    const td = dt(today), t = Date.UTC(td.getUTCFullYear(), td.getUTCMonth() + mo + 1, 1)
    if (t < until) g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.07)" stroke-dasharray="2 4"/><text x="${x(t) + 4}" y="${H - 6}">${MON[dt(t).getUTCMonth()]}</text>`
  }
  g += `<text x="${L}" y="${H - 6}" fill="${css('--lav-300')}">today</text></g>`
  g += `<path d="${d} V${H - B} H${x(today)} Z" fill="url(#fill)" opacity=".5"/>`
  g += `<defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${css('--lav-400')}" stop-opacity=".22"/><stop offset="1" stop-color="${css('--lav-400')}" stop-opacity="0"/></linearGradient></defs>`
  if (band) {
    /* Steps of the line, minus a straight daily rate: sample every 2 days. */
    const at = (t) => { let v = free; for (const p of pts.slice(1)) if (p.t <= t) v = p.v; return v }
    const ts = []; for (let t = today; t <= until; t += 2 * DAY) ts.push(t); ts.push(until)
    const top = ts.map((t) => `${x(t).toFixed(1)},${y(at(t) - band[0] / 30 * days(t)).toFixed(1)}`)
    const bot = ts.map((t) => `${x(t).toFixed(1)},${y(at(t) - band[1] / 30 * days(t)).toFixed(1)}`).reverse()
    g += `<polygon points="${top.join(' ')} ${bot.join(' ')}" fill="${css('--lav-400')}" opacity=".12"/>`
    g += `<polyline points="${top.join(' ')}" fill="none" stroke="${css('--lav-400')}" stroke-opacity=".45" stroke-dasharray="3 4"/>`
    const eLo = at(until) - band[1] / 30 * days(until), eHi = at(until) - band[0] / 30 * days(until)
    g += `<text x="${x(until) - 6}" y="${y(eLo) + 14}" text-anchor="end" fill="${css('--lav-300')}" style="font-family:var(--mono);font-size:9.5px">after everything else ${eur(eLo)}–${eur(eHi)}</text>`
  }
  g += `<path d="${d}" fill="none" stroke="${css('--lav-400')}" stroke-width="2" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${css('--shine')})"/>`
  let lastLab = -1e9
  for (const p of pts.slice(1)) {
    if (p.e.r.amt < 100 && !p.e.short) continue
    const c = p.e.short ? css('--warn') : p.e.r.in ? css('--good') : css('--ink-300')
    g += `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.2" fill="#1a1a28" stroke="${c}" stroke-width="1.6"><title>${short(p.t)} · ${p.e.r.name} ${p.e.r.in ? '+' : '−'}${eur2(p.e.r.amt)} → ${eur(p.v)}</title></circle>`
    if (p.e.r.amt >= 300) {
      const near = x(p.t) > W - R - 90, close = x(p.t) - lastLab < 80
      lastLab = x(p.t)
      g += `<text x="${x(p.t) + (near ? -6 : 5)}" y="${y(p.v) + (p.e.r.in ? -7 : close ? 25 : 13)}" text-anchor="${near ? 'end' : 'start'}" style="font-family:var(--mono);font-size:9.5px" fill="${c}">${p.e.r.name === 'BNP Paribas' ? 'salary' : p.e.r.name.toLowerCase()} ${p.e.r.in ? '+' : '−'}${eur(p.e.r.amt)}</text>`
    }
  }
  const end = pts.at(-1)
  g += `<circle cx="${x(until)}" cy="${y(end.v)}" r="4" fill="${css('--lav-400')}"/></svg>`
  /* One sentence: the lowest point before the next salary. */
  const nextSal = up.find((e) => e.r.in)
  const before = pts.filter((p) => !nextSal || p.t < nextSal.t)
  const low = before.reduce((a, b) => (b.v < a.v ? b : a), before[0])
  return `<p class="say" style="margin:0 0 8px">Free cash ${eur(free)} now. Lowest before the next salary: <b>${eur(low.v)}</b>${low.e ? ` on ${short(low.t)}` : ''}${nextSal ? ` — salary ${short(nextSal.t)}` : ''}. ${band ? `With everything else at last three months' rates, it lands between the dashed edge and the band's floor.` : `Only bills and salary move this line — everything else (groceries, eating out …) is beside it, not in it.`}</p>
    <div style="display:flex;justify-content:flex-end;margin:-2px 0 6px"><button class="tog ${band ? 'on' : ''}" onclick="S.band=!S.band;aheadCard()"><i></i>with everything else</button></div>${g}`
}
function notBill(id) {
  document.querySelectorAll('.bill.l-' + id).forEach((n) => n.classList.add('gone'))
  setTimeout(() => { S.ans[id] = 'no'; S.added = S.added.filter((a) => a.id !== id); S.notice = null; aheadCard(); subTabs() }, 280)
}

/* ── Where it went ──────────────────────────────────────────────── */
function wentCard() {
  const sc = SCEN[S.scen], today = sc.today, el = document.getElementById('wentCard')
  if (sc.empty) { el.innerHTML = `<div class="head"><span class="title">[ WHERE IT WENT ]</span></div><div class="empty"><b>No spending read yet</b>Every payment from your statements lands in a group — groceries, eating out, the small stuff.<br/>Six months of it shows how each one is changing.</div>`; return }
  const rows = rowsTo(today), tk = mkey(today)
  const k = S.went != null ? 2026 * 12 + S.went : dt(today).getUTCDate() < 10 ? tk - 1 : tk
  const groups = {}
  for (const r of rows) if (!r.move && r.amt < 0) { const m = mkey(r.t); if (m > k - 6 && m <= k) { (groups[r.group] ??= {})[m] = ((groups[r.group] ?? {})[m] ?? 0) - r.amt } }
  const list = Object.entries(groups).map(([g, ms]) => ({ g, now: ms[k] ?? 0, prev: ms[k - 1] ?? 0, ms, n: rows.filter((r) => r.group === g && mkey(r.t) === k && !r.move).length })).filter((x) => x.now > 0).sort((a, b) => b.now - a.now)
  const top = list.filter((x) => x.g !== 'home').reduce((a, b) => (b.now - b.prev > a.now - a.prev ? b : a), list[0])
  const max = list[0]?.now ?? 1
  const total = list.reduce((n, x) => n + x.now, 0), ptotal = list.reduce((n, x) => n + x.prev, 0)
  const ch = top.now - top.prev
  el.innerHTML = `<div class="head"><span class="title">[ WHERE IT WENT ]</span>
    <span class="tabs">${[k - 5, k - 4, k - 3, k - 2, k - 1, k].concat(k < tk ? [tk] : []).filter((m, i, a) => a.indexOf(m) === i && m <= tk).slice(-6).map((m) => `<button class="pill ${m === k ? 'on' : ''}" onclick="S.went=${m % 12};wentCard()">${mname(m)}${m === tk ? ' so far' : ''}</button>`).join('')}</span></div>
    <p class="say" style="margin:0 0 12px">${ch > 0 ? `<b>${cap(top.g)} ${eur(top.now)}, up ${eur(ch)} on ${mname(k - 1)}</b> — the most of any group. ` : ''}${mname(k)}: −${eur(total)} out, ${total > ptotal ? '<span class="down">' + eur(total - ptotal) + ' more</span>' : '<span class="up">' + eur(ptotal - total) + ' less</span>'} than ${mname(k - 1)}.</p>
    <div class="groups">${list.map((x) => {
      const d = x.now - x.prev
      const sp = [5, 4, 3, 2, 1, 0].map((i) => x.ms[k - i] ?? 0), smax = Math.max(...sp, 1)
      return `<div class="grp" onclick="openGroup('${x.g}',${k})"><span class="nm">${cap(x.g)}<small>${x.n} payment${x.n === 1 ? '' : 's'}</small></span>
        <span class="hb"><i style="width:${x.now / max * 100}%"></i></span>
        <svg class="spark" viewBox="0 0 120 26" style="width:120px;height:26px">${sp.map((v, i) => `<rect x="${i * 20 + 2}" y="${24 - v / smax * 22}" width="14" height="${Math.max(1, v / smax * 22)}" rx="2" fill="${i === 5 ? css('--money') : 'rgba(255,255,255,.16)'}"/>`).join('')}</svg>
        <span class="v">−${eur2(x.now)}</span>
        <span class="d ${Math.abs(d) < 5 ? 'flat' : d > 0 ? 'down' : 'up'}">${Math.abs(d) < 5 ? 'same' : (d > 0 ? '▲ ' : '▼ ') + eur(Math.abs(d))}</span></div>`
    }).join('')}</div>
    <div class="caps" style="margin-top:10px">bars: this month · six small bars: the last six months · ▲ more spent than ${mname(k - 1)}</div>`
}
const cap = (s) => s[0].toUpperCase() + s.slice(1)

/* ── Movements: every account, one list ─────────────────────────── */
function moveCard() {
  const sc = SCEN[S.scen], today = sc.today, el = document.getElementById('moveCard')
  if (sc.empty) { el.innerHTML = `<div class="head"><span class="title">[ MOVEMENTS ]</span></div><div class="empty"><b>No movements yet</b>Every row from every account will be here, newest first, in one list.</div>`; return }
  const from = today - (S.limit - 1) * DAY
  const q = S.q.toLowerCase()
  const hit = (r) => (!S.acc || r.acc === S.acc || r.from === S.acc || r.to === S.acc) && (!q || r.name.toLowerCase().includes(q) || (r.group ?? '').includes(q))
  const rows = rowsTo(today).filter((r) => r.t >= from && hit(r)).sort((a, b) => b.t - a.t)
  /* Strip: the 30 days of the list, then the rest of the month with bills due. */
  const td = dt(today), endM = D(td.getUTCMonth(), lastDay(2026, td.getUTCMonth()))
  const stripFrom = today - 29 * DAY
  const all = rowsTo(today).filter(hit)
  const bills = upcoming(today, endM)
  let cells = '', mx = 1
  for (let t = stripFrom; t <= today; t += DAY) mx = Math.max(mx, spend(all.filter((r) => r.t === t)))
  for (let t = stripFrom; t <= endM; t += DAY) {
    const day = all.filter((r) => r.t === t), o = spend(day), i = income(day)

    cells += `<button class="cell ${t === today ? 'today' : ''} ${fut ? 'future' : ''} ${S.day === t ? 'on' : ''}" ${fut ? '' : `onclick="jump(${t})"`} title="${short(t)}${o ? ' · −' + eur2(o) : ''}${bill ? ' · ' + (bill.r?.name ?? bill.name) : ''}">
      ${bill ? '<span class="bd"></span>' : ''}${i ? `<span class="col in" style="height:${Math.min(44, Math.sqrt(i / mx) * 44)}px"></span>` : ''}${fut ? '' : `<span class="col" style="height:${Math.max(2, Math.sqrt(o / mx) * 44)}px"></span>`}<small>${dt(t).getUTCDate()}</small></button>`

  for (const r of rows) {

      const day = rows.filter((x) => x.t === r.t), o = spend(day)
      list += `<div class="dayh" id="d-${r.t}"><span class="caps">${r.t === today ? 'today' : r.t === today - DAY ? 'yesterday' : WD[dt(r.t).getUTCDay()] + ' ' + short(r.t)}</span><span class="caps">${o ? '−' + eur2(o) : ''}</span></div>`
    }

      ? `<div class="mv move"><span class="pair">${logo(r.from)}${logo(r.to)}</span><span>${ACC[r.from].name} → ${ACC[r.to].name}<small>your move · ${r.name.toLowerCase()} · not in or out</small></span><span class="a">⇄ ${eur2(r.amt)}</span></div>`
      : `<div class="mv tap" onclick="openRow(${r.i})">${logo(r.acc)}<span>${r.name}<small>${r.group}${r.rec || S.added.some((a) => a.from === r.name) ? ' · bill ✓' : ''} · ${ACC[r.acc].name}</small></span><span class="a ${r.amt > 0 ? 'up' : ''}">${r.amt > 0 ? '+' : '−'}${eur2(r.amt)}</span></div>`
  }
  el.innerHTML = `<div class="head"><span class="title">[ MOVEMENTS · every account ]</span><span class="caps">last ${S.limit} days</span></div>
    <div class="filters"><button class="chip all ${!S.acc ? 'on' : ''}" onclick="S.acc=null;moveCard()">All</button>
      ${['bpi', 'revolut', 'activo', 'cash', 'tr', '212'].map((a) => `<button class="chip ${S.acc === a ? 'on' : ''}" onclick="S.acc='${a}';moveCard()">${logo(a)}${ACC[a].name}</button>`).join('')}
      <input class="search" placeholder="Search a name — Netflix, Continente…" value="${S.q}" oninput="S.q=this.value;clearTimeout(window._s);window._s=setTimeout(()=>{moveCard();const i=document.querySelector('.search');i.focus();i.setSelectionRange(i.value.length,i.value.length)},180)"/></div>
    <div class="strip">${cells}</div>
    <div class="caps" style="display:flex;gap:16px;flex-wrap:wrap"><span>red: out that day · green: in</span><span>○ a bill's day</span><span style="color:var(--lav-300)">○ still to come</span><span>tap a day to jump</span></div>
    <div class="list">${list || '<div class="empty"><b>Nothing matches</b>Try another name or account.</div>'}</div>
    <button class="pill more" onclick="S.limit+=30;moveCard()">earlier · 30 more days</button>`
}

const sheetHead = (t) => `<div class="t"><span class="title">[ ${t} ]</span><button class="x" onclick="closeSheet()">✕</button></div>`

/* + bill: one line, read as you type; past payments that match are
   offered underneath, because a row already knows everything. */
function readLine(txt) {
  const w = txt.trim().split(/\s+/).filter(Boolean)
  const nums = w.filter((x) => /^\d+([.,]\d+)?$/.test(x)).map((x) => +x.replace(',', '.'))
  const mi = w.findIndex((x) => MON.some((m) => x.toLowerCase().startsWith(m.toLowerCase())) && /^[a-z]{3,}$/i.test(x))
  const month = mi >= 0 ? MON.findIndex((m) => w[mi].toLowerCase().startsWith(m.toLowerCase())) : undefined
  const freq = w.find((x) => /^(monthly|yearly|year|month|annual)$/i.test(x))
  const yearly = freq ? /year|annual/i.test(freq) : month !== undefined
  const name = w.filter((x, i) => !/^\d+([.,]\d+)?$/.test(x) && i !== mi && x !== freq && !/^(on|every|the|€)$/i.test(x)).join(' ')
  const amt = nums[0], day = nums[1] && nums[1] <= 31 ? nums[1] : undefined
  return { name, amt, day, month, yearly }
}

    <div class="read" id="addRead"></div>

  addPreview()
}
function addPreview() {

  const ok = b.name && b.amt && b.day && (!b.yearly || b.month !== undefined)
  const miss = !txt ? '' : [!b.name && 'a name', !b.amt && 'the amount', !b.day && 'the day', b.yearly && b.month === undefined && 'the month'].filter(Boolean)
  document.getElementById('addRead').innerHTML = !txt ? '<span class="caps">name · amount · how often · day</span>' :
    `${b.name ? `<span class="tag">${b.name}</span>` : ''}${b.amt ? `<span class="tag">−${eur2(b.amt)}</span>` : ''}<span class="tag y">${b.yearly ? 'every year' : 'every month'}</span>${b.day ? `<span class="tag">${b.yearly && b.month !== undefined ? b.day + ' ' + MON[b.month] : 'on the ' + b.day}</span>` : ''}
     <span class="tag">from</span>${['bpi', 'revolut', 'activo'].map((a) => `<button class="chip ${addAcc === a ? 'on' : ''}" style="padding:3px 9px 3px 3px" onclick="addAcc='${a}';addPreview()">${logo(a)}${ACC[a].name}</button>`).join('')}
     ${ok ? `<button class="yes" style="margin-left:auto" onclick="addTyped()">ADD</button>` : `<span class="caps" style="margin-left:auto">still need ${miss.join(', ')}</span>`}`
  const q = b.name.toLowerCase().split(' ')[0]
  const past = q.length < 2 ? [] : ROWS.filter((r) => !r.move && r.amt < 0 && r.t <= SCEN[S.scen].today && r.name.toLowerCase().includes(q))
  const byName = {}
  for (const r of past) byName[r.name] = r
  const list = Object.values(byName).slice(0, 4)
  document.getElementById('addPast').innerHTML = list.length ? `<div class="caps" style="margin:4px 0 4px">paid before — pick it</div>` + list.map((r) => {
    const n = past.filter((x) => x.name === r.name).length
    return `<div class="mv">${logo(r.acc)}<span>${r.name}<small>last ${short(r.t)} · ${n === 1 ? 'once' : n + ' times'} · ${ACC[r.acc].name}</small></span><span class="choose"><span class="a" style="align-self:center;margin-right:6px">−${eur2(r.amt)}</span><button class="no" onclick="fromRow(${r.i},false)">MONTHLY</button><button class="no" onclick="fromRow(${r.i},true)">YEARLY</button></span></div>`
  }).join('') : ''
}
function addTyped() {
  const b = readLine(document.getElementById('addLine').value)
  addBill({ name: b.name[0].toUpperCase() + b.name.slice(1), acc: addAcc, amt: b.amt, day: b.day, month: b.yearly ? b.month : undefined, yearly: b.yearly, group: 'home' })
}
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'addLine') document.querySelector('#addRead .yes')?.click() })

function openYear() {
  const today = SCEN[S.scen].today, td = dt(today), until = Date.UTC(td.getUTCFullYear() + 1, td.getUTCMonth(), 0)
  const up = upcoming(today, until).filter((e) => !e.r.in)
  const months = {}
  for (const e of up) (months[mkey(e.t)] ??= []).push(e)
  const mx = Math.max(...Object.values(months).map((l) => l.reduce((n, e) => n + e.r.amt, 0)))
  const yearly = up.filter((e) => e.r.yearly)
  sheet(sheetHead('what I pay this year') + `<p class="say" style="margin:0">The next twelve months of bills and subscriptions, from what you said yes to. −${eur(up.reduce((n, e) => n + e.r.amt, 0))} in all.</p>
    ${Object.entries(months).map(([m, l]) => { const v = l.reduce((n, e) => n + e.r.amt, 0); return `<div class="yr"><span>${mname(+m)}</span><span class="hb"><i style="width:${v / mx * 100}%"></i></span><span style="text-align:right">−${eur(v)}</span></div>` }).join('')}
    <div class="caps" style="margin-top:6px">the once-a-year ones</div>
    ${yearly.map((e) => `<div class="kv"><span>${short(e.t)} · ${e.r.name} · ${e.r.what}</span><span>−${eur2(e.r.amt)}</span></div>`).join('')}`)
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet() })
render()
</script>
</body>
</html>
