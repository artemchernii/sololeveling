<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · fundamentals and news</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* The portfolio helper, the verdict (15 Oct). His words on the built
     SIGNALS tab: "suggestion based on current situation lets say 50 avg
     Bearish -6% and its good or bad time to add more shares … And kinda
     more animation", then "go verdict … technical + fundamentals + news
     … tell me overall idea what is the best to do". And on the tiles:
     "Worth now is a bit bland and empty, add $ there", "Down since JUN
     22 … rename it", "add maybe -% base on account like Revolut -5%
     (-40$)". Built from indicators.html (approved, built in #222).
     Sample Broadcom closes; tiles from his AVGO screenshot.
     16 Oct, built from verdict.html (approved, built in #224): the two
     NEXT feeds filled. FUNDAMENTALS — Yahoo readings, stored, each with
     its day — feed the rule (they can hold back an ADD, never make one).
     NEWS — headlines fetched on open, never stored — sit beside the
     verdict, not in the rule. The verdict moves above the tabs so it
     stays in view on every tab. */
  :root {
    --bg: #161826; --panel: rgba(255,255,255,.035);
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --ind-50: oklch(0.8 0.11 225); --ind-200: oklch(0.8 0.11 335); --ind-rsi: oklch(0.82 0.09 195);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
    --lift: 255,255,255;
    --glow: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%);
  }
  :root[data-theme="light"] {
    --bg: #f3f0ea; --panel: rgba(255,255,255,.72);
    --ink-100: #1c1b27; --ink-200: #2e2d3c; --ink-300: #4a4958; --ink-400: #666577; --ink-500: #7d7c8c; --ink-600: #a6a5b2;
    --lav-300: oklch(0.42 0.11 285); --lav-400: oklch(0.5 0.13 285);
    --good: oklch(0.5 0.14 155); --danger: oklch(0.52 0.19 25); --warn: oklch(0.58 0.15 70);
    --ind-50: oklch(0.55 0.12 225); --ind-200: oklch(0.55 0.13 335); --ind-rsi: oklch(0.55 0.1 195);
    --sys-edge: color-mix(in oklch, oklch(0.5 0.13 285) 40%, transparent);
    --lift: 30,28,45;
    --glow: radial-gradient(1200px 600px at 10% -10%, #e6e0f5 0%, transparent 60%);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: var(--glow), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh; padding: 20px 16px 60px; transition: background .3s }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none }
  .wrap { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-500) }
  .sys { position: relative; border-radius: 22px; padding: 20px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--sys-edge), 0 0 34px -18px var(--lav-400) }
  .num { font-variant-numeric: tabular-nums }
  @keyframes arrive { from { opacity: 0; translate: 0 4px } }
  @keyframes rise { from { opacity: 0; translate: 0 8px } }

  /* Head, as built (PositionHead + the price block). */
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: #cc092f; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(var(--lift),.1) }
  .logo svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round }
  .head h1 { font-size: 22px; font-weight: 400 } .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-500); margin-top: 5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: rgba(var(--lift),.07); color: var(--ink-300) }
  .badge.lav { background: color-mix(in oklch, var(--lav-400) 18%, transparent); color: var(--lav-300) }
  .badge.ring { background: none; color: var(--ink-100); box-shadow: inset 0 0 0 1px rgba(var(--lift),.22) } .badge.ring b { color: var(--lav-300); font-weight: 500 }
  .px { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 3px }
  .px .p1 { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end }
  .px .p1 b { font-size: 36px; line-height: 1; font-weight: 500; letter-spacing: -.02em } .px .p1 span { font-size: 18px; color: var(--ink-300) }
  .px .chg { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; justify-content: flex-end }
  .px .chg b { font-size: 15px; font-weight: 500; color: var(--good) } .px small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-400) }

  /* Tiles, as built (PositionTiles), with WORTH NOW in both currencies
     and P&L for UP/DOWN SINCE <day>. */
  .tiles { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr); gap: 10px; margin-top: 18px }
  .tile { display: flex; flex-direction: column; gap: 4px; border-radius: 14px; padding: 12px; background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(var(--lift),.07); animation: arrive .35s var(--ease) both; animation-delay: calc(var(--n) * 40ms) }
  .tile.good { background: color-mix(in srgb, var(--good) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--good) 30%, transparent) }
  .tile.danger { background: color-mix(in srgb, var(--danger) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 30%, transparent) }
  .lbl { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-300); min-height: 19px }
  .big { font-size: 27px; line-height: 1.15; font-variant-numeric: tabular-nums }
  .mid2 { font-size: 16px; color: var(--ink-300); font-variant-numeric: tabular-nums }
  .small { font-family: var(--mono); font-size: 11px; color: var(--ink-300) }
  .chip { align-self: flex-start; border-radius: 999px; background: rgba(var(--lift),.06); padding: 2px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300) }
  .ok { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--good) } .ok svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4 }
  .tone-good { color: var(--good) } .tone-danger { color: var(--danger) }
  .ud { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 500; letter-spacing: .12em; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent) }
  .pl { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap } .pl .pp { font-size: 16px; font-variant-numeric: tabular-nums }
  /* An account's P&L sits under its worth, in its colour. */
  .accpl { display: flex; justify-content: flex-end; margin: -2px 0 4px; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums }
  .acc { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; font-family: var(--mono); font-size: 12px }
  .acc > span:first-child { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-300) } .acc .nm2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .acc > span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums }
  .al { width: 15px; height: 15px; border-radius: 5px; display: grid; place-items: center; font-size: 8px; font-weight: 500; flex: none }
  .al.rv { background: #0a0a0a; color: #fff } .al.tr { background: #fff; color: #000; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15) }
  .sep { height: 1px; background: rgba(var(--lift),.07); margin: 4px 0 2px }

  /* Chart, as built. */
  .bar2 { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin: 18px 0 10px }
  .pills { display: flex; gap: 6px; flex-wrap: wrap }
  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 6px 11px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-400); box-shadow: inset 0 0 0 1px rgba(var(--lift),.12); transition: background .2s, color .2s, box-shadow .2s, transform .12s var(--ease) }
  .pill:hover { color: var(--ink-100); background: rgba(var(--lift),.06) } .pill:active { transform: scale(.96) }
  .pill.on { color: var(--ink-100); background: color-mix(in srgb, var(--lav-400) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lav-400) 60%, transparent) }
  .pill .sw { width: 12px; height: 0; border-top: 2px solid var(--c); opacity: .45; transition: opacity .2s } .pill .sw.dash { border-top-style: dashed } .pill .sw.dot2 { border-top-style: dotted }
  .pill.on .sw { opacity: 1 }
  .pill.ind.on { background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent) }
  .pill .va { font-size: 10px; letter-spacing: 0; animation: arrive .3s var(--ease) }
  .plot { position: relative; height: 340px; border-radius: 14px; overflow: hidden; transition: height .35s var(--ease) }
  .plot.rsi { height: 440px }
  #chart { position: absolute; inset: 0 }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); align-items: center }
  .keys > span { display: inline-flex; align-items: center; gap: 6px; animation: arrive .25s var(--ease) }
  .keys b { font-weight: 400; color: var(--ink-200); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap }
  .dot { width: 9px; height: 9px; border-radius: 99px; border: 2px solid } .ln { width: 14px; border-top: 2px solid var(--c) } .ln.dash { border-top-style: dashed }
  .keys .tv { margin-left: auto }

  /* Tabs and signal rows, as built (PositionSignals). */
  .tabs { display: flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid rgba(var(--lift),.08) }
  .tab { position: relative; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px 11px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); transition: color .2s }
  .tab:hover { color: var(--ink-200) } .tab.on { color: var(--ink-100) }
  .tab.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--lav-400); box-shadow: 0 0 10px var(--lav-400); animation: grow .3s var(--ease) }
  @keyframes grow { from { scale: 0 1 } }
  .tab .ct { display: inline-flex; gap: 6px; letter-spacing: .06em }
  .up-t { color: var(--good) } .dn-t { color: var(--danger) } .fl-t { color: var(--ink-400) }
  .sigs { display: flex; flex-direction: column; margin-top: 6px }
  .sig { --v: var(--ink-400); border-radius: 12px; animation: rise .35s var(--ease) both; animation-delay: calc(var(--n) * 50ms + 250ms) }
  .sig + .sig { border-top: 1px solid rgba(var(--lift),.06) }
  .sig.bull { --v: var(--good) } .sig.bear { --v: var(--danger) }
  .sh { display: grid; grid-template-columns: 30px 150px 132px 72px minmax(80px, 1fr); gap: 12px; align-items: center; width: 100%; padding: 11px 8px; text-align: left }
  .eye { width: 28px; height: 22px; border-radius: 7px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(var(--lift),.12); transition: background .2s, box-shadow .2s }
  .eye i { width: 14px; border-top: 2px solid var(--c); opacity: .5 } .eye i.dash { border-top-style: dashed } .eye i.dot2 { border-top-style: dotted }
  .eye.on { background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent) } .eye.on i { opacity: 1 }
  .nm { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-100); white-space: nowrap }
  .nm small { display: block; margin-top: 2px; font-size: 10px; letter-spacing: .08em; color: var(--ink-500) }
  .verdict { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 99px; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--v); background: color-mix(in srgb, var(--v) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--v) 45%, transparent) }
  svg.i { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .pc { font-size: 19px; color: var(--v); font-variant-numeric: tabular-nums; white-space: nowrap }
  .gauge { position: relative; height: 7px; border-radius: 99px; background: rgba(var(--lift),.08) }
  .gauge .z { position: absolute; top: 0; bottom: 0; border-radius: 99px }
  .gauge .mid { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1.5px; background: var(--ink-500) }
  /* The dot slides from the gauge's middle to today's place. */
  .gauge .mk { position: absolute; top: 50%; left: var(--x); width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 99px; background: var(--v); box-shadow: 0 0 0 3px color-mix(in srgb, var(--v) 25%, transparent), 0 0 12px var(--v); animation: slide .9s var(--ease) both; animation-delay: calc(var(--n) * 50ms + 450ms) }
  @keyframes slide { from { left: var(--x0, 50%); opacity: 0 } }

  /* THE VERDICT: one panel at the top of SIGNALS. Its colour is its
     word: ADD good, HOLD lavender, WAIT warn. The badge glows once when
     it arrives; the reasons arrive after it, one by one. */
  .vd { --c: var(--lav-400); position: relative; margin-top: 14px; border-radius: 16px; padding: 16px; background: color-mix(in srgb, var(--c) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent); animation: rise .4s var(--ease) both; overflow: hidden }
  .vd.add { --c: var(--good) } .vd.wait { --c: var(--warn) }
  .vd::before { content: ''; position: absolute; inset: 0; background: radial-gradient(420px 160px at 0% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%); pointer-events: none; animation: wash 1.6s ease-out both }
  @keyframes wash { 0% { opacity: 0 } 35% { opacity: 1 } 100% { opacity: .55 } }
  .vtop { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 16px; align-items: center }
  .vcap { position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 12px }
  .vcap .sp { flex: 1 }
  .vb { display: inline-flex; align-items: center; gap: 9px; padding: 10px 18px 10px 14px; border-radius: 14px; font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: .14em; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent); animation: pop .5s var(--ease) both .1s, glow 1.8s ease-out both .25s }
  .vb svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }
  @keyframes pop { from { scale: .7; opacity: 0 } 60% { scale: 1.06 } }
  @keyframes glow { 0% { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent), 0 0 0 0 color-mix(in srgb, var(--c) 60%, transparent) } 40% { box-shadow: inset 0 0 0 1.5px var(--c), 0 0 28px 6px color-mix(in srgb, var(--c) 45%, transparent) } 100% { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent), 0 0 0 0 transparent } }
  .vl { font-size: 15px; line-height: 1.5; color: var(--ink-100); animation: arrive .4s var(--ease) both .3s }
  .vl small { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-300); line-height: 1.4 }
  .why { position: relative; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px }
  .rc { --v: var(--ink-300); display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-200); background: rgba(var(--lift),.05); box-shadow: inset 0 0 0 1px rgba(var(--lift),.1); animation: arrive .35s var(--ease) both; animation-delay: calc(var(--n) * 90ms + 450ms) }
  .rc b { font-weight: 500; color: var(--v); font-variant-numeric: tabular-nums; letter-spacing: .02em }
  .rc.bull { --v: var(--good) } .rc.bear { --v: var(--danger) }
  /* A reason that made the call wears the verdict's ring. */
  .rc.key { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent) }
  .feeds { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(var(--lift),.1) }
  .fd { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase }
  .fd.live { color: var(--ink-100); background: rgba(var(--lift),.07) }
  .fd.next { color: var(--ink-500); box-shadow: inset 0 0 0 1px rgba(var(--lift),.14); border: 0; background-image: repeating-linear-gradient(135deg, rgba(var(--lift),.04) 0 6px, transparent 6px 12px) }
  .fd.next i { font-style: normal; padding: 0 6px; border-radius: 99px; background: color-mix(in srgb, var(--lav-400) 18%, transparent); color: var(--lav-300); letter-spacing: .1em }
  .rulebtn { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-400); padding: 4px 6px }
  .rulebtn:hover { color: var(--ink-100) } .rulebtn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; transition: rotate .25s var(--ease) } .rulebtn.on svg { rotate: 180deg }
  .rule { position: relative; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease) } .rule.on { grid-template-rows: 1fr }
  .rule > div { overflow: hidden }
  .rule table { width: 100%; margin-top: 10px; border-collapse: collapse; font-family: var(--mono); font-size: 11px; color: var(--ink-300) }
  .rule td { padding: 7px 8px; border-top: 1px solid rgba(var(--lift),.07); vertical-align: top } .rule td:first-child { width: 80px }
  .rule tr.me td { color: var(--ink-100); background: color-mix(in srgb, var(--c) 9%, transparent) }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 10px; font-weight: 500; letter-spacing: .12em; color: var(--t); background: color-mix(in srgb, var(--t) 16%, transparent) }

  /* Feeds: an input that is live is filled; news is outlined — shown,
     not in the rule. A fund has no fundamentals: dashed, struck grey. */
  .fd.live b { font-weight: 400; color: var(--ink-400); letter-spacing: .08em }
  .fd.beside { color: var(--ink-300); box-shadow: inset 0 0 0 1px rgba(var(--lift),.18) }
  .fd.beside b { font-weight: 400; color: var(--ink-500); letter-spacing: .08em }
  .fd.none { color: var(--ink-500); box-shadow: inset 0 0 0 1px rgba(var(--lift),.12); background-image: repeating-linear-gradient(135deg, rgba(var(--lift),.04) 0 6px, transparent 6px 12px) }
  .fd.fresh { animation: arrive .35s var(--ease) both; animation-delay: calc(var(--n) * 90ms + 700ms) }
  .rc.flat { --v: var(--ink-300) }
  .rc .src { font-weight: 400; color: var(--ink-500); letter-spacing: .06em }
  .rule tr.fx td:last-child::after { content: 'fundamentals'; margin-left: 8px; padding: 0 6px; border-radius: 99px; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--lav-300); background: color-mix(in oklch, var(--lav-400) 16%, transparent) }

  /* FUNDAMENTALS tab: rows in the SIGNALS anatomy; each says its source
     and day. A reading the rule does not read wears an ink badge. */
  .tabsrc { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 8px 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-500) }
  .tabsrc .sp { flex: 1 }
  .upd { display: inline-flex; align-items: center; gap: 6px; color: var(--lav-300) }
  .upd i { width: 7px; height: 7px; border-radius: 99px; background: var(--lav-400); animation: breathe 1.2s ease-in-out infinite }
  @keyframes breathe { 50% { opacity: .3; scale: .7 } }
  .fu { display: grid; grid-template-columns: 30px 150px 132px 104px minmax(80px, 1fr); gap: 12px; align-items: center; padding: 11px 8px }

/* P&L: UP or DOWN as a badge, the euros and the %, the day it counts

/* Chart: the built one, cut to what this mockup needs. A line arrives
   from the left edge of the view when its pill is pressed. */
const chart = LC.createChart(document.getElementById('chart'), {
  autoSize: true,
  layout: { background: { type: 'solid', color: 'transparent' }, fontFamily: 'JetBrains Mono, monospace', fontSize: 10, attributionLogo: true, panes: { separatorColor: 'rgba(128,128,150,.18)' } },
  grid: { vertLines: { visible: false } }, rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false, rightOffset: 2 },
  crosshair: { mode: LC.CrosshairMode.Magnet },
})
const DOLLARS = { type: 'custom', minMove: 0.01, formatter: (p) => '$' + p.toFixed(2) }
let series = [], fresh = null
function build() {
  for (const s of series) chart.removeSeries(s)
  series = []
  const { bars, S } = D, G = rgb(cssv('--good'))
  const main = chart.addSeries(LC.AreaSeries, { lineColor: G, lineWidth: 2, topColor: rgb(cssv('--good'), .2), bottomColor: rgb(cssv('--good'), 0), priceLineVisible: false, priceFormat: DOLLARS })
  main.setData(bars.map((b) => ({ time: b.time, value: b.close }))); series.push(main)
  const from = bars[Math.max(0, bars.length - 256)].time
  const add = (id, data, opt, pane) => {
    const s = chart.addSeries(LC.LineSeries, { lineWidth: 1.5, priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false, ...opt }, pane)
    series.push(s)
    if (fresh !== id) { s.setData(data); return s }
    /* Arriving: drawn from the view's left edge to today in 0.7 s. */
    const before = data.filter((d) => d.time < from), view = data.filter((d) => d.time >= from), t0 = performance.now()
    const step = (now) => { const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3); s.setData(before.concat(view.slice(0, Math.max(1, Math.round(view.length * e))))); if (k < 1) requestAnimationFrame(step) }
    s.setData(before); requestAnimationFrame(step)
    return s
  }
  if (on.avg && scen !== 'sold') add('avg', bars.filter((b) => b.time >= HELD.since).map((b) => ({ time: b.time, value: AVG_USD })), { color: rgb(cssv('--lav-400')), lineStyle: LC.LineStyle.Dashed, title: 'AVG BUY', priceFormat: DOLLARS })
  for (const n of [50, 200]) if (on[n]) add(String(n), S[n], { color: rgb(cssv(`--ind-${n}`)), title: `SMA ${n}`, priceFormat: DOLLARS })
  if (on.rsi) {
    const s = add('rsi', S.rsi, { color: rgb(cssv('--ind-rsi')), priceFormat: { type: 'custom', formatter: (v) => v.toFixed(0) }, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) }, 1)
    for (const v of [30, 70]) s.createPriceLine({ price: v, color: rgb(cssv('--ink-500'), .7), lineWidth: 1, lineStyle: LC.LineStyle.Dotted, axisLabelVisible: true, title: '' })
    const p = chart.panes()[1]; if (p) p.setHeight(innerWidth < 640 ? 80 : 100)
  }
  LC.createSeriesMarkers(main, scen === 'sold' ? [] : BUYS.map((t) => ({ time: bars.find((b) => b.time >= t).time, position: 'belowBar', shape: 'circle', color: G, size: 1 })))
  document.getElementById('plot').classList.toggle('rsi', on.rsi)
  const lav = rgb(cssv('--lav-400'), .5), lb = theme === 'dark' ? '#3a3566' : '#5b4fb0'
  chart.applyOptions({ layout: { textColor: rgb(cssv('--ink-500')) }, grid: { horzLines: { color: theme === 'dark' ? 'rgba(255,255,255,.05)' : 'rgba(30,28,45,.06)' } }, crosshair: { vertLine: { color: lav, labelBackgroundColor: lb }, horzLine: { color: lav, labelBackgroundColor: lb } } })
  fresh = null
}

const side = (d) => d >= 0 ? { cls: 'up', v: 'bull', arrow: '▲', icon: 'up' } : { cls: 'dn', v: 'bear', arrow: '▼', icon: 'down' }

  if (sold && tab !== 'signals' && tab !== 'trades') tab = 'signals'
  const fc = fx ? ['target', 'rev', 'rating'].map((k) => fx[k].v) : []
  const t = (id, label, ct) => `<button class="tab ${tab === id ? 'on' : ''}" onclick="setTab('${id}')">${label} ${ct}</button>`
  document.getElementById('tabs').innerHTML =
    t('signals', 'signals', `<span class="ct"><span class="up-t">${n('up')} ▲</span><span class="dn-t">${n('dn')} ▼</span><span class="fl-t">${n('fl')} —</span></span>`) +
    (sold ? '' : t('fund', 'fundamentals', fx ? `<span class="ct"><span class="up-t">${fc.filter((x) => x === 'bull').length} ▲</span><span class="dn-t">${fc.filter((x) => x === 'bear').length} ▼</span><span class="fl-t">${2 + fc.filter((x) => x === 'flat').length} —</span></span>` : '<span class="ct fl-t">fund</span>')) +
    (sold ? '' : t('news', 'news', `<span class="ct ${newsSt === 'failed' ? '' : 'fl-t'}" ${newsSt === 'failed' ? 'style="color:var(--warn)"' : ''}>${newsSt === 'slow' ? '<span class="upd"><i></i></span>' : newsSt === 'failed' ? '!' : newsOf().length}</span>`)) +
    t('trades', 'buys &amp; sells', `<span class="ct fl-t">${sold ? 7 : 5}</span>`)
  document.getElementById('tabbody').innerHTML = tab === 'fund' ? fundBody() : tab === 'news' ? newsBody() : tab === 'trades' ? '<div class="empty"><span class="ew caps">buys &amp; sells · as built</span></div>' : signalsBody()
}
function flip(id) {
  on[id] = !on[id]; if (on[id]) fresh = id
  const r = chart.timeScale().getVisibleRange(); build(); pills()
  for (const el of document.querySelectorAll('.eye')) el.classList.toggle('on', !!on[el.getAttribute('onclick').match(/'(.+)'/)[1]])
  if (r) chart.timeScale().setVisibleRange(r)
}
function bar() {
  document.getElementById('scen').innerHTML = [['add', 'add'], ['held', 'add held back · target'], ['hold', 'hold'], ['wait', 'wait'], ['fund', 'fund · no fundamentals'], ['sold', 'sold out · no verdict']].map(([s, l]) => `<button class="pill ${s === scen ? 'on' : ''}" onclick="setScen('${s}')">${l}</button>`).join('')
  document.getElementById('newsst').innerHTML = [['ok', 'news · 8'], ['empty', 'news · none'], ['failed', 'news · not loaded'], ['slow', 'slow load']].map(([s, l]) => `<button class="pill ${s === newsSt ? 'on' : ''}" onclick="setNews('${s}')">${l}</button>`).join('') + '<span style="width:10px"></span>' + ['dark', 'light'].map((t) => `<button class="pill ${t === theme ? 'on' : ''}" onclick="setTheme('${t}')">${t}</button>`).join('')
  document.getElementById('theme').innerHTML = ''
  document.getElementById('note').innerHTML = "Each state reads its verdict off its own sample closes and readings by the rule; nothing is picked by hand. The verdict now sits above the tabs, so it stays in view on every tab. Press FUNDAMENTALS or NEWS in the verdict's feeds row to jump to that tab. RULE shows the new fundamentals row."
}
function verdictBox() { document.getElementById('verdict').innerHTML = verdictPanel() }
function all() { load(); bar(); head(); tiles(); build(); span(); pills(); verdictBox(); tabs(); countUp(document.querySelector('.px')) }
function setScen(s) { scen = s; for (const k in on) on[k] = false; all() }
function setTheme(t) { theme = t; document.documentElement.dataset.theme = t; all() }
function setNews(s) { newsSt = s; bar(); verdictBox(); tabs() }
function setTab(t) { tab = t; tabs() }
all()
</script>
</body>
