<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasury one account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.78 0.17 150);
    --bad: oklch(0.68 0.2 22);
    --warn: oklch(0.79 0.15 75);
    --money: oklch(0.8 0.1 85);
    --glass: linear-gradient(155deg, rgba(233,233,237,.075), rgba(233,233,237,.02));
    --edge: rgba(233,233,237,.09);
    --shadow: inset 0 1px 0 rgba(233,233,237,.08), 0 24px 48px -28px rgba(0,0,0,.9);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #1f3140 0%, transparent 55%), var(--bg);
    color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 16px; }
  .mono { font-family: var(--mono); }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-400); }
  .good { color: var(--good) } .bad { color: var(--bad) } .dim { color: var(--ink-500) } .warn { color: var(--warn) }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  .between { justify-content: space-between }
  .veil .money { filter: blur(9px); user-select: none; }
  .money { transition: filter .25s ease; }

  /* Mockup controls — not part of the design */
  .ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; font-family: var(--mono); font-size: 11px; color: var(--warn); text-transform: uppercase; letter-spacing: .08em }
  .ctl button { font: inherit; color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-transform: uppercase }
  .ctl button.on { color: var(--ink-100); border-color: var(--warn) }

  /* The System window */
  .sys { position: relative; border-radius: 14px; border: 1px solid var(--sys-edge); padding: 20px;
    background: linear-gradient(160deg, rgba(181,171,252,.10), rgba(181,171,252,.02) 40%), var(--glass);
    box-shadow: var(--shadow), 0 0 40px -18px var(--shine); overflow: hidden; }
  .sys::before { content:''; position:absolute; inset:0; pointer-events:none; z-index: 1; background: repeating-linear-gradient(0deg, rgba(233,233,237,.022) 0 1px, transparent 1px 3px); }
  .sys::after { content:''; position:absolute; inset:-1px; border:2px solid var(--lav-400); border-radius:15px; pointer-events:none; z-index: 3;
    --r: 22px; mask: linear-gradient(#000 0 0) top left/var(--r) var(--r), linear-gradient(#000 0 0) top right/var(--r) var(--r), linear-gradient(#000 0 0) bottom left/var(--r) var(--r), linear-gradient(#000 0 0) bottom right/var(--r) var(--r); mask-repeat:no-repeat; filter: drop-shadow(0 0 5px var(--shine)); }
  .sys > * { position: relative; z-index: 2 }
  .sys-title { font-family: var(--mono); font-size: 12px; letter-spacing: .38em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 12px var(--shine); }

  /* His photo: the right half's ground, darkened so numbers read over it */
  .photo { position:absolute !important; z-index: 0 !important; inset: 0 0 0 38%;
    background: url(dollar.jpg) center / cover no-repeat;
    mask-image: linear-gradient(to left, #000 55%, transparent);
    opacity: .75; filter: saturate(.95) }
  .photo::after { content:''; position:absolute; inset:0; background: linear-gradient(to left, rgba(18,17,32,.55), rgba(18,17,32,.2)) }

  .top { border-bottom:1px solid rgba(181,171,252,.2); padding-bottom:12px }
  .checkin { display:inline-flex; align-items:center; gap:8px; font-family: var(--mono); font-size: 10.5px; letter-spacing:.1em; text-transform: uppercase; padding: 4px 6px 4px 10px; border-radius: 999px; cursor:pointer;
    color: var(--warn); border:1px solid color-mix(in oklch, var(--warn) 45%, transparent); background: color-mix(in oklch, var(--warn) 10%, transparent) }
  .checkin .who { display:flex }
  .checkin .who img, .checkin .who span { width: 18px; height: 18px; border-radius: 6px; margin-left: -4px; border: 1.5px solid #2a2436; background:#fff; object-fit: contain; padding: 1px }
  .checkin .who span { display:grid; place-items:center; background: #3a3348; color: var(--warn); font-size: 9px }
  .checkin.fresh { color: var(--good); border-color: color-mix(in oklch, var(--good) 35%, transparent); background: color-mix(in oklch, var(--good) 8%, transparent); padding-right: 10px }
  .eye { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--lav-400) 45%, transparent); background: rgba(181,171,252,.12); color: var(--ink-100); cursor: pointer }
  /* + add: solid, a light that runs round its edge, a slow breath, and a
     + that turns when you reach for it. */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false }
  .add { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 8px 17px 8px 14px; border-radius: 999px; border: 0; cursor: pointer;
    color: #1a1830; background: transparent; animation: breathe 3.2s ease-in-out infinite }
  .add::before { content:''; position:absolute; inset:-40%; z-index:-2;
    background: conic-gradient(from var(--a), var(--lav-400) 0 62%, #fff 74%, #e9e5ff 78%, var(--lav-400) 88%); animation: spin 2.6s linear infinite }
  .add::after { content:''; position:absolute; inset:1.5px; border-radius:999px; z-index:-1;
    background: linear-gradient(180deg, #c9c1fe, var(--lav-400)) }
  .add .shine { position:absolute; inset:0; z-index:-1; border-radius:999px; pointer-events:none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%); background-size: 250% 100%; animation: sweep 4.2s ease-in-out infinite }
  .add .plus { display:inline-block; font-size: 14px; line-height: 1; transition: transform .45s cubic-bezier(.3,1.7,.5,1) }
  .add:hover .plus { transform: rotate(180deg) scale(1.25) }
  .add:hover { animation-duration: 1.6s }
  .add:active { transform: scale(.96) }
  @keyframes spin { to { --a: 360deg } }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 14px -6px var(--shine) } 50% { box-shadow: 0 0 30px -2px var(--shine), 0 0 0 1px rgba(255,255,255,.08) } }
  @keyframes sweep { 0%, 55% { background-position: 150% 0 } 85%, 100% { background-position: -60% 0 } }
  .solid { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; padding: 9px 18px; border-radius: 999px; border: 0; cursor: pointer; background: var(--lav-400); color: #1a1830 }
  .ghost { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; cursor: pointer; background: none; color: var(--ink-200); border: 1px solid rgba(255,255,255,.16) }
  .ghost:hover { border-color: color-mix(in oklch, var(--lav-400) 55%, transparent) }

  /* Day one */
  .drop { display:flex; flex-direction:column; align-items:center; gap: 8px; padding: 26px 18px; border-radius: 16px; cursor:pointer; text-align:center;
    border: 1.5px dashed color-mix(in oklch, var(--lav-400) 50%, transparent); background: rgba(181,171,252,.05); transition: background .2s }
  .drop:hover { background: rgba(181,171,252,.1) }
  .drop .ico { font-size: 22px; color: var(--lav-400) }
  .found { display:flex; flex-direction:column; gap: 6px }
  .frow { display:grid; grid-template-columns: 20px 28px 1fr auto; align-items:center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); animation: arrive .35s cubic-bezier(.2,.8,.2,1) both }
  .frow img, .frow .ini { width: 28px; height: 28px; border-radius: 8px; background:#fff; object-fit: contain; padding: 2px }
  .frow .ini { display:grid; place-items:center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); padding:0 }
  .frow .t { display:flex; flex-direction:column; gap: 3px; min-width: 0 }
  .frow .t b { font-weight: 400; font-size: 14px }
  .frow .t span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-400) }
  .tick { width: 18px; height: 18px; border-radius: 6px; display:grid; place-items:center; font-size: 11px; background: var(--lav-400); color: #1a1830; cursor:pointer }
  .tick.off { background: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); color: transparent }
  .reading { display:flex; align-items:center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-300); padding: 8px 12px; border-radius: 10px; background: rgba(181,171,252,.06) }
  .spin { width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--lav-400); border-right-color: transparent; animation: turn .8s linear infinite }
  @keyframes turn { to { transform: rotate(360deg) } }
  @keyframes arrive { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
  .hand { display:grid; grid-template-columns: 28px 1fr 130px 130px; align-items:center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); animation: arrive .3s both }
  .hand img, .hand .ini { width: 28px; height: 28px; border-radius: 8px; background:#fff; object-fit: contain; padding: 2px }
  .hand .ini { display:grid; place-items:center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); padding:0 }
  .field { font-family: var(--mono); font-size: 12.5px; color: var(--ink-100); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 7px 9px; width: 100% }
  @media (max-width: 640px) { .hand { grid-template-columns: 28px 1fr; } .hand .field { grid-column: 2 } }

  .body { display:grid; grid-template-columns: 1fr; gap: 22px; margin-top: 18px }
  @media (min-width: 860px) { .body { grid-template-columns: 1.1fr 1fr; gap: 28px } }
  .big { font-size: 56px; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  @media (max-width: 520px) { .big { font-size: 42px } }
  .pill { display:inline-flex; align-items:center; gap:10px; padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.06); font-family: var(--mono); font-size: 15px; font-weight:500 }
  .split { display:flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 3px }
  .split > div { border-radius: 999px }
  .asof { font-family: var(--mono); font-size: 11px; color: var(--ink-500) }

  /* Right: where it is */
  .where { display:flex; flex-direction:column; gap: 14px; padding: 14px; border-radius: 14px;
    background: rgba(16,15,28,.34); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(3px) }
  .group { display:flex; flex-direction:column; gap: 4px }
  .ghead { display:flex; align-items:baseline; justify-content: space-between; gap: 8px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,.06) }
  .ghead .caps { display:flex; align-items:center; gap: 6px }
  .ghead .tot { font-family: var(--mono); font-size: 12.5px; color: var(--ink-200) }
  .acct { display:grid; grid-template-columns: 22px 1fr auto; align-items:center; gap: 9px; padding: 5px 4px; border-radius: 8px; cursor: pointer; font-size: 13px }
  .acct:hover { background: rgba(255,255,255,.04) }
  .acct img, .acct .ini { width: 22px; height: 22px; border-radius: 7px; background: #fff; object-fit: contain; padding: 2px }
  .acct .ini { display:grid; place-items:center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); font-size: 11px; padding: 0 }
  .acct .name { display:flex; align-items:center; gap: 6px; min-width: 0 }
  .acct .name b { font-weight: 400; white-space: nowrap; overflow:hidden; text-overflow: ellipsis }
  .stale { font-family: var(--mono); font-size: 9.5px; color: var(--warn); padding: 1px 5px; border-radius: 5px; background: color-mix(in oklch, var(--warn) 12%, transparent) }
  .amt { font-family: var(--mono); font-size: 12.5px; text-align: right; white-space: nowrap }
  .amt small { display:block; font-size: 10px; color: var(--ink-500) }
  .inv { display:grid; grid-template-columns: 22px 1fr 150px; align-items:center; gap: 9px; padding: 5px 4px; border-radius: 8px; cursor:pointer; font-size: 13px }
  .inv:hover { background: rgba(255,255,255,.04) }
  .inv img { width: 22px; height: 22px; border-radius: 7px; background: #fff; object-fit: contain; padding: 2px }
  .minis { display:flex; flex-direction:column; gap: 4px }
  .mini { display:flex; height: 5px; border-radius: 999px; overflow:hidden; gap: 2px; background: rgba(255,255,255,.05) }
  .mini > div { border-radius: 999px }
  .mininum { display:flex; justify-content: space-between; font-family: var(--mono); font-size: 11px }
  .legend { display:flex; gap: 12px; font-family: var(--mono); font-size: 10px; color: var(--ink-500); letter-spacing: .06em }

  /* Day one */
  .start { display:flex; flex-direction:column; gap: 16px; max-width: 560px }
  .start h2 { font-size: 30px; font-weight: 300; letter-spacing: -.01em }
  .banks { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
  .bank { display:flex; align-items:center; gap: 9px; padding: 9px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.035); cursor:pointer; font-size: 13.5px; color: var(--ink-100); text-align:left }
  .bank img, .bank .ini { width: 24px; height: 24px; border-radius: 7px; background:#fff; object-fit: contain; padding: 2px }
  .bank .ini { display:grid; place-items:center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); font-size: 11px; padding:0 }
  .bank.on { border-color: color-mix(in oklch, var(--lav-400) 60%, transparent); background: rgba(181,171,252,.14); box-shadow: 0 0 18px -8px var(--shine) }

  /* One account, set up */
  .steps { display:flex; flex-direction:column; gap: 14px }
  .step { display:flex; flex-direction:column; gap: 8px; padding: 14px; border-radius: 14px; background: rgba(16,15,28,.45); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(4px); animation: arrive .3s both }
  .step .n { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--lav-300) }
  .opts { display:flex; gap: 8px; flex-wrap: wrap }
  .opt { display:flex; align-items:center; gap: 8px; padding: 9px 13px; border-radius: 12px; cursor:pointer; font-size: 13.5px; color: var(--ink-200); background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.1) }
  .opt .i { font-size: 15px; width: 18px; text-align:center }
  .opt small { font-family: var(--mono); font-size: 10px; color: var(--ink-500) }
  .opt.on { color: var(--ink-100); border-color: color-mix(in oklch, var(--lav-400) 60%, transparent); background: rgba(181,171,252,.14); box-shadow: 0 0 18px -8px var(--shine) }
  .part { display:flex; flex-direction:column; gap: 8px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07) }
  .part .h { display:flex; align-items:center; gap: 8px; font-size: 13.5px }
  .part .h .src { margin-left:auto; font-family: var(--mono); font-size: 10px; color: var(--ink-500) }
  .line { display:grid; grid-template-columns: 74px 1fr 28px; gap: 8px; align-items:center }
  .cur { font-family: var(--mono); font-size: 12px; text-align:center; padding: 7px 0; border-radius: 9px; background: rgba(255,255,255,.06); color: var(--ink-200) }
  .x { color: var(--ink-500); background:none; border:0; cursor:pointer; font-size: 14px }
  .add-chips { display:flex; gap: 6px; flex-wrap: wrap }
  .mini-chip { font-family: var(--mono); font-size: 10.5px; padding: 4px 9px; border-radius: 999px; border: 1px dashed rgba(255,255,255,.2); color: var(--ink-300); background:none; cursor:pointer }
  .mini-drop { display:flex; align-items:center; gap: 10px; padding: 12px; border-radius: 10px; border: 1.5px dashed color-mix(in oklch, var(--lav-400) 45%, transparent); color: var(--ink-300); font-size: 13px; cursor:pointer }
  .mini-drop.done { border-style: solid; border-color: color-mix(in oklch, var(--good) 40%, transparent); color: var(--ink-100) }
  .acard { display:grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items:center; padding: 11px 13px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); animation: arrive .3s both }
  .acard img, .acard .ini { width: 30px; height: 30px; border-radius: 9px; background:#fff; object-fit: contain; padding: 2px }
  .acard .ini { display:grid; place-items:center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); padding:0 }
  .acard .t { display:flex; flex-direction:column; gap: 3px; min-width:0 }
  .acard .t span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-400); white-space: nowrap; overflow:hidden; text-overflow: ellipsis }

  /* The right half: three rows of fixed height, however many accounts */
  .where2 { display:flex; flex-direction:column; gap: 8px; align-self: stretch; justify-content: center }
  .grp { display:flex; flex-direction:column; gap: 7px; padding: 11px 13px; border-radius: 13px; cursor:pointer;
    background: rgba(16,15,28,.38); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(3px); transition: border-color .15s, transform .15s }
  .grp:hover { border-color: color-mix(in oklch, var(--lav-400) 45%, transparent); transform: translateX(-2px) }
  .gtop { display:flex; align-items:center; gap: 10px }
  .gtop .caps { flex: 1 }
  .gtot { font-family: var(--mono); font-size: 13.5px; color: var(--ink-100) }
  .chev { color: var(--ink-500); font-size: 16px; line-height: 1 }
  .gmid { display:flex; align-items:center; gap: 10px }
  .stack { display:flex; padding-left: 5px }
  .stack img, .stack span { width: 20px; height: 20px; border-radius: 6px; margin-left: -5px; border: 1.5px solid #221f33; background:#fff; object-fit: contain; padding: 1px; position: relative }
  .stack span { display:grid; place-items:center; background:#3a3348; color: var(--ink-200); font-family: var(--mono); font-size: 9px; padding: 0 }
  .stack .late { box-shadow: 0 0 0 1.5px var(--warn) }
  .segs { flex: 1; display:flex; gap: 2px; height: 6px }
  .segs > div { border-radius: 999px; min-width: 4px }
  .gsub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); white-space: nowrap }

  /* Modal */
  .scrim { position: fixed; inset: 0; z-index: 20; display:none; align-items:center; justify-content:center; padding: 16px;
    background: rgba(8,8,16,.62); backdrop-filter: blur(5px) }
  .scrim.on { display:flex; animation: fade .2s both }
  .sheet { width: min(760px, 100%); max-height: 88vh; overflow:auto; border-radius: 18px; padding: 20px;
    background: linear-gradient(160deg, rgba(181,171,252,.10), rgba(181,171,252,.02) 40%), #1b1a2c; border: 1px solid var(--sys-edge);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -18px var(--shine); animation: rise .28s cubic-bezier(.2,.8,.2,1) both }
  .sheet .shead { display:flex; align-items:center; justify-content: space-between; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid rgba(181,171,252,.2) }
  .sheet .close { width: 30px; height: 30px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: none; color: var(--ink-300); cursor: pointer; font-size: 15px }
  .sheet .body { margin-top: 0 }
  @keyframes fade { from { opacity: 0 } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985) } }
  .empty { display:flex; flex-direction:column; gap: 12px; max-width: 460px }
  .empty .big { color: var(--ink-600) }

  .notes { max-width: 1120px; margin: 0 auto; padding: 0 16px 60px; color: var(--ink-400); font-size: 13px; line-height: 1.6 }
  .notes h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lav-300); margin: 14px 0 6px }
  .notes li { margin-left: 18px }

  .top { flex-wrap: nowrap } .sys-title { white-space: nowrap }
  @media (max-width: 560px) { .top { flex-wrap: wrap; row-gap: 10px } }
  .one { display: grid; grid-template-columns: 1fr; gap: 22px; margin-top: 18px }
  @media (min-width: 860px) { .one { grid-template-columns: minmax(260px, 320px) 1fr; gap: 34px } }
  .lead { display: flex; flex-direction: column; gap: 14px }
  .who { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-200) }
  .who img { width: 24px; height: 24px; border-radius: 7px; background: #fff; padding: 2px; object-fit: contain }
  .who .mono { font-size: 11px; color: var(--ink-500) }
  .upd { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-200); padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: none }
  .month { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 16px; background: rgba(14,13,26,.62); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(6px) }
  .mhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap }
  .mhead .caps { flex: 1 }
  .chart { position: relative; height: 150px; margin-top: 14px; display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; align-items: stretch }
  .day { position: relative; display: flex; flex-direction: column; cursor: default }
  .day .up, .day .dn { display: flex; } .day .up { flex: var(--up, 1) } .day .dn { flex: var(--dn, 1) }
  .day .up { align-items: flex-end } .day .dn { align-items: flex-start }
  .day .up i, .day .dn i { width: 100%; border-radius: 3px; display: block; transform-origin: center; animation: grow .6s cubic-bezier(.2,.8,.2,1) both }
  .day .up i { background: var(--good); border-radius: 3px 3px 1px 1px; transform-origin: bottom }
  .day .dn i { background: var(--bad); border-radius: 1px 1px 3px 3px; transform-origin: top; opacity: .9 }
  .day.future .dn::before { content: ''; width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,.06) }
  .day.today::after { content: ''; position: absolute; inset: -4px -1px; border-radius: 5px; border: 1px solid color-mix(in oklch, var(--lav-400) 70%, transparent); box-shadow: 0 0 10px -2px var(--shine) }
  .day:hover .dn i, .day:hover .up i { filter: brightness(1.3) }
  .axis { position: absolute; left: 0; right: 0; top: calc(100% * var(--up, 1) / (var(--up, 1) + var(--dn, 1))); height: 1px; background: rgba(255,255,255,.12) }
  @keyframes grow { from { transform: scaleY(0) } }
  .ticks { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; font-family: var(--mono); font-size: 9.5px; color: var(--ink-600) }
  .tip { position: absolute; pointer-events: none; transform: translate(-50%, -110%); font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 8px; background: #24223a; border: 1px solid var(--sys-edge); white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 5 }
  .went { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--ink-200) }
  .chip b { font-weight: 400; color: var(--bad) }
  .chip.inv { border-style: dashed; border-color: color-mix(in oklch, var(--lav-400) 50%, transparent); color: var(--lav-300); background: rgba(181,171,252,.06); cursor: pointer; margin-left: auto }
  .okchip { display:inline-flex; align-items:center; gap:7px; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; color: var(--good); background: color-mix(in oklch, var(--good) 16%, transparent); border: 1px solid color-mix(in oklch, var(--good) 60%, transparent); box-shadow: 0 0 18px -4px var(--good) }

  .ctl button { font: inherit; color: var(--ink-300); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-transform: uppercase }
  .ctl button.on { color: var(--ink-100); border-color: var(--warn) }
  .day .up i.cap { position: relative; background: repeating-linear-gradient(0deg, var(--good) 0 6px, transparent 6px 8px) }
  .day .up i.cap::after { content: attr(data-l); position: absolute; left: 50%; bottom: calc(100% + 3px); transform: translateX(-50%); font-family: var(--mono); font-size: 10px; color: var(--good); white-space: nowrap }
  .quiet { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-400); text-align: center; pointer-events: none }
  .invline { position: absolute; inset: 0; pointer-events: none }
  .accts { display: flex; flex-direction: column; gap: 6px }
  .acc { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: center; font-size: 13px }
  .acc img, .acc .ini { width: 22px; height: 22px; border-radius: 6px; background: #fff; padding: 2px; object-fit: contain }
  .acc .ini { display: grid; place-items: center; background: rgba(159,217,180,.14); color: #9fd9b4; font-family: var(--mono); font-size: 11px; padding: 0 }
  .acc .mono { font-size: 12px; text-align: right }
  .acc .mono small { display: block; font-size: 10px; color: var(--ink-500) }
  .chip .g { color: var(--good) } .chip .r { color: var(--bad) }
  .chip img { width: 16px; height: 16px; border-radius: 4px; background: #fff; padding: 1px }
  .legend2 { display: flex; gap: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle }
</style></head>
<body>
<div class="wrap">
  <div class="ctl">mockup · sample numbers · pick a situation:
    <button data-s="quiet">quiet month</button><button data-s="out" class="on">only out (you now)</button><button data-s="salary">salary came in</button><button data-s="invest">with investments</button><button data-s="many">several accounts</button>
  </div>
  <section class="sys">
    <div class="photo"></div>
    <div class="row between top">
      <span class="sys-title">[ treasury ]</span>
      <div class="row" id="chipbox"></div>
    </div>
    <div class="one">
      <div class="lead" id="lead"></div>
      <div class="month" id="month"></div>
    </div>
  </section>
  <div class="notes" id="notes"></div>
</div>
<script>
const L = (d) => `https://www.google.com/s2/favicons?domain=${d}&sz=128`
const T = (s) => `https://financialmodelingprep.com/image-stock/${s}.png`
const eur = (n, sign) => (sign && n > 0 ? '+' : n < 0 ? '−' : '') + '€' + Math.abs(n).toLocaleString('en', { minimumFractionDigits: Math.abs(n) < 1000 ? 2 : 0, maximumFractionDigits: Math.abs(n) < 1000 ? 2 : 0 })
const OUT = { 2: 23.4, 3: 8.9, 5: 19.99, 6: 41.2, 7: 6.99, 9: 14.5, 11: 48.3, 12: 18.75, 15: 52, 17: 9.4, 18: 27.1, 20: 13.99, 21: 11.2, 23: 19.8 }
const k = 316.64 / Object.values(OUT).reduce((a, b) => a + b); for (const d in OUT) OUT[d] = +(OUT[d] * k).toFixed(2)
const S = {
  quiet: { total: 799.47, cash: 799.47, inv: 0, ins: {}, outs: {}, last: -412.3, accounts: 1,
    went: [], note: 'Nothing moved yet this month. The chart keeps every day’s slot and says so in words — with last month’s total to compare, from your rows.' },
  out: { total: 799.47, cash: 799.47, inv: 0, ins: {}, outs: OUT, accounts: 1,
    went: [['groceries', 142.1], ['eating out', 83.4], ['transport', 44.2]], note: 'Only money out: the line sits at the top, bars hang down using the whole height.' },
  salary: { total: 2939.47, cash: 2939.47, inv: 0, ins: { 1: 2140 }, outs: OUT, accounts: 1,
    went: [['groceries', 142.1], ['eating out', 83.4], ['transport', 44.2]], note: 'Salary is 7× a big spending day. One scale would flatten every other bar, so it is drawn to the top and broken, with its amount on it — the rest keep their shape. Both halves share one scale below the break.' },
  invest: { total: 13279.47, cash: 799.47, inv: 12480, pnl: 1906, put: 10574, ins: { 1: 2140 }, outs: OUT, accounts: 2, worth: true,
    went: [['groceries', 142.1], ['eating out', 83.4]], holds: [['NFLX', 41], ['AMZN', 12], ['UBER', -4]], note: 'With investments: the split bar comes back (it now compares something), profit against what you put in sits by the total, and a lavender line on the month shows what they were worth each night — stored closes, never fetched at render.' },
  many: { total: 50962, cash: 25568, inv: 25394, pnl: 6714, put: 18680, ins: { 1: 3150 }, outs: Object.fromEntries(Object.entries(OUT).map(([d, v]) => [d, +(v * 6).toFixed(2)])), accounts: 6, worth: true,
    went: [['rent', 850], ['groceries', 412], ['eating out', 233]], holds: [['NFLX', 41], ['AMZN', 12], ['VUAA', 9]], note: 'Several accounts: the left grows a short list — each account, its balance, how fresh — instead of one line. The month stays the same size: it is the same question.' },
}
let cur = 'out'
function render() {
  const s = S[cur]
  const month = Object.values(s.ins).reduce((a, b) => a + b, 0) - Object.values(s.outs).reduce((a, b) => a + b, 0)
  const inSum = Object.values(s.ins).reduce((a, b) => a + b, 0), outSum = Object.values(s.outs).reduce((a, b) => a + b, 0)
  document.getElementById('chipbox').innerHTML = `${s.accounts > 3 ? '<span class="checkin">check-in · 2 to update</span>' : '<span class="okchip">✓ up to date</span>'}<button class="eye">show</button><button class="add"><span class="shine"></span><span class="plus">+</span> add</button>`
  const who = s.accounts > 3
    ? `<div class="accts">${[['revolut.com', 'Revolut', 15802, 'read 2d ago'], ['bancobpi.pt', 'BPI', 1950, 'typed 3d ago'], ['traderepublic.com', 'Trade Republic', 5180, '<span class="warn">12d ago</span>'], ['trading212.com', 'Trading 212', 23800, 'synced 4 min ago']].map(([d, n, v, f]) => `<div class="acc"><img src="${L(d)}"><span>${n}</span><span class="mono money">€${v.toLocaleString()}<small>${f}</small></span></div>`).join('')}<div class="acc"><span class="ini">€</span><span>Notes</span><span class="mono money">€4,250<small>counted 21d ago</small></span></div></div>`
    : `<div class="who"><img src="${L('revolut.com')}"><span>Revolut <span class="mono">· ${s.accounts === 2 ? 'bank + broker · ' : ''}read today</span></span><button class="upd">update</button></div>`
  document.getElementById('lead').innerHTML = `
    <span class="caps">capital · cash · investments</span>
    <span class="big money">${eur(s.total)}</span>
    ${s.pnl ? `<span class="mono" style="font-size:13px"><span class="good money">${eur(s.pnl, true)} · +${(s.pnl / s.put * 100).toFixed(1)}%</span> <span class="dim">on ${eur(s.put)} invested</span></span>` : ''}
    <div class="row">
      <span class="pill"><span class="money ${month > 0 ? 'good' : month < 0 ? 'bad' : ''}">${month ? eur(month, true) : '€0'}</span><span class="dim" style="font-size:12px">this month</span></span>
      ${inSum || outSum ? `<span class="pill"><span class="money good">+${eur(inSum)}</span><span class="money bad">−${eur(outSum)}</span><span class="dim" style="font-size:12px">in · out</span></span>` : ''}
    </div>
    ${s.inv ? `<div class="split"><div style="flex:${s.cash};background:var(--money)"></div><div style="flex:${s.inv};background:var(--lav-400)"></div></div><div class="row between mono" style="font-size:12px"><span>● free cash <span class="money">${eur(s.cash)}</span></span><span style="color:var(--lav-300)">● invested <span class="money">${eur(s.inv)}</span></span></div>` : ''}
    ${who}`
  const maxOut = Math.max(0, ...Object.values(s.outs)), maxIn = Math.max(0, ...Object.values(s.ins))
  const capAt = maxOut * 1.6
  const upScale = maxIn ? Math.min(maxIn, capAt) : 0
  const days = Array.from({ length: 30 }, (_, i) => {
    const d = i + 1, o = s.outs[d] || 0, n = s.ins[d] || 0
    const cls = 'day' + (d > 27 ? ' future' : '') + (d === 27 ? ' today' : '')
    const up = n ? `<i class="${n > capAt ? 'cap' : ''}" data-l="+${eur(n)}" style="height:${Math.min(n, capAt) / upScale * 100}%;animation-delay:${i * 18}ms"></i>` : ''
    const dn = o ? `<i style="height:${o / maxOut * 100}%;animation-delay:${i * 18}ms"></i>` : ''
    return `<div class="${cls}" data-d="${d}" data-o="${o}" data-n="${n}"><div class="up">${up}</div><div class="dn">${dn}</div></div>`
  }).join('')
  const upF = upScale ? upScale : 0, dnF = maxOut ? maxOut : (upF ? 0 : 1)
  const worth = s.worth ? (() => { const pts = Array.from({ length: 27 }, (_, i) => 30 + Math.sin(i / 3) * 8 + i * 0.9 + (i % 5 === 0 ? -4 : 0)); return `<svg class="invline" viewBox="0 0 300 100" preserveAspectRatio="none"><polyline fill="none" stroke="var(--lav-400)" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${pts.map((v, i) => `${(i + 0.5) * 10},${100 - v}`).join(' ')}"/></svg>` })() : ''
  const ticks = Array.from({ length: 30 }, (_, i) => `<span>${[1, 8, 15, 22, 27, 30].includes(i + 1) ? i + 1 : ''}</span>`).join('')
  const went = s.went.map(([c, v]) => `<span class="chip">${c} <b class="money">${eur(v)}</b></span>`).join('') + (s.went.length ? '<span class="chip">+4 more</span>' : '')
  const holds = s.holds ? s.holds.map(([t, p]) => `<span class="chip"><img src="${T(t)}">${t} <span class="${p >= 0 ? 'g' : 'r'}">${p >= 0 ? '+' : '−'}${Math.abs(p)}%</span></span>`).join('') : ''
  document.getElementById('month').innerHTML = `
    <div class="mhead"><span class="caps">september, day by day</span>
      <span class="legend2">${inSum ? '<span><i style="background:var(--good)"></i>in</span>' : ''}${outSum ? '<span><i style="background:var(--bad)"></i>out</span>' : ''}${s.worth ? '<span><i style="background:var(--lav-400)"></i>investments, each night</span>' : ''}<span>3 days left</span></span></div>
    <div class="chart" id="chart" style="--up:${upF};--dn:${dnF}">${outSum || inSum ? '<div class="axis"></div>' : ''}${days}${worth}${!outSum && !inSum ? `<div class="quiet">nothing moved yet this month<br><span class="dim">August: ${eur(s.last)}</span></div>` : ''}<div class="tip" id="tip"></div></div>
    <div class="ticks">${ticks}</div>
    <div class="went">${went}${holds ? `<span class="chip" style="border:0;background:none;padding:0 2px;color:var(--ink-500)">·</span>${holds}` : ''}${s.inv ? '' : `<span class="chip inv">+ investments</span>`}</div>`
  document.getElementById('notes').innerHTML = `<h3>${document.querySelector(`.ctl button[data-s=${cur}]`).textContent}</h3><p>${s.note}</p>`
  const tip = document.getElementById('tip')
  document.querySelectorAll('.day').forEach((d) => {
    d.onmouseenter = () => { const o = +d.dataset.o, n = +d.dataset.n; tip.textContent = `Sep ${d.dataset.d} · ${[n ? '+' + eur(n) : '', o ? '−' + eur(o) : ''].filter(Boolean).join(' ') || (d.classList.contains('future') ? 'to come' : 'nothing moved')}`; tip.style.left = (d.offsetLeft + d.offsetWidth / 2) + 'px'; tip.style.top = '0px'; tip.style.opacity = 1 }
    d.onmouseleave = () => tip.style.opacity = 0
  })
}
document.querySelectorAll('.ctl button').forEach((b) => b.onclick = () => { cur = b.dataset.s; document.querySelectorAll('.ctl button').forEach((x) => x.classList.toggle('on', x === b)); render() })
document.addEventListener('click', (e) => { if (e.target.classList.contains('eye')) document.body.classList.toggle('veil') })
render()
</script>
</body></html>
