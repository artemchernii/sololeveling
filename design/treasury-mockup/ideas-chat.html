<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IDEAS chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* IDEAS as a conversation (29 Oct, his "discuss with chat this page …
     get some DATA, IDEAS, CHARTS" and "why add that 🌐 icon, we need by
     default search"). The three idea cards stay on top, folded; under
     them a chat whose answers are blocks: text, charts, cards, a table.
     The model fetches what it needs while it answers (Yahoo, web, ECB),
     nothing stored. His question and CLOSE moves are real; the rest of
     the answer is a sample. */
  :root {
    --bg: #f4f2ef;
    --ink-100: #1d1d2b; --ink-200: #33334a; --ink-300: #55556c; --ink-400: #7a7a90; --ink-500: #9a9aae;
    --lav-300: #6b5fd6; --lav-400: #8b7ff0;
    --good: oklch(0.58 0.16 150); --bad: oklch(0.58 0.2 22); --warn: oklch(0.66 0.15 70);
    --glass: linear-gradient(155deg, rgba(255,255,255,.88), rgba(255,255,255,.62));
    --edge: rgba(30,30,50,.09);
    --shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 18px 40px -28px rgba(30,30,60,.35);
    --sys-edge: color-mix(in oklch, #8b7ff0 40%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --gold: oklch(0.7 0.13 85); --usd: oklch(0.6 0.12 250); --eur: oklch(0.6 0.13 300); --brl: oklch(0.62 0.15 150);
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1000px 500px at 10% -10%, #e9e4f7 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #f6ead8 0%, transparent 55%), var(--bg);
    color: var(--ink-100); font: 13px/1.45 Inter, system-ui, sans-serif; min-height: 100vh }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 120px; display:flex; flex-direction:column; gap: 14px }
  .caps { font: 500 9.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-400) }
  .num { font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums }
  .row { display:flex; align-items:center; gap: 8px } .grow { flex: 1; min-width: 0 }
  .wrapr { flex-wrap: wrap }

  .ctl { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; font: 11px var(--mono); color: var(--warn); letter-spacing: .08em; text-transform: uppercase }
  .ctl button { font: inherit; color: var(--ink-300); background: rgba(255,255,255,.6); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; cursor: pointer; text-transform: uppercase }
  .ctl button.on { color: var(--ink-100); border-color: var(--warn) }

  .tabs { display:grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px; border-radius: 14px; border: 1px solid var(--edge); background: var(--glass) }
  .tab { display:flex; align-items:center; justify-content:center; gap: 8px; padding: 9px; border-radius: 10px; font: 700 10.5px var(--mono); letter-spacing: .16em; color: var(--ink-200) }
  .tab .n { width: 18px; height: 18px; border-radius: 5px; display:grid; place-items:center; font-size: 9.5px; color: var(--lav-300); border: 1px solid var(--sys-edge) }
  .tab.on { background: color-mix(in oklch, var(--lav-400) 14%, transparent); border: 1px solid var(--sys-edge) }
  @media (max-width: 700px) { .tabs { grid-template-columns: repeat(3, 1fr) } }
  .pill { font: 700 9px var(--mono); letter-spacing: .1em; padding: 3px 7px; border-radius: 999px; border: 1px solid currentColor; text-transform: uppercase; white-space: nowrap; display:inline-flex; align-items:center; gap: 4px }
  .pill.good { color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent) }
  .pill.bad { color: var(--bad); background: color-mix(in oklch, var(--bad) 10%, transparent) }
  .pill.lav { color: var(--lav-300); background: color-mix(in oklch, var(--lav-400) 10%, transparent) }
  .pill.ink { color: var(--ink-300); background: rgba(30,30,50,.04) }
  .pill.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 10%, transparent) }

  .tile { border-radius: 14px; border: 1px solid var(--edge); background: var(--glass); box-shadow: var(--shadow); padding: 14px 16px }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: #fff; border: 1px solid var(--edge); display:grid; place-items:center; overflow:hidden; flex: none }
  .logo img { width: 18px; height: 18px }

  /* the three ideas, folded */
  .strip { display:flex; gap: 8px; align-items:center; flex-wrap: wrap }
  .mini { display:flex; align-items:center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 11px; border: 1px solid var(--edge); background: rgba(255,255,255,.7) }
  .mini b { font: 700 12px var(--mono) }

  /* the chat */
  .chat { display:flex; flex-direction:column; gap: 16px; padding: 16px; border-radius: 16px; border: 1px solid var(--sys-edge); background: var(--glass); box-shadow: var(--shadow), 0 0 30px -18px var(--lav-400) }
  .chead { display:flex; align-items:center; gap: 8px; flex-wrap: wrap }
  .chead .t { font: 700 11px var(--mono); letter-spacing: .3em; color: var(--lav-300) }
  .q { align-self: flex-end; max-width: 78%; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: color-mix(in oklch, var(--lav-400) 16%, white); border: 1px solid var(--sys-edge); font-size: 13.5px; font-weight: 500 }
  .a { display:flex; flex-direction:column; gap: 12px; animation: up .45s cubic-bezier(.2,.8,.2,1) both }
  @keyframes up { from { opacity: 0; transform: translateY(8px) } }
  .a > * { animation: up .45s cubic-bezier(.2,.8,.2,1) both }
  .a > *:nth-child(2) { animation-delay: .06s } .a > *:nth-child(3) { animation-delay: .12s } .a > *:nth-child(4) { animation-delay: .18s } .a > *:nth-child(5) { animation-delay: .24s } .a > *:nth-child(6) { animation-delay: .3s } .a > *:nth-child(7) { animation-delay: .36s }

  .steps { display:flex; gap: 6px; flex-wrap: wrap }
  .step { font: 500 10px var(--mono); letter-spacing: .06em; padding: 4px 8px; border-radius: 7px; background: rgba(30,30,50,.04); color: var(--ink-300); display:inline-flex; gap: 6px; align-items:center }
  .step.live { color: var(--lav-300); background: color-mix(in oklch, var(--lav-400) 10%, transparent) }
  .step.live::before { content:''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1s infinite }
  @keyframes blink { 50% { opacity: .2 } }

  .say { font-size: 14px; line-height: 1.65; color: var(--ink-200); max-width: 820px }
  .say b { color: var(--ink-100) }
  .blocks { display:grid; grid-template-columns: repeat(12, 1fr); gap: 10px }
  .c4 { grid-column: span 4 } .c6 { grid-column: span 6 } .c12 { grid-column: span 12 }
  @media (max-width: 860px) { .c4, .c6 { grid-column: span 12 } }
  .bhead { display:flex; align-items:center; gap: 8px; margin-bottom: 10px }
  .bhead .t { font: 700 10px var(--mono); letter-spacing: .16em; color: var(--ink-200) }

  /* moves today, as CLOSE shows them */
  .mv { display:grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; align-items:center; padding: 7px 0; border-top: 1px solid var(--edge) }
  .mv:first-of-type { border-top: 0 }
  .mv .nm { font-weight: 600 } .mv .sub { font: 10px var(--mono); color: var(--ink-400) }
  .mv .e { font: 700 12px var(--mono) }

  /* charts */
  svg.ch { width: 100%; height: 120px; display:block; overflow: visible }
  svg.ch .grid line { stroke: rgba(30,30,50,.07) }
  svg.ch polyline { fill: none; stroke-width: 2; stroke-linejoin: round }
  svg.ch .lab { font: 9px var(--mono); fill: var(--ink-400) }
  .legend { display:flex; gap: 12px; flex-wrap: wrap; margin-top: 6px }
  .legend span { display:inline-flex; gap: 6px; align-items:center; font: 600 10px var(--mono); color: var(--ink-300) }
  .legend i { width: 14px; height: 3px; border-radius: 2px; background: var(--c) }

  /* table */
  .tbl { width: 100%; border-collapse: collapse; font: 12px var(--mono) }
  .tbl td { padding: 6px 4px; border-top: 1px solid var(--edge) }
  .tbl tr:first-child td { border-top: 0 }
  .tbl td:last-child, .tbl td:nth-child(3) { text-align: right }
  .tbl .bar { height: 6px; border-radius: 3px; background: var(--c) }

  /* options across markets */
  .opt { display:flex; flex-direction:column; gap: 8px }
  .opt .tk { font: 700 13px var(--mono) }
  .case { display:grid; grid-template-columns: 20px 1fr; gap: 7px; font-size: 12px; color: var(--ink-200) }
  .case i { font-style: normal; width: 20px; height: 20px; border-radius: 6px; display:grid; place-items:center; font: 700 10px var(--mono) }
  .case .bu { color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent) }
  .case .be { color: var(--bad); background: color-mix(in oklch, var(--bad) 14%, transparent) }
  .case .wr { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent) }
  .sr { display:flex; gap: 6px; flex-wrap: wrap }

  .srcs { display:flex; gap: 6px; flex-wrap: wrap; align-items:center }
  .src { font: 500 10px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--edge); color: var(--ink-300); background: rgba(255,255,255,.7) }
  .meta { display:flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items:center; padding-top: 10px; border-top: 1px dashed var(--edge); font: 10px var(--mono); color: var(--ink-400); letter-spacing: .08em }
  .sugg { display:flex; gap: 6px; flex-wrap: wrap }
  .sugg span { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--sys-edge); color: var(--lav-300); cursor: pointer }
  .askbar { display:flex; gap: 8px; align-items:center; position: sticky; bottom: 12px; padding: 8px; border-radius: 999px; border: 1px solid var(--sys-edge); background: rgba(255,255,255,.92); box-shadow: 0 10px 30px -14px rgba(60,40,140,.4) }
  .askbar input { flex: 1; min-width: 0; border: 0; background: transparent; font: 14px Inter, sans-serif; padding: 6px 10px; outline: none; color: var(--ink-100) }
  .askbar button { font: 700 10px var(--mono); letter-spacing: .14em; padding: 9px 16px; border-radius: 999px; border: 0; color: #fff; background: var(--lav-300); cursor: pointer }
  .empty { text-align:center; padding: 30px 10px; display:flex; flex-direction:column; gap: 12px; align-items:center }
  .skel { height: 110px; border-radius: 12px; background: linear-gradient(90deg, rgba(30,30,50,.04), rgba(30,30,50,.09), rgba(30,30,50,.04)); background-size: 200% 100%; animation: sh 1.2s infinite }
  @keyframes sh { to { background-position: -200% 0 } }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctl">mockup · state
    <button data-s="answer" class="on">answer</button>
    <button data-s="asking">asking</button>
    <button data-s="empty">no question yet</button>
  </div>

  <div class="tabs">
    <div class="tab"><span class="n">1</span>MARKET <span class="pill good">S&amp;P ▲ 0.5%</span></div>
    <div class="tab"><span class="n">2</span>READ <span class="pill lav">5 LINES</span></div>
    <div class="tab"><span class="n">3</span>MINE <span class="pill good">9 ADD</span></div>
    <div class="tab on"><span class="n">4</span>IDEAS <span class="pill ink">3</span></div>
    <div class="tab"><span class="n">5</span>CLOSE <span class="pill bad">▼ 0.6%</span></div>
  </div>

  <div class="tile strip">
    <span class="caps">💡 Ideas · 3</span>
    <span class="mini"><span class="logo"><img src="https://www.google.com/s2/favicons?domain=lilly.com&sz=64"></span><b>LLY</b><span class="pill ink">💊 5% · 9%</span><span class="pill bad">OVERBOUGHT</span></span>
    <span class="mini"><span class="logo"><img src="https://www.google.com/s2/favicons?domain=vanguard.com&sz=64"></span><b>VEUR</b><span class="pill ink">🇪🇺 2% · 15%</span><span class="pill good">BULLISH</span></span>
    <span class="mini"><span class="logo"><img src="https://www.google.com/s2/favicons?domain=pg.com&sz=64"></span><b>PG</b><span class="pill ink">🧴 0% · 6%</span><span class="pill ink">NEUTRAL</span></span>
    <span class="grow"></span><span class="pill lav">OPEN ▾</span>
  </div>

  <section class="chat">
    <div class="chead">
      <span class="t">[ ASK ]</span>
      <span class="pill lav">⚡ PRO · SONNET 5.5</span>
      <span class="pill ink">🌐 WEB · ALWAYS</span>
      <span class="pill ink">📈 YAHOO</span>
      <span class="pill ink">🏦 ECB</span>
      <span class="grow"></span>
      <span class="pill warn">RESEARCH · NOT ADVICE</span>
    </div>
    <div id="thread" style="display:flex;flex-direction:column;gap:16px"></div>
    <div class="askbar"><input placeholder="Ask about MINE, a market, an idea…" /><button>ASK</button></div>
  </section>
</div>

<script>
const Q = 'Amazon and Google fell badly today and the euro is in danger with the debt crisis in Europe. What do I do with my money? Ideas beyond the S&P 500: gold, bonds, other markets, Brazil.'

function line(points, c) {
  const xs = points.length - 1
  const lo = Math.min(...points), hi = Math.max(...points)
  const p = points.map((v, i) => `${(i / xs) * 300},${100 - ((v - lo) / (hi - lo || 1)) * 90}`).join(' ')
  return `<polyline points="${p}" style="stroke:${c}"/>`
}
function series(seed, drift, n = 120) {
  let x = seed * 9301 + 49297
  const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280)
  const o = []; let v = 100
  for (let i = 0; i < n; i++) { v += (rnd() - 0.5) * 2.2 + drift; o.push(v) }
  return o
}
function chart(lines, labs) {
  return `<svg class="ch" viewBox="0 0 300 108" preserveAspectRatio="none">
    <g class="grid"><line x1="0" x2="300" y1="10" y2="10"/><line x1="0" x2="300" y1="55" y2="55"/><line x1="0" x2="300" y1="100" y2="100"/></g>
    ${lines.map(([s, c]) => line(s, c)).join('')}
  </svg><div class="legend">${labs.map(([t, c]) => `<span style="--c:${c}"><i></i>${t}</span>`).join('')}</div>`
}
const fav = (d) => `<span class="logo"><img src="https://www.google.com/s2/favicons?domain=${d}&sz=64"></span>`

const ANSWER = `
<div class="steps">
  <span class="step">🌐 SEARCHED · euro debt news 14 days</span>
  <span class="step">🌐 SEARCHED · alphabet earnings</span>
  <span class="step">📈 FETCHED · EURUSD=X 1Y</span>
  <span class="step">📈 FETCHED · GC=F 1Y</span>
  <span class="step">📈 FETCHED · EWZ · IB01 · VEUR</span>
  <span class="step">🏦 FETCHED · ECB rate</span>
  <span class="step">⏱ 14 s</span>
</div>

<p class="say">Today's drop is <b>two companies, not the market</b>: Alphabet fell on its results, Amazon on its cash flow, while the S&amp;P 500 moved 0.3%. On the euro: about <b>72% of MINE is in US assets</b>, priced in dollars — <b>if the euro falls, those rise in euros</b>. The real exposure is the euro cash in the banks. Three directions below, each with what would make it wrong.</p>

<div class="blocks">
  <div class="tile c6">
    <div class="bhead"><span>📊</span><span class="t">TODAY · FROM CLOSE</span><span class="grow"></span><span class="caps">mine</span></div>
    <div class="mv">${fav('google.com')}<span><div class="nm">Alphabet GOOGL</div><div class="sub">WAS $324.89 · NOW $283.82</div></span><span class="e bad" style="color:var(--bad)">−€104.87</span><span class="pill bad">▼ 12.6%</span></div>
    <div class="mv">${fav('google.com')}<span><div class="nm">Alphabet GOOG</div><div class="sub">WAS $321.89 · NOW $282.32</div></span><span class="e" style="color:var(--bad)">−€44.23</span><span class="pill bad">▼ 12.3%</span></div>
    <div class="mv">${fav('amazon.com')}<span><div class="nm">Amazon AMZN</div><div class="sub">WAS $254.60 · NOW $243.79</div></span><span class="e" style="color:var(--bad)">−€56.86</span><span class="pill bad">▼ 4.2%</span></div>
    <div class="mv"><span class="logo">🇺🇸</span><span><div class="nm">S&amp;P 500</div><div class="sub">WAS 7,744 · NOW 7,720</div></span><span></span><span class="pill bad">▼ 0.3%</span></div>
  </div>

  <div class="tile c6">
    <div class="bhead"><span>💶</span><span class="t">MINE · BY CURRENCY</span><span class="grow"></span><span class="caps">sample €</span></div>
    <table class="tbl">
      <tr><td>🇺🇸 USD</td><td style="width:40%"><div class="bar" style="--c:var(--usd);width:72%"></div></td><td>72%</td><td>€46,560</td></tr>
      <tr><td>🇪🇺 EUR</td><td><div class="bar" style="--c:var(--eur);width:17%"></div></td><td>17%</td><td>€11,000</td></tr>
      <tr><td>🥇 GOLD</td><td><div class="bar" style="--c:var(--gold);width:11%"></div></td><td>11%</td><td>€7,120</td></tr>
    </table>
    <div class="row wrapr" style="margin-top:10px"><span class="pill ink">EUR ▼ 5% → MINE ▲ €2,700</span><span class="caps">USD and gold in €</span></div>
  </div>

  <div class="tile c6">
    <div class="bhead"><span>📈</span><span class="t">EUR / USD · GOLD IN €</span><span class="grow"></span><span class="pill ink">1Y</span></div>
    ${chart([[series(7, -0.04), 'var(--eur)'], [series(11, 0.3), 'var(--gold)']], [['EUR/USD 1.162 · ▼ 3.1% 1M', 'var(--eur)'], ['GOLD €3,410 · ▲ 41% 1Y', 'var(--gold)']])}
  </div>

  <div class="tile c6">
    <div class="bhead"><span>📉</span><span class="t">BRAZIL · EWZ</span><span class="grow"></span><span class="pill ink">1Y</span></div>
    ${chart([[series(4, -0.12), 'var(--brl)']], [['EWZ $24.10 · ▼ 18% 1M', 'var(--brl)'], ['52W ▼ 31% FROM HIGH', 'var(--ink-400)']])}
  </div>

  <div class="tile c4 opt">
    <div class="row">${fav('ishares.com')}<span class="tk">IB01</span><span class="pill ink">BONDS · USD 0–1Y</span></div>
    <div class="sr"><span class="pill ink">YIELD 4.1%</span><span class="pill good">BULLISH</span></div>
    <div class="case"><i class="bu">▲</i><span>Cash-like, pays the US short rate.</span></div>
    <div class="case"><i class="be">▼</i><span>Falls in euros if the dollar falls.</span></div>
    <div class="case"><i class="wr">✕</i><span><b class="caps">wrong if</b> the Fed cuts fast.</span></div>
  </div>
  <div class="tile c4 opt">
    <div class="row">${fav('ishares.com')}<span class="tk">EWZ</span><span class="pill ink">BRAZIL · STOCKS</span></div>
    <div class="sr"><span class="pill good">OVERSOLD · RSI 27</span><span class="pill bad">BEARISH · SMA 200</span></div>
    <div class="case"><i class="bu">▲</i><span>Cheap after the selloff; pays dividends.</span></div>
    <div class="case"><i class="be">▼</i><span>Election and budget risk; the real can fall more.</span></div>
    <div class="case"><i class="wr">✕</i><span><b class="caps">wrong if</b> rates in Brazil keep rising.</span></div>
  </div>
  <div class="tile c4 opt">
    <div class="row"><span class="logo">🥇</span><span class="tk">GOLD</span><span class="pill ink">11% MINE · HELD</span></div>
    <div class="sr"><span class="pill bad">OVERBOUGHT · RSI 72</span><span class="pill ink">NEAR HIGH</span></div>
    <div class="case"><i class="bu">▲</i><span>Rises when people fear for a currency.</span></div>
    <div class="case"><i class="be">▼</i><span>Up 41% in a year; already 11% of MINE.</span></div>
    <div class="case"><i class="wr">✕</i><span><b class="caps">wrong if</b> the debt worry calms down.</span></div>
  </div>
</div>

<div class="srcs"><span class="caps">sources</span><span class="src">reuters.com · 29 Oct</span><span class="src">ft.com · 28 Oct</span><span class="src">ecb.europa.eu · 23 Oct</span><span class="src">YAHOO · 21:30</span></div>
<div class="sugg"><span>Compare EWZ with emerging markets</span><span>How much of MINE is in euros, exactly?</span><span>Bonds in euros instead</span></div>
<div class="meta"><span>SONNET 5.5 · 29 OCT 21:31 · 41K IN · 3.2K OUT · PRO PLAN</span><span>RESEARCH · NOT ADVICE · NOT SAVED</span></div>`

const ASKING = `
<div class="steps">
  <span class="step">🌐 SEARCHED · euro debt news 14 days</span>
  <span class="step">📈 FETCHED · EURUSD=X 1Y</span>
  <span class="step live">FETCHING · GC=F 1Y</span>
</div>
<div class="blocks"><div class="skel c6"></div><div class="skel c6"></div></div>`

const EMPTY = `<div class="empty"><span class="caps" style="font-size:11px">✦ ASK · MINE · MARKETS · IDEAS</span>
<div class="sugg" style="justify-content:center"><span>Why did GOOGL fall today?</span><span>Is my euro cash at risk?</span><span>Ideas outside the US</span><span>Gold or bonds now?</span></div></div>`

function render(s) {
  const t = document.getElementById('thread')
  t.innerHTML = s === 'empty' ? EMPTY : `<div class="q">${Q}</div><div class="a">${s === 'asking' ? ASKING : ANSWER}</div>`
}
document.querySelectorAll('.ctl button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.ctl button').forEach((x) => x.classList.toggle('on', x === b))
  render(b.dataset.s)
}))
render('answer')
</script>
</body>
</html>
