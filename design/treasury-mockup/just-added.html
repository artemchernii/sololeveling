<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · just added</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Just added (14 Oct). Artem: "i see nothing in revolut, no history of
     this addings … i cant open what i just added and cant undo". The gold
     buys were saved; their file sits at 23 Jul on Revolut's sheet, under
     60 newer rows. Files added in the last 7 days sit on top of the
     account's sheet and of the thing's page, with OPEN and REMOVE.
     Built from the app's own pieces (his mark, 14 Oct: "why we cant
     follow same style we have"): KindBadge, AccountLogo, the sheet's file
     row (AccountSheetRows Divider), the BUY badge, PILL buttons. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --acct-bank: oklch(0.83 0.1 85);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
  svg.i { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 660px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(var(--lift),.14); color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 560px; margin: 0 auto; text-align: center }
  .sheet { border-radius: 22px; padding: 20px; border: 1px solid var(--sys-edge); background: linear-gradient(160deg, rgba(181,171,252,.08), rgba(181,171,252,.015) 40%), #1d1c2d; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -18px var(--shine); display: flex; flex-direction: column; gap: 16px }
  .caps { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-400) }
  .mono { font-family: var(--mono); font-size: 11px; color: var(--ink-400) }

  /* app pieces */
  .head { display: flex; align-items: center; gap: 14px }
  .alogo { width: 44px; height: 44px; border-radius: 12px; background: #fff; padding: 7px; object-fit: contain; flex: none }
  .tlogo { border-radius: 999px; background: #e8c77a; color: #6a4b12; display: grid; place-items: center; font-weight: 600; flex: none }
  .head .n { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px }
  .head .n b { font-size: 17px; font-weight: 400; line-height: 1 }
  .head .r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
  .big { font-size: 30px; font-weight: 300; letter-spacing: -.01em; line-height: 1 }
  .kinds { display: flex; gap: 4px; flex-wrap: wrap }
  .kind { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase }
  .kind.bank { color: var(--acct-bank); background: color-mix(in oklch, var(--acct-bank) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--acct-bank) 35%, transparent) }
  .kind.broker { color: var(--lav-300); background: rgba(181,171,252,.10); box-shadow: inset 0 0 0 1px rgba(181,171,252,.40) }
  .bd { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase }
  .bd.buy { background: color-mix(in oklch, var(--good) 14%, transparent); color: var(--good) }
  .bd.out { background: color-mix(in oklch, var(--danger) 14%, transparent); color: var(--danger) }
  .bd.stay { background: color-mix(in oklch, var(--good) 12%, transparent); color: var(--good) }
  .bd.in { background: rgba(var(--lift),.05); color: var(--ink-400) }
  .bd.warn { background: color-mix(in oklch, var(--warn) 14%, transparent); color: var(--warn) }
  .bd.rows { background: rgba(181,171,252,.14); color: var(--lav-300) }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); box-shadow: inset 0 0 0 1px rgba(var(--lift),.15); transition: transform .12s, color .15s }
  .pill:hover { color: var(--ink-100); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 40%, transparent) }
  .pill:active { transform: scale(.96) }
  .pill.danger { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 40%, transparent) }
  .pill.go { background: color-mix(in oklch, var(--danger) 20%, transparent); color: var(--ink-100) }

  /* the strip: the sheet's own file row, lifted to the top */
  .just { display: flex; flex-direction: column; gap: 8px }
  .jhead { display: flex; align-items: center; gap: 8px }
  .jhead .t { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--lav-300) }
  .jhead .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--lav-400); box-shadow: 0 0 8px var(--lav-400); animation: pulse 2s infinite }
  .panel { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 14px; background: rgba(181,171,252,.06); box-shadow: inset 0 0 0 1px rgba(181,171,252,.22); animation: arrive .45s cubic-bezier(.2,.8,.2,1) both; transition: max-height .4s ease, padding .4s, opacity .3s, margin .4s; max-height: 260px }
  .panel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(181,171,252,.2) 50%, transparent 70%); transform: translateX(-100%); animation: sweep 1.2s .35s ease both; pointer-events: none }
  .panel.gone { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; margin-top: -8px }
  .panel.dup { background: rgba(var(--lift),.03); box-shadow: inset 0 0 0 1px rgba(var(--lift),.10) }
  .frow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.3); text-align: left; width: 100% }
  .frow:hover { background: rgba(0,0,0,.5) }
  .thumb { width: 26px; height: 30px; border-radius: 5px; background: rgba(var(--lift),.08); display: grid; place-items: center; font-family: var(--mono); font-size: 8.5px; color: var(--ink-300); flex: none }
  .frow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
  .frow .t b { font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .frow .t span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-400) }
  .frow .open { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--lav-300) }
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
  .meta .sp { flex: 1 }
  .thing { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-200) }
  .ask { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: color-mix(in oklch, var(--danger) 6%, #1d1c2d); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 35%, transparent); animation: arrive .3s ease both }
  .ask .ttl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--danger) }
  .what div { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid rgba(var(--lift),.06); animation: arrive .3s ease both }
  .what div:first-child { border-top: 0 }
  .what .m { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--ink-200) }
  .what .d { font-family: var(--mono); font-size: 11px; color: var(--ink-500) }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .box { padding: 10px 12px; border-radius: 12px; background: rgba(var(--lift),.04); display: flex; flex-direction: column; gap: 4px }
  .box b { font-size: 17px; font-weight: 300 }
  .box b s { color: var(--ink-500); text-decoration-thickness: 1px }
  .box b i { font-style: normal; color: var(--ink-500); font-size: 13px; margin: 0 4px }
  .acts { display: flex; gap: 6px; justify-content: flex-end }
  .done { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: color-mix(in oklch, var(--good) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 35%, transparent); font-size: 13px; animation: arrive .35s ease both }
  .done .tk { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; background: color-mix(in oklch, var(--good) 16%, transparent); color: var(--good); animation: pop .45s ease both; box-shadow: 0 0 18px -4px var(--good) }

  /* the built sheet, below */
  .tl { display: flex; flex-direction: column }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid rgba(var(--lift),.06); font-size: 13.5px }
  .row:first-child { border-top: 0 }
  .row .d { font-family: var(--mono); font-size: 11px; color: var(--ink-500); width: 54px }
  .row .w { flex: 1 }
  .row .a { font-family: var(--mono); font-size: 12.5px }
  .neg { color: var(--danger) } .pos { color: var(--good) }
  .bal { display: flex; align-items: baseline; gap: 10px; margin: 6px 0; padding: 10px 12px; border-radius: 14px; background: rgba(181,171,252,.06); box-shadow: inset 0 0 0 1px rgba(181,171,252,.22) }
  .bal .caps { color: var(--lav-300) } .bal b { margin-left: auto; font-family: var(--mono); font-size: 14px; font-weight: 500 }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
  .tile { padding: 10px 12px; border-radius: 12px; background: rgba(var(--lift),.04); display: flex; flex-direction: column; gap: 3px }
  .tile b { font-size: 19px; font-weight: 300 }
  .glow { animation: glow 1.6s ease both }
  .roll { display: inline-block; animation: roll .5s ease both }
  .spin { animation: spin .8s linear infinite }
  @keyframes arrive { from { opacity: 0; transform: translateY(8px) scale(.985) } to { opacity: 1; transform: none } }
  @keyframes sweep { to { transform: translateX(100%) } }
  @keyframes pulse { 50% { opacity: .45 } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.15) } }
  @keyframes roll { from { opacity: 0; transform: translateY(-60%) } to { opacity: 1; transform: none } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes glow { 0%,100% { background: transparent } 30% { background: rgba(181,171,252,.12) } }
  @media (max-width: 520px) { .tiles { grid-template-columns: 1fr 1fr } .big { font-size: 24px } }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div class="sheet" id="sheet"></div>
</div>
<script>
const I = {
  bank: '<svg class="i" viewBox="0 0 24 24"><path d="M10 18v-7"/><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg>',
  broker: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5v4"/><rect width="4" height="6" x="7" y="9" rx="1"/><path d="M9 15v2"/><path d="M17 3v2"/><rect width="4" height="8" x="15" y="5" rx="1"/><path d="M17 13v3"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M20 6 9 17l-5-5"/></svg>',
  load: '<svg class="i spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>',
}
const LOGO = 'https://www.google.com/s2/favicons?domain=revolut.com&sz=128'
const au = (n) => `<span class="tlogo" style="width:${n}px;height:${n}px;font-size:${Math.round(n * .38)}px">Au</span>`
const kinds = '<span class="kinds"><span class="kind bank">' + I.bank + 'bank</span><span class="kind broker">' + I.broker + 'broker</span></span>'

/* `wrote`: rows it saved. `had`: rows it read that another file saved first. */
const A = { id: 'a', name: 'IMG_9285.PNG', img: true, when: 'today 00:13', live: true, wrote: 4, had: 0, span: '16 Apr → 23 Jul', gold: true }
const B = { id: 'b', name: 'IMG_9301.PNG', img: true, when: 'today 09:40', live: true, wrote: 0, had: 4, span: '16 Apr → 23 Jul', gold: true }
const C = { id: 'c', name: 'account-statement.pdf', img: false, when: 'Sat 11 Oct', live: false, wrote: 38, had: 6, span: '1 Oct → 10 Oct' }
const BUYS = [['€300', '0.08275 oz', '23 Jul'], ['€250', '0.069022 oz', '10 Jun'], ['€300', '0.074456 oz', '30 Apr'], ['€250', '0.059985 oz', '16 Apr']]
const SCEN = {
  one:   { label: 'revolut', files: [A], note: "Revolut's sheet. The strip on top; the rows under it as built." },
  three: { label: 'three files', files: [B, A, C], note: 'The gold screenshot dropped twice: the second saved 0.' },
  ask:   { label: 'remove', files: [A], ask: 'a', note: 'REMOVE shows what goes, before the press.' },
  clash: { label: 'remove · clash', files: [B, A], ask: 'a', note: 'IMG_9301 has the same 4 BUY: they stay, under it.' },
  gold:  { label: 'gold', files: [A], gold: true, note: "Gold's page: files with Gold's rows only." },
  none:  { label: 'nothing new', files: [], note: 'Nothing in 7 days: no strip.' },
}
let s = 'one', asking = null, gone = null
const isDone = () => typeof gone === 'string' && gone.startsWith('done:')

function panel(f, i) {
  const count = f.gold
    ? (f.wrote ? `<span class="bd buy">${f.wrote} buy</span>` : `<span class="bd in">0 saved</span>`)
    : `<span class="bd rows">${f.wrote} rows</span>`
  const had = f.had ? `<span class="bd in">${f.had} ${f.gold ? 'buy' : 'rows'} in already</span>` : ''
  const thing = f.gold ? `<span class="thing">${au(18)}Gold</span>` : ''
  return `<div class="panel ${f.wrote ? '' : 'dup'} ${gone === f.id ? 'gone' : ''}" style="animation-delay:${i * 70}ms">
    <button class="frow">
      <span class="thumb">${f.img ? 'IMG' : 'PDF'}</span>
      <span class="t"><b>${f.name}</b><span>${f.span} · added ${f.when}</span></span>
      <span class="open">open ›</span>
    </button>
    <span class="meta">${thing}${count}${had}<span class="sp"></span>${f.wrote ? `<button class="pill danger" onclick="ask('${f.id}')">${I.x} remove</button>` : ''}</span>
  </div>`
}
function askBox(f, clash) {
  const what = BUYS.map(([eur, oz, d], i) =>
    `<div style="animation-delay:${i * 50}ms"><span class="bd buy">buy</span><span class="m">${eur} · ${oz}</span><span class="d">${d}</span><span class="bd ${clash ? 'stay' : 'out'}">${clash ? 'stays' : 'goes'}</span></div>`).join('')
  const boxes = clash
    ? `<div class="box"><span class="caps">gold · buy total</span><b>€1,100<i>→</i>€1,100</b><span class="mono">4 BUY · under IMG_9301</span></div>
       <div class="box"><span class="caps">revolut · rows</span><b>3,742<i>→</i>3,742</b><span class="mono">0 gone</span></div>`
    : `<div class="box"><span class="caps">gold · buy total</span><b><s>€1,100</s><i>→</i>—</b><span class="mono">4 BUY → 0</span></div>
       <div class="box"><span class="caps">revolut · rows</span><b><s>3,742</s><i>→</i>3,738</b><span class="mono">−4</span></div>`
  return `<div class="ask">
    <span class="meta"><span class="ttl">remove · ${f.name}</span>${clash ? '<span class="bd warn">clash</span>' : ''}</span>
    ${clash ? '<span class="mono">4 BUY in IMG_9301.PNG too</span>' : ''}
    <div class="what">${what}</div>
    <div class="two">${boxes}</div>
    <span class="acts">
      <button class="pill" onclick="asking=null;draw()">keep</button>
      <button class="pill go" id="go" onclick="remove('${f.id}')">${I.x} remove</button>
    </span>
  </div>`
}
function ask(id) { asking = id; draw() }
function remove(id) {
  document.getElementById('go').innerHTML = I.load + ' removing…'
  setTimeout(() => {
    asking = null; gone = id; draw()
    setTimeout(() => { gone = 'done:' + id; draw() }, 420)
  }, 800)
}
function strip(sc) {
  if (!sc.files.length) return ''
  const clash = s === 'clash'
  const files = sc.files.filter((f) => gone !== 'done:' + f.id)
  const landed = isDone()
    ? `<div class="done"><span class="tk">${I.check}</span><span class="meta"><span class="bd ${clash ? 'stay' : 'out'}">${clash ? '4 buy stay' : '−4 buy'}</span><span>IMG_9285.PNG</span><span class="mono">removed</span></span></div>`
    : ''
  const list = files.map((f, i) => asking === f.id ? askBox(f, clash) : panel(f, i)).join('')
  return `<div class="just"><span class="jhead">${files.some((f) => f.live) ? '<span class="dot"></span>' : ''}<span class="t">just added</span><span class="mono">· 7 days</span></span>${landed}${list}</div>`
}
function draw() {
  const sc = SCEN[s]
  document.getElementById('scen').innerHTML = Object.entries(SCEN).map(([k, v]) =>
    `<button class="${k === s ? 'on' : ''}" onclick="pick('${k}')">${v.label}</button>`).join('')
  document.getElementById('note').textContent = sc.note
  if (sc.ask && asking === null && gone === null) asking = sc.ask
  const el = document.getElementById('sheet')
  const done = isDone()
  if (sc.gold) {
    el.innerHTML = `<div class="head">${au(44)}<span class="n"><b>Gold</b><span class="mono">XAU · gold · EUR</span></span><span class="r"><span class="big">€3,741.24</span><span class="mono">price · Yahoo Finance</span></span></div>
      <div class="tiles">
        <div class="tile"><span class="caps">held</span><b>0.408365 oz</b><span class="meta"><img src="${LOGO}" width="14" height="14" style="border-radius:4px;background:#fff"><span class="mono">Revolut</span></span></div>
        <div class="tile"><span class="caps">buy total</span><b>${done ? '<span class="roll">—</span>' : '€1,100'}</b><span class="mono">${done ? 0 : 4} buy</span></div>
        <div class="tile"><span class="caps">worth</span><b>€1,527.79</b><span class="mono">today</span></div>
      </div>
      ${strip(sc)}
      <span class="caps">buy · sell · ${done ? 0 : 4}</span>
      <div class="tl">${done ? '' : BUYS.slice(0, 2).map(([e, o, d]) => `<div class="row glow"><span class="bd buy">buy</span><span class="w">${e} <span class="mono">${o}</span></span><span class="d">${d}</span></div>`).join('')}</div>`
    return
  }
  const rows = done && s !== 'clash' ? '<span class="roll">3,738</span>' : '3,742'
  el.innerHTML = `<div class="head"><img class="alogo" src="${LOGO}" alt=""><span class="n"><b>Revolut</b>${kinds}</span><span class="r"><span class="big">€1,527.79</span><span class="mono">cash and shares</span></span></div>
    ${strip(sc)}
    <span class="caps">${rows} rows · 41 files · newest first</span>
    <div class="tl">
      <div class="bal"><span class="caps">balance · 13 Oct</span><b>€412.08</b></div>
      <div class="row"><span class="d">13 Oct</span><span class="w">Pingo Doce</span><span class="a neg">−€23.40</span></div>
      <div class="row"><span class="d">12 Oct</span><span class="w">ADA · reward</span><span class="a pos">+0.41 ADA</span></div>
      <div class="row"><span class="d">11 Oct</span><span class="w">Bolt</span><span class="a neg">−€8.90</span></div>
    </div>`
}
function pick(k) { s = k; asking = null; gone = null; draw() }
draw()
</script>
</body>
</html>
