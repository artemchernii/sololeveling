<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · what landed, when the file showed no balance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* What landed, said plainly (11 Oct). Artem, looking at "4 movements
     added · no balance / −€1,114.85 · from Oct 3 / ✓ STILL THE SAME":
     "what is this -1114 value? what is no balance means? … why the fuck we
     show still the same button????". The numbers are the ones from that
     screen. Same window and card as update.html's landed state. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84;
    --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button, input { font: inherit; color: inherit }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400); cursor: pointer }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 720px; margin: 0 auto; text-align: center }
  .note b { color: var(--ink-200); font-weight: 400 }
  .win { border-radius: 22px; background: rgba(22,24,38,.86); border: 1px solid var(--sys-edge); box-shadow: 0 0 0 1px rgba(181,171,252,.25), 0 30px 80px -30px #000 }
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid rgba(var(--lift),.07) }
  .back { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14) }
  .title { font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lav-400) }
  .x { margin-left: auto; width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); display: grid; place-items: center; color: var(--ink-300) }
  .body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 34px 22px 30px }
  .ring { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; color: var(--good); background: color-mix(in oklch, var(--good) 16%, transparent); border: 1px solid color-mix(in oklch, var(--good) 45%, transparent); box-shadow: 0 0 36px -6px var(--good) }
  .ring svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round }
  h2 { font-size: 24px; font-weight: 300 }
  .card { width: 100%; max-width: 576px; display: flex; flex-direction: column; gap: 9px; border-radius: 14px; background: rgba(var(--lift),.04); border: 1px solid rgba(var(--lift),.08); padding: 12px 14px }
  .row { display: flex; align-items: center; gap: 12px }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #111; flex: none }
  .logo b { color: #1d8fe1 }
  .name { flex: 1; font-size: 15px }
  .big { font-size: 17px; font-weight: 300; text-align: right }
  .big small { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-500); letter-spacing: .04em }
  .big.unknown { color: var(--ink-400) }
  .meta { padding-left: 42px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
  .meta .good { color: var(--good) }
  .warnline { padding-left: 42px; font-family: var(--mono); font-size: 10.5px; color: var(--warn); display: flex; align-items: center; gap: 8px }
  .warnline span { flex: 1 }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent); border: 1px solid color-mix(in oklch, var(--good) 40%, transparent); border-radius: 999px; padding: 4px 12px; white-space: nowrap; cursor: pointer }
  .ask { margin-left: 42px; display: flex; flex-direction: column; gap: 8px; border-radius: 12px; background: color-mix(in oklch, var(--warn) 8%, transparent); border: 1px solid color-mix(in oklch, var(--warn) 35%, transparent); padding: 10px 12px }
  .ask p { font-size: 13px; color: var(--ink-200); line-height: 1.5 }
  .ask p b { font-weight: 500; color: var(--ink-100) }
  .ask .field { display: flex; gap: 8px; align-items: center }
  .ask input { width: 150px; background: rgba(0,0,0,.25); border: 1px solid rgba(var(--lift),.16); border-radius: 10px; padding: 7px 10px; font-size: 15px; outline: none }
  .ask input:focus { border-color: var(--lav-400) }
  .ask .save { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; border: 1px solid color-mix(in oklch, var(--lav-400) 50%, transparent); background: rgba(181,171,252,.16); cursor: pointer }
  .ask .hint { font-family: var(--mono); font-size: 10px; color: var(--ink-500) }
  .sum { margin-left: 42px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-300); background: rgba(0,0,0,.22); border-radius: 10px; padding: 8px 11px; line-height: 1.6 }
  .sum b { color: var(--ink-100); font-weight: 500 }
  .sum i { font-style: normal; color: var(--good); margin-left: 6px }
  .sum.off i { color: var(--warn) }
  .had { padding-left: 42px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .logo { padding: 3px; object-fit: contain }
  .chips { display: flex; gap: 6px; padding-left: 42px; flex-wrap: wrap }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 4px 10px; border-radius: 999px }
  .chip i { width: 6px; height: 6px; border-radius: 999px; background: currentColor }
  .chip.new { color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent); border: 1px solid color-mix(in oklch, var(--good) 35%, transparent) }
  .chip.had { color: #a9a3d6; background: rgba(181,171,252,.08); border: 1px solid rgba(181,171,252,.22) }
  .strip { margin-left: 42px; display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(var(--lift),.06); overflow: hidden }
  .cell { display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; border-left: 1px solid rgba(var(--lift),.06) }
  .cell:first-child { border-left: 0 }
  .cell span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500) }
  .cell b { font-size: 16px; font-weight: 300; color: var(--ink-200) }
  .cell em { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--ink-500) }
  .cell.out b { color: oklch(0.72 0.17 25) }
  .cell.in b { color: var(--good) }
  .cell.in.zero b { color: var(--ink-500) }
  .cell.now { background: rgba(181,171,252,.07) }
  .cell.now b { color: var(--ink-100); font-weight: 400 }
  .cell.now.good em { color: var(--good) }
  .cell.now.warn em { color: var(--warn) }
  .offline { padding-left: 42px; font-family: var(--mono); font-size: 10.5px; color: var(--warn) }
  .foot { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap }
  .btn { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(var(--lift),.16); background: none; color: var(--ink-200) }
  .btn.loud { background: rgba(181,171,252,.18); border-color: color-mix(in oklch, var(--lav-400) 50%, transparent); padding-inline: 30px }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div class="win">
    <div class="head"><span class="back">‹ back</span><span class="title">[ check it ]</span><span class="x">✕</span></div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
const tick = '<span class="ring"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>'
const logo = '<img class="logo" src="https://www.google.com/s2/favicons?domain=activobank.pt&sz=128" alt="">'
const foot = '<div class="foot"><button class="btn">October 2026 in Flow →</button><button class="btn loud">Done</button></div>'
/* One card whatever the file's size: counts, then was → out → in → now. */
const card = ({ big, day, fresh, had, was, wasDay, out, inn, now, nowNote, tone = 'good', under = '' }) => `
  <div class="card">
    <div class="row">${logo}<span class="name">ActivoBank</span><span class="big">${big}<small>${day}</small></span></div>
    <div class="chips">
      <span class="chip new"><i></i>${fresh} new</span>
      ${had ? `<span class="chip had"><i></i>${had} you already had</span>` : ''}
    </div>
    <div class="strip">
      <div class="cell"><span>was · ${wasDay}</span><b>${was}</b></div>
      <div class="cell out"><span>out</span><b>${out}</b></div>
      <div class="cell in ${inn === '€0.00' ? 'zero' : ''}"><span>in</span><b>${inn}</b></div>
      <div class="cell now ${tone}"><span>now</span><b>${now}</b><em>${nowNote}</em></div>
    </div>
    ${under}
  </div>`

const S = {
  today: {
    l: 'today (what you saw)',
    note: 'What the app shows now, for comparison.',
    r: () => `${tick}<h2>ActivoBank updated</h2><div class="card"><div class="row">${logo}<span class="name">ActivoBank</span><span class="big">−€1,114.85</span></div><div class="meta"><span class="good">4 movements added</span><span>·</span><span>no balance</span></div><div class="warnline"><span>−€1,114.85 · from Oct 3</span><button class="pill">✓ still the same</button></div></div>${foot}`,
  },
  yours: {
    l: 'your screenshot',
    note: 'Two were new, two you already had. <b>Was, out, in, now</b> — four numbers, the same whether the file has 2 rows or 200. The tick says the result is the balance the screenshot prints.',
    r: () => `${tick}<h2>ActivoBank is up to date</h2>${card({ big: '€90.35', day: 'balance of Oct 12', fresh: 2, had: 2, was: '€153.21', wasDay: 'Oct 3', out: '€62.86', inn: '€0.00', now: '€90.35', nowNote: '✓ as the screenshot shows' })}${foot}`,
  },
  twenty: {
    l: '20 transactions',
    note: 'A long screenshot: the card is the same size. The rows themselves are in Flow, one press away.',
    r: () => `${tick}<h2>ActivoBank is up to date</h2>${card({ big: '€1,150.25', day: 'balance of Oct 12', fresh: 14, had: 6, was: '€90.35', wasDay: 'Oct 3', out: '€1,240.10', inn: '€2,300.00', now: '€1,150.25', nowNote: '✓ as the screenshot shows' })}${foot}`,
  },
  noPrint: {
    l: 'file prints no balance',
    note: 'A file with rows and no balance anywhere. The same four numbers; "now" says it is worked out, not read. No question, no button.',
    r: () => `${tick}<h2>ActivoBank updated</h2>${card({ big: '€90.35', day: 'worked out', fresh: 2, had: 2, was: '€153.21', wasDay: 'Oct 3', out: '€62.86', inn: '€0.00', now: '€90.35', nowNote: 'worked out, the file shows none', tone: 'plain' })}${foot}`,
  },
  off: {
    l: 'it does not add up',
    note: 'The bank’s printed balance wins. One orange line says how much no row explains.',
    r: () => `${tick}<h2>ActivoBank is up to date</h2>${card({ big: '€78.35', day: 'balance of Oct 12', fresh: 2, had: 2, was: '€153.21', wasDay: 'Oct 3', out: '€62.86', inn: '€0.00', now: '€78.35', nowNote: 'the screenshot’s balance', tone: 'warn', under: '<div class="offline">€12.00 left that no row shows — a row between Oct 3 and Oct 12 is missing</div>' })}${foot}`,
  },
}
let on = 'yours'
function draw() {
  document.getElementById('scen').innerHTML = Object.entries(S).map(([k, s]) => `<button class="${k === on ? 'on' : ''}" data-k="${k}">${s.l}</button>`).join('')
  document.getElementById('note').innerHTML = S[on].note
  document.getElementById('body').innerHTML = S[on].r()
}
document.getElementById('scen').addEventListener('click', (e) => { const k = e.target.dataset.k; if (k) { on = k; draw() } })
draw()
</script>
</body>
</html>
