<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · remove a trade</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* A position's buys and sells (14 Oct night). His words: the × removed
     his MSFT buy with "no confirmation nothing … we want not to remove
     entirely but shallow … so I can reverse it", and "BUY is fucking
     bland". His MSFT rows, as on the page tonight. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0 }
  svg.i { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 16px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--lav-300); margin-bottom: 6px }
  .caps { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-400) }
  .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
  .b-lav { background: rgba(181,171,252,.16); color: var(--lav-300) }
  .b-q { background: rgba(var(--lift),.06); color: var(--ink-300) }
  .b-good { background: color-mix(in oklch, var(--good) 14%, transparent); color: var(--good) }
  .b-bad { background: color-mix(in oklch, var(--danger) 14%, transparent); color: var(--danger) }
  .b-warn { background: color-mix(in oklch, var(--warn) 16%, transparent); color: var(--warn) }
  .list { border-radius: 16px; background: rgba(var(--lift),.025); box-shadow: inset 0 0 0 1px rgba(var(--lift),.08), 0 0 0 1px var(--sys-edge); padding: 14px }
  .round { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0 8px }
  .round .days { font-family: var(--mono); font-size: 11px; color: var(--ink-300) } .sp { flex: 1 }
  .row { position: relative; display: grid; grid-template-columns: 64px minmax(0,1fr) auto 18px 74px; gap: 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-top: 1px solid rgba(var(--lift),.06); border-radius: 10px; transition: background .25s, box-shadow .25s }
  .row.old .side, .row.old .amt { }
  .side { justify-self: start; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase }
  /* old row look, for "built now" */
  .old .side { background: none; padding: 0; color: var(--good) } .old .side.sell { color: var(--danger) }
  .old .amt { font-family: var(--mono); font-size: 13.5px } .old .sh { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) } .old .d { font-family: var(--mono); font-size: 11px; color: var(--ink-500) }
  /* proposed */
  .neu .side { padding: 4px 10px; border-radius: 999px; font-weight: 500 }
  .neu .side.buy { background: color-mix(in oklch, var(--good) 16%, transparent); color: var(--good); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 35%, transparent) }
  .neu .side.sell { background: color-mix(in oklch, var(--danger) 16%, transparent); color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 35%, transparent) }
  .neu .amt { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em }
  .neu .sh { font-family: var(--mono); font-size: 11px; color: var(--ink-300) } .neu .sh b { color: var(--ink-100); font-weight: 500 }
  .neu .d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-300) }
  .neu .sh { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .dm { display: none }
  @media (max-width: 600px) {
    .neu .row { grid-template-columns: 58px minmax(0,1fr) 18px 70px; gap: 10px }
    .neu .row.ask, .neu .row.gone { grid-template-columns: 58px minmax(0,1fr) }
    .neu .row.ask .acts, .neu .row.gone .acts { grid-column: 1 / -1; justify-content: flex-end }
    .neu .d { display: none } .dm { display: inline } .neu .at { display: none }
    .neu .row .rm { opacity: 1 }
  }
  .logo { width: 18px; height: 18px; border-radius: 5px; background: #fff; color: #000; font: 700 11px var(--mono); display: grid; place-items: center }
  .logo.tr { background: #000; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3) }
  .rm { justify-self: end; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-400); padding: 4px 9px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(var(--lift),.14); opacity: 0; transition: opacity .15s }
  .row:hover .rm, .row.touch .rm { opacity: 1 }
  .rm:hover { color: var(--danger); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--danger) 45%, transparent) }
  /* asking */
  .row.ask { background: color-mix(in oklch, var(--warn) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 40%, transparent); grid-template-columns: 64px minmax(0,1fr) auto }
  .acts { display: flex; gap: 6px; align-items: center }
  .btn { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 13px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center }
  .btn.kill { background: var(--danger); color: #1b1220 } .btn.keep { box-shadow: inset 0 0 0 1px rgba(var(--lift),.2); color: var(--ink-100) }
  .btn.undo { background: var(--lav-400); color: #17162a }
  .spin { animation: s .8s linear infinite } @keyframes s { to { transform: rotate(360deg) } }
  /* removed */
  .row.gone { grid-template-columns: 64px minmax(0,1fr) auto; background: rgba(var(--lift),.02) }
  .row.gone .amt, .row.gone .sh { text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--danger) 70%, transparent); color: var(--ink-500) }
  .row.gone .sh b { color: var(--ink-500) }
  .row.gone .side { opacity: .5 }
  .row.back { animation: back .9s }
  @keyframes back { 0% { background: color-mix(in oklch, var(--good) 18%, transparent) } 100% { background: transparent } }
  .land { animation: land .4s both } @keyframes land { from { opacity: 0; transform: scale(.94) } }
  .fold { display: flex; align-items: center; gap: 8px; padding: 10px 0 2px; margin-top: 6px; border-top: 1px solid rgba(var(--lift),.08); width: 100% }
  .ask-note { font-family: var(--mono); font-size: 11px; color: var(--warn); border: 1px dashed color-mix(in oklch, var(--warn) 45%, transparent); border-radius: 10px; padding: 8px 10px; text-align: center; line-height: 1.6 }
</style>
</head>
<body>
<div class="wrap">
  <div class="scen" id="scen">
    <button data-s="rows" class="on">1 · rows</button>
    <button data-s="ask">2 · remove pressed</button>
    <button data-s="saving">3 · saving</button>
    <button data-s="gone">4 · removed · undo</button>
    <button data-s="later">5 · later · removed 1</button>
    <button data-s="back">6 · undo landed</button>
  </div>
  <div class="ask-note" id="note"></div>
  <div id="out"></div>
</div>
<script>
const ic = {
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  undo: '<svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
  load: '<svg class="i spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
}
/* His MSFT, the round now — the TR buy is the one he removed by accident. */
const R = [
  { id: 'tr', side: 'buy', amt: '€251.00', sh: '0.741729', at: '€338.40', d: 'Jul 1, 2026', acct: 'tr' },
  { id: 'rv1', side: 'buy', amt: '€219.41', sh: '0.64990974', at: '€337.61', d: 'Jul 1, 2026', acct: 'r' },
  { id: 'rv2', side: 'buy', amt: '€436.03', sh: '1.31940046', at: '€330.48', d: 'Jun 22, 2026', acct: 'r' },
]
const logo = a => a === 'r' ? '<span class="logo">R</span>' : '<span class="logo tr">⟋</span>'
const NOTE = {
  rows: 'BUY / SELL are badges; the amount is the big thing; × is gone — a small REMOVE shows on hover (always on a phone).',
  ask: 'REMOVE asks on the row itself: amber, the two answers. Nothing is gone yet.',
  saving: 'Pressed: "removing…" at once.',
  gone: 'Landed: the row stays where it was, struck, REMOVED, with UNDO. PAID and the counts above drop it now.',
  later: 'Back on the page later: removed rows fold at the end, REMOVED · 1, each with UNDO.',
  back: 'UNDO landed: the row comes back in its place, flashes green, PAID counts it again.',
}
let s = 'rows'
function row(r, st) {
  const side = `<span class="side ${r.side}">${r.side}</span>`
  const body = `<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span class="amt">${r.amt}</span><span class="sh"><b>${r.sh}</b> shares<span class="at"> at ${r.at}</span><span class="dm"> · ${r.d}</span></span></span>`
  if (st === 'ask') return `<div class="row ask land">${side}${body}<span class="acts"><span class="badge b-warn">remove?</span><button class="btn kill">${ic.trash}remove</button><button class="btn keep">keep</button></span></div>`
  if (st === 'saving') return `<div class="row ask">${side}${body}<span class="acts"><span class="btn kill" style="opacity:.8">${ic.load}removing…</span></span></div>`
  if (st === 'gone') return `<div class="row gone">${side}${body}<span class="acts land"><span class="badge b-bad">removed</span><button class="btn undo">${ic.undo}undo</button></span></div>`
  return `<div class="row ${st === 'back' ? 'back' : ''} ${st === 'touch' ? 'touch' : ''}">${side}${body}<span class="d">${r.d}</span>${logo(r.acct)}<button class="rm">remove</button></div>`
}
function list(kind) {
  const now = kind === 'gone' || kind === 'saving' || kind === 'ask' || kind === 'later'
  const counted = kind === 'gone' || kind === 'later' ? '2 buy · €655.44' : '3 buy · €906.44'
  const rows = R.map((r, i) => {
    if (i !== 0) return row(r, i === 1 && kind === 'rows' ? 'touch' : '')
    if (kind === 'later') return ''
    return row(r, kind === 'rows' ? '' : kind)
  }).join('')
  const fold = kind === 'later'
    ? `<button class="fold"><span class="badge b-bad">removed · 1</span><span class="sp"></span>${ic.down}</button>${row(R[0], 'gone')}`
    : ''
  return `<div class="list neu"><span class="caps">buys and sells · ${kind === 'gone' || kind === 'later' ? 116 : 117}</span>
    <div class="round"><span class="badge b-lav">now</span><span class="days">since Jun 22, 2026</span><span class="sp"></span><span class="badge b-good">${counted}</span></div>
    ${rows}
    <div class="round" style="border-top:1px solid rgba(255,255,255,.08);margin-top:4px"><span class="badge b-q">closed</span><span class="days">Jan 6, 2026 → May 7, 2026</span><span class="sp"></span><span class="badge b-good">7 buy · €727.77</span><span class="badge b-bad">2 sell · €733.62</span>${ic.down}</div>
    ${fold}</div>`
}
function old() {
  return `<div class="list old"><span class="caps">buys and sells · 117</span>
    <div class="round"><span class="badge b-lav">now</span><span class="days">since Jun 22, 2026</span><span class="sp"></span><span class="badge b-good">3 buy · €906.44</span></div>
    ${R.map(r => `<div class="row" style="grid-template-columns:62px minmax(0,1fr) auto 18px 20px"><span class="side ${r.side}">${r.side}</span><span style="display:flex;flex-direction:column;gap:2px"><span class="amt">${r.amt}</span><span class="sh">${r.sh} shares at ${r.at}</span></span><span class="d">${r.d}</span>${logo(r.acct)}<span style="color:var(--ink-500)">×</span></div>`).join('')}</div>`
}
function draw() {
  document.getElementById('out').innerHTML = s === 'rows'
    ? `<div style="display:flex;flex-direction:column;gap:18px"><div><div class="tag">built now</div>${old()}</div><div><div class="tag">proposed</div>${list('rows')}</div></div>`
    : `<div class="tag">proposed</div>${list(s)}`
  document.getElementById('note').textContent = NOTE[s]
  document.querySelectorAll('#scen button').forEach(b => b.classList.toggle('on', b.dataset.s === s))
}
document.getElementById('scen').onclick = e => { const b = e.target.closest('button'); if (!b) return; s = b.dataset.s; draw() }
draw()
</script>
</body>
</html>
