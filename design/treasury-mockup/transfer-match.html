<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treasury · a transfer between two accounts, matched before saving</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* A transfer matched before saving (11 Oct). Artem: "Transfer between
     two of my accounts matched inside the check before saving (amount, a
     small fee, a few days apart), so it is written once." Built on
     check-sum.html: the same sheet, account block, chips, WAS · OUT · IN ·
     NOW strip, orange question box and footer. New here: the transfer
     line, the two-rows question with the fee, and the saved card. The
     €700 and the €505.20 / €500.63 are his rows of 3–6 Oct. */
  :root {
    --bg: #161826;
    --ink-100: #f1f1f5; --ink-200: #d9d9e2; --ink-300: #b5b5c4; --ink-400: #8e8ea3; --ink-500: #6e6e84; --ink-600: #52526a;
    --lav-300: #d2cefd; --lav-400: #b5abfc;
    --good: oklch(0.75 0.15 155); --danger: oklch(0.68 0.19 25); --warn: oklch(0.79 0.15 75);
    --sys-edge: color-mix(in oklch, #b5abfc 34%, transparent);
    --shine: color-mix(in oklch, #b5abfc 75%, transparent);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --lift: 255,255,255;
  }
  * { box-sizing: border-box; margin: 0 }
  body { background: radial-gradient(1200px 600px at 10% -10%, #2a2550 0%, transparent 60%), var(--bg); color: var(--ink-100); font-family: Inter, system-ui, sans-serif; font-size: 14px; min-height: 100vh }
  button { font: inherit; color: inherit; cursor: pointer }
  svg.i { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 14px }
  .scen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .scen button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-400) }
  .scen button.on { color: var(--ink-100); background: rgba(181,171,252,.16); border-color: color-mix(in oklch, var(--lav-400) 45%, transparent) }
  .note { font-size: 12.5px; color: var(--ink-400); line-height: 1.55; max-width: 720px; margin: 0 auto; text-align: center }
  .note b { color: var(--ink-200); font-weight: 400 }
  .sheet { border-radius: 22px; padding: 20px; border: 1px solid var(--sys-edge); background: linear-gradient(160deg, rgba(181,171,252,.08), rgba(181,171,252,.015) 40%), #1d1c2d; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8), 0 0 40px -18px var(--shine); display: flex; flex-direction: column; gap: 16px }
  .shead { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid rgba(181,171,252,.16) }
  .title { flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--lav-400); text-shadow: 0 0 10px var(--shine) }
  .close { width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: none; color: var(--ink-300); display: grid; place-items: center }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline }
  .summary .n { font-size: 26px; font-weight: 300 }
  .summary .l { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); margin-left: 6px }
  .summary .warn { color: var(--warn) }
  .logo { width: 30px; height: 30px; border-radius: 10px; background: #fff; object-fit: contain; padding: 3px; flex: none }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: var(--ink-400); background: rgba(var(--lift),.05); white-space: nowrap }
  .tag.good { color: var(--good); background: color-mix(in oklch, var(--good) 12%, transparent) }
  .tag.warn { color: var(--warn); background: color-mix(in oklch, var(--warn) 12%, transparent) }
  @keyframes land { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 60%, transparent), 0 0 26px -10px var(--warn) } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.15) } }
  .acc { border-radius: 18px; padding: 14px; background: rgba(var(--lift),.035); box-shadow: inset 0 0 0 1px rgba(var(--lift),.07); display: flex; flex-direction: column; gap: 12px; animation: land .45s cubic-bezier(.2,.8,.2,1) both; transition: box-shadow .3s }
  .acc.held { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 38%, transparent); animation: land .45s cubic-bezier(.2,.8,.2,1) both, breathe 2.6s ease-in-out .5s infinite }
  .acc .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
  .acc .name { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 140px }
  .acc .name b { font-weight: 500; font-size: 15px }
  .acc .name span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .bal { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--ink-300); flex-wrap: wrap; justify-content: flex-end }
  .bal .to { color: var(--ink-100); font-size: 15px }
  .bal small { color: var(--ink-500); font-size: 10px }
  .bal .down { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--danger); background: color-mix(in oklch, var(--danger) 12%, transparent) }
  .chips { display: flex; gap: 6px; flex-wrap: wrap }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 4px 10px; border-radius: 999px }
  .chip i { width: 6px; height: 6px; border-radius: 999px; background: currentColor }
  .chip.new { color: var(--good); background: color-mix(in oklch, var(--good) 10%, transparent); border: 1px solid color-mix(in oklch, var(--good) 35%, transparent) }
  .chip.had { color: #a9a3d6; background: rgba(181,171,252,.08); border: 1px solid rgba(181,171,252,.22) }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(var(--lift),.06); overflow: hidden }
  .cell { display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; border-left: 1px solid rgba(var(--lift),.06); min-width: 0 }
  .cell:first-child { border-left: 0 }
  .cell span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .cell b { font-size: 16px; font-weight: 300; color: var(--ink-200) }
  .cell em { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--ink-500); min-height: 12px; display: flex; gap: 4px; align-items: center }
  .cell em svg { width: 11px; height: 11px; stroke-width: 3 }
  .cell.out b { color: oklch(0.72 0.17 25) }
  .cell.in b { color: var(--good) }
  .cell.in.zero b { color: var(--ink-500) }
  .cell.says { background: rgba(181,171,252,.07) }
  .cell.says b { color: var(--ink-100); font-weight: 400 }
  .cell.says.good em { color: var(--good) }
  .cell.says.good em svg { animation: pop .45s cubic-bezier(.2,.8,.2,1) .35s both }
  .cell.says.warn em { color: var(--warn) }
  .why { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--ink-300); line-height: 1.5 }
  .why svg { margin-top: 3px; color: var(--lav-400) }
  .why b { color: var(--ink-100); font-weight: 400 }
  .off { border-radius: 14px; padding: 12px 13px; background: color-mix(in oklch, var(--warn) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warn) 30%, transparent); display: flex; flex-direction: column; gap: 10px; animation: land .4s cubic-bezier(.2,.8,.2,1) .15s both }
  .off .q { display: flex; gap: 9px; align-items: flex-start; line-height: 1.5; font-size: 13.5px }
  .off .q svg { color: var(--warn); margin-top: 3px }
  .off .q b { font-weight: 500 }
  .off .q small { display: block; color: var(--ink-400); font-size: 12px }
  .line { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-200); margin-left: 23px; padding: 7px 10px; border-radius: 10px; background: rgba(0,0,0,.22) }
  .line .d { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .line .v { font-family: var(--mono) }
  .line small { display: block; font-size: 11.5px; color: var(--ink-400) }
  .line.mine { background: none; box-shadow: inset 0 0 0 1px rgba(181,171,252,.22); color: var(--ink-300) }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 23px }
  .opt { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(var(--lift),.14); background: rgba(var(--lift),.03); font-size: 12.5px; color: var(--ink-200); transition: border-color .2s, background .2s, transform .1s }
  .opt.loud { border-color: color-mix(in oklch, var(--lav-400) 50%, transparent); background: rgba(181,171,252,.14) }
  .opt:hover { border-color: color-mix(in oklch, var(--lav-400) 55%, transparent); background: rgba(181,171,252,.1) }
  .opt:active { transform: scale(.97) }
  .done { display: flex; align-items: center; gap: 9px; border-radius: 14px; padding: 11px 13px; font-size: 13px; color: var(--ink-200); background: color-mix(in oklch, var(--good) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--good) 30%, transparent); animation: land .4s cubic-bezier(.2,.8,.2,1) both }
  .done svg { color: var(--good); animation: pop .45s cubic-bezier(.2,.8,.2,1) both }
  .done .sp { flex: 1 }
  .link { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lav-400); background: none; border: 0; padding: 2px 0 }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
  .facts .sp { flex: 1 }
  .leave { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-500); background: none; border: 0; box-shadow: inset 0 0 0 1px rgba(var(--lift),.1); border-radius: 999px; padding: 4px 10px }
  .foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid rgba(181,171,252,.12); padding-top: 14px }
  .foot p { flex: 1; min-width: 200px; font-size: 12.5px; color: var(--ink-400); line-height: 1.5 }
  .foot p b { color: var(--warn); font-weight: 400 }
  .pill { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-300); background: none; border: 1px solid rgba(var(--lift),.14); border-radius: 999px; padding: 8px 14px }
  .apply { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #17152a; border: 0; border-radius: 999px; padding: 10px 20px; background: linear-gradient(135deg, var(--lav-300), var(--lav-400)); box-shadow: 0 0 26px -6px var(--lav-400) }
  .apply[disabled] { opacity: .4; box-shadow: none; cursor: default }
  @media (max-width: 560px) {
    .strip { grid-template-columns: 1fr 1fr }
    .cell:nth-child(3) { border-left: 0 }
    .cell:nth-child(n+3) { border-top: 1px solid rgba(var(--lift),.06) }
    .line, .opts { margin-left: 0; padding-left: 0 } .line { padding-left: 10px }
  }

  /* ── new in this mockup ── */
  .wrap.phone { max-width: 390px }
  .sheet { transition: height .35s cubic-bezier(.2,.8,.2,1); overflow: hidden }
  .chip.move { color: var(--lav-300); background: rgba(181,171,252,.1); border: 1px solid rgba(181,171,252,.34) }
  .logo.s { width: 24px; height: 24px; border-radius: 8px }
  .tr { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; border-radius: 12px; padding: 9px 12px; background: rgba(181,171,252,.06); box-shadow: inset 0 0 0 1px rgba(181,171,252,.2); animation: land .4s cubic-bezier(.2,.8,.2,1) .15s both }
  .tr .pair { display: flex; align-items: center; gap: 6px; color: var(--lav-400) }
  .tr .what { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--ink-100) }
  .tr .what small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-400) }
  .tr .v { font-family: var(--mono); font-size: 13px; color: var(--ink-200) }
  .tag.move { color: var(--lav-300); background: rgba(181,171,252,.12) }
  .two { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-left: 23px }
  .side { display: flex; flex-direction: column; gap: 8px; border-radius: 12px; padding: 11px 12px; background: rgba(0,0,0,.22); min-width: 0 }
  .side.mine { background: none; box-shadow: inset 0 0 0 1px rgba(181,171,252,.22) }
  .side .who { display: flex; align-items: center; gap: 8px; font-size: 13px }
  .side .who span { display: flex; flex-direction: column; min-width: 0 }
  .side .who small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-500) }
  .side .amt { font-family: var(--mono); font-size: 16px; color: var(--ink-100) }
  .side .tag { align-self: flex-start }
  .side.pick { cursor: pointer; text-align: left; border: 0; transition: box-shadow .2s, transform .1s }
  .side.pick:hover { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--lav-400) 60%, transparent) }
  .side.pick:active { transform: scale(.985) }
  .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--warn); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 0 2px }
  .mid b { font-size: 13px; font-weight: 500; letter-spacing: 0 }
  .mid svg { color: var(--ink-500) }
  .sum3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-left: 23px; border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid rgba(var(--lift),.06); overflow: hidden }
  .sum3 .cell.fee b { color: var(--warn) }
  .cands { display: flex; flex-direction: column; gap: 8px; margin-left: 23px }
  .cands .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .busy { display: inline-flex; align-items: center; gap: 8px; min-height: 29px; padding-left: 23px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--lav-300) }
  .ans { position: relative }
  .ans .busy { position: absolute; inset: 0; display: none }
  .ans.busy-on .opts { visibility: hidden }
  .ans.busy-on .busy { display: inline-flex }
  @keyframes spin { to { transform: rotate(360deg) } }
  .spin { width: 14px; height: 14px; border-radius: 999px; border: 2px solid rgba(181,171,252,.25); border-top-color: var(--lav-300); animation: spin .7s linear infinite; flex: none }
  .apply .spin { border-color: rgba(23,21,42,.25); border-top-color: #17152a }
  .saved { display: flex; flex-direction: column; gap: 14px; animation: land .45s cubic-bezier(.2,.8,.2,1) both }
  .saved .big { display: flex; align-items: center; gap: 12px }
  .saved .tick { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--good); background: color-mix(in oklch, var(--good) 14%, transparent); box-shadow: 0 0 24px -8px var(--good); animation: pop .5s cubic-bezier(.2,.8,.2,1) both }
  .saved .tick svg { width: 18px; height: 18px; stroke-width: 3 }
  .saved h2 { font-size: 19px; font-weight: 400 }
  .saved h2 small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-500); font-weight: 400; margin-top: 2px }
  @media (max-width: 560px) { .two, .sum3, .cands { margin-left: 0 } .two { grid-template-columns: 1fr } .mid { flex-direction: row; gap: 8px; padding: 2px 0 } .mid svg { transform: rotate(90deg) } .cands .row2 { grid-template-columns: 1fr } .busy { padding-left: 0 } }
  @media (max-width: 560px) {
  .tr .pair { order: 0 } .tr .v { order: 1; margin-left: auto } .tr .what { order: 2; flex-basis: 100% } .tr .tag { order: 3 }
  .sum3 .cell { padding: 9px 9px } .sum3 .cell b { font-size: 15px }
  }
  .wrap.phone .tr .pair { order: 0 }
  .wrap.phone .tr .v { order: 1; margin-left: auto }
  .wrap.phone .tr .what { order: 2; flex-basis: 100% }
  .wrap.phone .tr .tag { order: 3 }
  .wrap.phone .sum3 .cell { padding: 9px 9px }
  .wrap.phone .sum3 .cell b { font-size: 15px }
  .wrap.phone .strip { grid-template-columns: 1fr 1fr }
  .wrap.phone .cell:nth-child(3) { border-left: 0 }
  .wrap.phone .strip .cell:nth-child(n+3) { border-top: 1px solid rgba(var(--lift),.06) }
  .wrap.phone .line, .wrap.phone .opts { margin-left: 0; padding-left: 0 }
  .wrap.phone .two, .wrap.phone .sum3, .wrap.phone .cands { margin-left: 0 }
  .wrap.phone .two { grid-template-columns: 1fr }
  .wrap.phone .mid { flex-direction: row; gap: 8px; padding: 2px 0 }
  .wrap.phone .mid svg { transform: rotate(90deg) }
  .wrap.phone .cands .row2 { grid-template-columns: 1fr }
  .wrap.phone .busy { padding-left: 0 }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="scen" id="scen"></div>
  <p class="note" id="note"></p>
  <div class="sheet" id="sheet">
    <div class="shead"><span class="title" id="title">[ check it ]</span><button class="close">✕</button></div>
    <div id="body" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
</div>
<script>
const P = { check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', down: '<path d="M4 8l6 6 4-4 6 6"/><path d="M20 11v5h-5"/>', up: '<path d="M4 16l6-6 4 4 6-6"/><path d="M20 13V8h-5"/>', swap: '<path d="M7 7h13l-3-3"/><path d="M17 17H4l3 3"/>', arrow: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>' }
const svg = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`
const D = { ActivoBank: 'activobank.pt', Revolut: 'revolut.com', 'Trade Republic': 'traderepublic.com', BPI: 'bancobpi.pt' }
const logo = (name, s = '') => `<img class="logo ${s}" src="https://www.google.com/s2/favicons?domain=${D[name]}&sz=128" alt="">`
const stat = (n, l, c = '') => `<span class="${c}"><span class="n">${n}</span><span class="l">${l}</span></span>`
const stats = (files, accounts, rows, moves, asks) => `<div class="summary">${stat(files, files === 1 ? 'file' : 'files')}${stat(accounts, accounts === 1 ? 'account' : 'accounts')}${stat(rows, rows === 1 ? 'new row' : 'new rows')}${stat(moves, moves === 1 ? 'move paired' : 'moves paired')}${asks ? stat(asks, 'question', 'warn') : ''}</div>`
const chips = (list) => `<div class="chips">${list.map(([n, l, c]) => `<span class="chip ${c}"><i></i>${n} ${l}</span>`).join('')}</div>`
const strip = ({ was, wasDay, out, inn = '€0', says, tone = 'good', under }) => `
  <div class="strip">
    <div class="cell"><span>was · ${wasDay}</span><b>${was}</b><em></em></div>
    <div class="cell out"><span>out</span><b>${out}</b><em></em></div>
    <div class="cell in ${inn === '€0' ? 'zero' : ''}"><span>in</span><b>${inn}</b><em></em></div>
    <div class="cell says ${tone}"><span>now</span><b>${says}</b><em>${tone === 'good' ? svg('check') : ''}${under}</em></div>
  </div>`
const bal = (from, to, day, change, up) => `<small>now</small>${from}<span style="color:var(--ink-600)">→</span><span class="to">${to}</span><small>${day}</small><span class="down" ${up ? 'style="color:var(--good);background:color-mix(in oklch,var(--good) 12%,transparent)"' : ''}>${svg(up ? 'up' : 'down')}${change}</span>`
const balHeld = (v) => `<small>now</small><span class="to">${v}</span><span class="tag warn">not saved</span>`
const acc = ({ name, kind = 'bank · 1 file', held = false, bal, body }) => `
  <div class="acc ${held ? 'held' : ''}">
    <div class="top">${logo(name)}
      <div class="name"><b>${name}</b><span>${kind}</span></div>
      <div class="bal">${bal}</div>
    </div>
    ${body}
    <div class="facts"><span class="sp"></span><button class="link">rows</button>${held ? '' : '<button class="leave">leave out</button>'}</div>
  </div>`
/* One transfer, both banks' logos, the amount, each day with its place. */
const transfer = (from, to, amount, days, tag) => `
  <div class="tr"><span class="pair">${logo(from, 's')}${svg('arrow')}${logo(to, 's')}</span>
    <span class="what">${from} → ${to}<small>${days}</small></span>
    <span class="v">${amount}</span><span class="tag move">${svg('check')}${tag}</span></div>`
const side = ({ name, day, text, amount, tag, mine, pick }) => `
  <${pick ? `button data-a="${pick}"` : 'div'} class="side ${mine ? 'mine' : ''} ${pick ? 'pick' : ''}">
    <span class="who">${logo(name, 's')}<span>${name}<small>${day} · ${text}</small></span></span>
    <span class="amt">${amount}</span><span class="tag ${mine ? 'move' : 'good'}">${tag}</span>${pick ? '<span class="opt loud" style="align-self:flex-start">same transfer</span>' : ''}
  </${pick ? 'button' : 'div'}>`
const foot = (text, n, disabled) => `<div class="foot"><p>${text}</p><button class="pill">start over</button><button class="pill">later</button><button class="apply" data-apply ${disabled ? 'disabled' : ''}>${step === 'saving' ? '<i class="spin"></i>saving…' : svg('check') + 'apply' + (n ? ` ${n} account${n === 1 ? '' : 's'}` : '')}</button></div>`
const saved = (list) => `<div class="saved">${list.map((a) => `
  <div class="acc"><div class="big"><span class="tick">${svg('check')}</span>${logo(a.name)}<h2>${a.name} saved<small>${a.sub}</small></h2></div>
    ${chips(a.chips)}${strip(a.strip)}${a.extra ?? ''}</div>`).join('')}
  <div class="foot"><p></p><button class="pill" data-a="">undo</button><button class="apply" data-k="${on}">${svg('check')}done</button></div></div>`

const ACTIVO_OCT11 = { was: '€153.21', wasDay: 'Oct 3', out: '€62.86', says: '€90.35', under: 'as the screenshot shows' }
const pendingWhy = `<div class="why">${svg('clock')}<span><b>Trade Republic −€505.20</b> was pending on Oct 3. The €153.21 already had it taken off.</span></div>`
const TOPUP = () => transfer('ActivoBank', 'Revolut', '€700.00', 'Oct 3 in the app · Oct 6 in this screenshot', 'already added')
const TR_BAL = { was: '€12.40', wasDay: 'Sep 26' }

let on = 'twenty', answer = null, step = 'check', busy = false
const S = {
  twenty: {
    l: '20 rows, one transfer',
    note: 'A screenshot with 20 rows. One of them is a top-up Revolut\'s file already wrote. Nothing is asked.',
    r: () => stats(1, 1, 13, 1) + acc({ name: 'ActivoBank', bal: bal('€90.35', '€1,150.25', 'Oct 25', '+€1,059.90', true), body:
      chips([[13, 'new', 'new'], [6, 'already added', 'had'], [1, 'transfer', 'move']]) +
      strip({ was: '€90.35', wasDay: 'Oct 11', out: '€1,240.10', inn: '€2,300.00', says: '€1,150.25', under: 'as the screenshot shows' }) +
      transfer('ActivoBank', 'Revolut', '€200.00', 'Oct 17 in the app · Oct 20 in this screenshot', 'already added') }) +
      foot('Ready to save.', 1),
    saved: () => [{ name: 'ActivoBank', sub: '13 rows · Oct 11 – Oct 25', chips: [[13, 'new', 'new'], [6, 'already added', 'had'], [1, 'transfer', 'move']], strip: { was: '€90.35', wasDay: 'Oct 11', out: '€1,240.10', inn: '€2,300.00', says: '€1,150.25', under: 'as the screenshot shows' } }],
  },
  exact: {
    l: 'already added',
    note: 'The Oct 11 screenshot. Revolut\'s file wrote the €700 top-up on Oct 3; ActivoBank shows it on Oct 6 under another name. One transfer. Nothing is asked.',
    r: () => stats(1, 1, 2, 1) + acc({ name: 'ActivoBank', bal: bal('€153.21', '€90.35', 'Oct 11', '−€62.86'), body:
      chips([[2, 'new', 'new'], [1, 'was pending', 'had'], [1, 'transfer', 'move']]) + strip(ACTIVO_OCT11) + TOPUP() + pendingWhy }) +
      foot('Ready to save.', 1),
    saved: () => [{ name: 'ActivoBank', sub: '2 rows · Oct 3 – Oct 11', chips: [[2, 'new', 'new'], [1, 'was pending', 'had'], [1, 'transfer', 'move']], strip: ACTIVO_OCT11, extra: TOPUP() }],
  },
  fee: {
    l: 'a fee less arrived',
    note: 'Trade Republic\'s file. ActivoBank sent €505.20, €500.63 arrived. Both answers work, then apply.',
    r: () => {
      const head = (n, q) => stats(1, 1, n, answer === 'same' ? 1 : 0, q)
      if (answer === 'same') return head(2) + acc({ name: 'Trade Republic', kind: 'broker · 1 file', bal: bal('€12.40', '€513.03', 'Oct 7', '+€500.63', true), body:
        chips([[1, 'transfer', 'move'], [1, 'fee', 'new']]) +
        strip({ ...TR_BAL, out: '€4.57', inn: '€505.20', says: '€513.03', under: 'as the file shows' }) +
        `<div class="done">${svg('check')}<span>Same transfer — added once. Fee €4.57 saved as spending.</span><span class="sp"></span><button class="link" data-a="">undo</button></div>` }) + foot('Ready to save.', 1)
      if (answer === 'apart') return head(1) + acc({ name: 'Trade Republic', kind: 'broker · 1 file', bal: bal('€12.40', '€513.03', 'Oct 7', '+€500.63', true), body:
        chips([[1, 'new', 'new']]) +
        strip({ ...TR_BAL, out: '€0', inn: '€500.63', says: '€513.03', under: 'as the file shows' }) +
        `<div class="done">${svg('check')}<span>Not the same transfer. €500.63 saved as money in.</span><span class="sp"></span><button class="link" data-a="">undo</button></div>` }) + foot('Ready to save.', 1)
      return head(1, 1) + acc({ name: 'Trade Republic', kind: 'broker · 1 file', held: true, bal: balHeld('€12.40'), body:
        chips([[1, 'new', 'new']]) +
        strip({ ...TR_BAL, out: '€0', inn: '€500.63', says: '€513.03', under: 'as the file shows' }) +
        `<div class="off"><div class="q">${svg('swap')}<div><b>Is this the same transfer?</b><small>€4.57 less arrived, four days apart.</small></div></div>
          <div class="two">
            ${side({ name: 'ActivoBank', day: 'Oct 6', text: 'Trade Republic', amount: '−€505.20', tag: 'already in the app', mine: true })}
            <div class="mid">${svg('arrow')}</div>
            ${side({ name: 'Trade Republic', day: 'Oct 2', text: 'Deposit', amount: '+€500.63', tag: 'new, in this file' })}
          </div>
          <div class="sum3">
            <div class="cell"><span>sent</span><b>€505.20</b></div>
            <div class="cell in"><span>arrived</span><b>€500.63</b></div>
            <div class="cell fee"><span>fee</span><b>€4.57</b></div>
          </div>
          <div class="ans ${busy ? 'busy-on' : ''}"><div class="opts"><button class="opt loud" data-a="same">same transfer, €4.57 fee</button><button class="opt" data-a="apart">not this one</button></div><div class="busy"><i class="spin"></i>saving…</div></div></div>` }) +
        foot('<b>Trade Republic not saved</b> — 1 question open.', 0, true)
    },
    saved: () => answer === 'same'
      ? [{ name: 'Trade Republic', sub: '1 transfer · 1 fee · Oct 2', chips: [[1, 'transfer', 'move'], [1, 'fee', 'new']], strip: { ...TR_BAL, out: '€4.57', inn: '€505.20', says: '€513.03', under: 'as the file shows' }, extra: transfer('ActivoBank', 'Trade Republic', '€505.20', 'Oct 6 in ActivoBank · Oct 2 in Trade Republic · fee €4.57', 'one transfer') }]
      : [{ name: 'Trade Republic', sub: '1 row · Oct 2', chips: [[1, 'new', 'new']], strip: { ...TR_BAL, out: '€0', inn: '€500.63', says: '€513.03', under: 'as the file shows' } }],
  },
  drop: {
    l: 'both files in one drop',
    note: 'Revolut\'s file and ActivoBank\'s screenshot dropped together. The €700 is in both: one transfer, each side once.',
    r: () => stats(2, 2, 5, 1) +
      transfer('ActivoBank', 'Revolut', '€700.00', 'Oct 3 in Revolut\'s file · Oct 6 in ActivoBank\'s screenshot', 'one transfer') +
      acc({ name: 'Revolut', bal: bal('€389.20', '€1,089.20', 'Oct 4', '+€700.00', true), body:
        chips([[1, 'transfer', 'move']]) + strip({ was: '€389.20', wasDay: 'Oct 2', out: '€0', inn: '€700.00', says: '€1,089.20', under: 'as the file shows' }) }) +
      acc({ name: 'ActivoBank', bal: bal('€1,358.41', '€90.35', 'Oct 11', '−€1,268.06'), body:
        chips([[3, 'new', 'new'], [1, 'transfer', 'move']]) + strip({ was: '€1,358.41', wasDay: 'Oct 2', out: '€1,268.06', says: '€90.35', under: 'as the screenshot shows' }) }) +
      foot('Ready to save.', 2),
    saved: () => [
      { name: 'Revolut', sub: '1 transfer · Oct 3', chips: [[1, 'transfer', 'move']], strip: { was: '€389.20', wasDay: 'Oct 2', out: '€0', inn: '€700.00', says: '€1,089.20', under: 'as the file shows' } },
      { name: 'ActivoBank', sub: '4 rows · Oct 3 – Oct 11', chips: [[3, 'new', 'new'], [1, 'transfer', 'move']], strip: { was: '€1,358.41', wasDay: 'Oct 2', out: '€1,268.06', says: '€90.35', under: 'as the screenshot shows' } }],
  },
  none: {
    l: 'no transfer',
    note: 'A file with no transfer between two accounts. As today.',
    r: () => stats(1, 1, 2, 0) + acc({ name: 'ActivoBank', bal: bal('€153.21', '€90.35', 'Oct 11', '−€62.86'), body:
      chips([[2, 'new', 'new'], [2, 'already added', 'had']]) + strip(ACTIVO_OCT11) }) + foot('Ready to save.', 1),
    saved: () => [{ name: 'ActivoBank', sub: '2 rows · Oct 3 – Oct 11', chips: [[2, 'new', 'new'], [2, 'already added', 'had']], strip: ACTIVO_OCT11 }],
  },
  twofit: {
    l: 'two transfers fit',
    note: 'Made-up amounts: €500.00 arrived, and two accounts each sent €500.00 that week. One press picks.',
    r: () => {
      const b = (inn, body, held) => acc({ name: 'Trade Republic', kind: 'broker · 1 file', held, bal: held ? balHeld('€513.03') : bal('€513.03', '€1,013.03', 'Oct 10', '+€500.00', true), body: body })
      const st = strip({ was: '€513.03', wasDay: 'Oct 7', out: '€0', inn: '€500.00', says: '€1,013.03', under: 'as the file shows' })
      if (answer === 'a' || answer === 'b') return stats(1, 1, 1, 1) + b(0, chips([[1, 'transfer', 'move']]) + st +
        `<div class="done">${svg('check')}<span>Same transfer as ${answer === 'a' ? 'ActivoBank, Oct 7' : 'Revolut, Oct 8'} — added once.</span><span class="sp"></span><button class="link" data-a="">undo</button></div>`) + foot('Ready to save.', 1)
      if (answer === 'apart') return stats(1, 1, 1, 0) + b(0, chips([[1, 'new', 'new']]) + st +
        `<div class="done">${svg('check')}<span>Not one of these. €500.00 saved as money in.</span><span class="sp"></span><button class="link" data-a="">undo</button></div>`) + foot('Ready to save.', 1)
      return stats(1, 1, 1, 0, 1) + b(0, chips([[1, 'new', 'new']]) + st +
        `<div class="off"><div class="q">${svg('swap')}<div><b>Which transfer is this?</b><small>Two transfers of €500.00 that week.</small></div></div>
          <div class="cands">
            ${side({ name: 'Trade Republic', day: 'Oct 9', text: 'Deposit', amount: '+€500.00', tag: 'new, in this file' })}
            ${`<div class="row2" ${busy ? 'style="opacity:.5;pointer-events:none"' : ''}>
              ${side({ name: 'ActivoBank', day: 'Oct 7', text: 'Trade Republic', amount: '−€500.00', tag: 'already in the app', mine: true, pick: 'a' })}
              ${side({ name: 'Revolut', day: 'Oct 8', text: 'To Trade Republic', amount: '−€500.00', tag: 'already in the app', mine: true, pick: 'b' })}
            </div>`}
          </div>
          <div class="ans ${busy ? 'busy-on' : ''}"><div class="opts"><button class="opt" data-a="apart">not one of these</button></div><div class="busy"><i class="spin"></i>saving…</div></div></div>`, true) +
        foot('<b>Trade Republic not saved</b> — 1 question open.', 0, true)
    },
    saved: () => [{ name: 'Trade Republic', sub: answer === 'apart' ? '1 row · Oct 9' : '1 transfer · Oct 9', chips: [answer === 'apart' ? [1, 'new', 'new'] : [1, 'transfer', 'move']], strip: { was: '€513.03', wasDay: 'Oct 7', out: '€0', inn: '€500.00', says: '€1,013.03', under: 'as the file shows' } }],
  },
}
let phone = false
function draw() {
  const sheet = document.getElementById('sheet')
  const before = sheet.getBoundingClientRect().height
  document.getElementById('wrap').classList.toggle('phone', phone)
  document.getElementById('scen').innerHTML = Object.entries(S).map(([k, s]) => `<button class="${k === on ? 'on' : ''}" data-k="${k}">${s.l}</button>`).join('') + `<button class="${phone ? 'on' : ''}" data-phone>phone width</button>`
  document.getElementById('note').innerHTML = S[on].note
  document.getElementById('title').textContent = step === 'saved' ? '[ saved ]' : '[ check it ]'
  document.getElementById('body').innerHTML = step === 'saved' ? saved(S[on].saved()) : S[on].r()
  /* The sheet glides between steps. */
  sheet.style.height = 'auto'
  const after = sheet.getBoundingClientRect().height
  if (before && Math.abs(before - after) > 1) {
    sheet.style.height = before + 'px'
    sheet.getBoundingClientRect()
    sheet.style.height = after + 'px'
    setTimeout(() => { if (sheet.style.height === after + 'px') sheet.style.height = 'auto' }, 380)
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b || busy || step === 'saving') return
  if (b.dataset.phone !== undefined) { phone = !phone; draw() }
  else if (b.dataset.k) { on = b.dataset.k; answer = null; step = 'check'; draw() }
  else if (b.dataset.apply !== undefined) { step = 'saving'; draw(); setTimeout(() => { step = 'saved'; draw() }, 1100) }
  else if (b.dataset.a !== undefined) {
    const next = b.dataset.a || null
    if (next === null) { answer = null; step = 'check'; draw(); return }
    busy = true; draw()
    setTimeout(() => { busy = false; answer = next; draw() }, 700)
  }
})
draw()
</script>
</body>
</html>
